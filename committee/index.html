    <div class="note" style="margin-bottom:16px;">
      Pick a date to see what's already scheduled and remove anything still unbooked. Adding more is self-service
      too — between <b>${esc(SLOT_EXTENSION_START)}</b> and <b>${esc(SLOT_EXTENSION_END)}</b>. A day starting from
      nothing needs at least ${SLOT_EXTENSION_MIN_PER_DAY} different times in one go; once a day already has that
      many, add just one more if that's all you need. Every slot runs your committee's own established interview
      length.
    </div>

    <div class="panel" style="max-width:520px;margin-bottom:20px;">
      <h3 class="sec" style="margin-top:0;padding-top:0;border-top:0;">Every day you have slots on</h3>
      <div id="slots-overview"><div class="note">Loading…</div></div>
    </div>

    <div class="panel" style="max-width:520px;margin-bottom:20px;">
      <label for="slot-date">Date</label>
      <input type="date" id="slot-date">
      <div class="msg" id="slots-list-msg"></div>
      <div id="slots-list" style="margin-top:10px;"></div>
    </div>

    <div class="panel" style="max-width:520px;">
      <h3 class="sec" style="margin-top:0;padding-top:0;border-top:0;">Add more for this day</h3>
      <div class="note" id="add-slots-hint" style="margin-bottom:10px;">Pick a date above first.</div>
      <div id="slot-times">${slotTimeRowHtml()}</div>
      <button type="button" class="btn btn-sm btn-ghost" id="add-time-row">+ Add another time</button>

      <div class="actions">
        <button class="btn btn-gold" id="add-slots">Add these slots</button>
        <span class="msg" id="slots-msg"></span>
      </div>
    </div>`;

  loadSlotsOverview();
}

/**
 * Every day this committee has any slot on, with active/booked counts — the
 * answer to "how many slots exist and on what day" without already having
 * to know which date to type in. Each row jumps into that date's detail
 * view below.
 */
async function loadSlotsOverview() {
  const el = document.getElementById("slots-overview");
  try {
    const r = await api({ mode: "heads-list-slots", email: state.access.email });
    if (!r.slots.length) {
      el.innerHTML = `<div class="note">No interview slots exist yet for your committee.</div>`;
      return;
    }
    const byDate = new Map();
    for (const s of r.slots) {
      if (!byDate.has(s.date)) byDate.set(s.date, []);
      byDate.get(s.date).push(s);
    }
    const dates = [...byDate.keys()].sort();
    el.innerHTML = dates.map((date) => {
      const day = byDate.get(date);
      const active = day.filter((s) => s.active);
      const booked = active.filter((s) => s.booked).length;
      const short = active.length < SLOT_EXTENSION_MIN_PER_DAY && date >= SLOT_EXTENSION_START && date <= SLOT_EXTENSION_END;
      return `
        <button type="button" class="card" data-jump-date="${esc(date)}" style="width:100%;text-align:left;margin-bottom:8px;padding:11px 13px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <b>${esc(date)}</b>
            <span class="chip-status ${short ? "pending" : "sent"}">${active.length} active${booked ? ` · ${booked} booked` : ""}</span>
          </div>
        </button>`;
    }).join("");
  } catch (e) {
    el.innerHTML = `<div class="msg bad">${esc(e.message)}</div>`;
  }
}

function addTimeRow() {
  document.getElementById("slot-times").insertAdjacentHTML("beforeend", slotTimeRowHtml());
}

/** How many more active slots this date still needs to hit the daily minimum. */
function slotsStillNeeded() {
  const active = slotsForCurrentDate.filter((s) => s.active).length;
  return Math.max(0, SLOT_EXTENSION_MIN_PER_DAY - active);
}

function updateAddSlotsHint() {
  const hint = document.getElementById("add-slots-hint");
  if (!hint) return;
  const needed = slotsStillNeeded();
  hint.textContent = needed > 0
    ? `This day needs ${needed} more to reach ${SLOT_EXTENSION_MIN_PER_DAY} — add at least that many below.`
    : "This day already has its minimum — add as many or as few more as you like.";
}

/** Resets the time-input rows to match what this day still needs — one blank row once the minimum is met. */
function resetSlotTimeRows() {
  const count = Math.max(1, slotsStillNeeded());
  document.getElementById("slot-times").innerHTML = Array.from({ length: count }, slotTimeRowHtml).join("");
}

async function loadSlotsList() {
  const date = document.getElementById("slot-date")?.value;
  const listEl = document.getElementById("slots-list");
  const msg = document.getElementById("slots-list-msg");
  if (!date) { listEl.innerHTML = ""; slotsForCurrentDate = []; updateAddSlotsHint(); return; }

  msg.className = "msg"; msg.textContent = "Loading…";
  try {
    const r = await api({ mode: "heads-list-slots", email: state.access.email, date });
    msg.textContent = "";
    slotsForCurrentDate = r.slots;
    listEl.innerHTML = r.slots.length
      ? r.slots.map((s) => `
        <div class="slot-chip">
          <span>${esc(s.startTime)}–${esc(s.endTime)}</span>
          <span class="chip-status ${!s.active ? "pending" : s.booked ? "sent" : "draft"}">${
            !s.active ? "Removed" : s.booked ? "Booked" : "Open"
          }</span>
          ${s.active && !s.booked ? `<button type="button" class="chip-x" data-remove-slot="${esc(s.id)}" title="Remove">×</button>` : ""}
        </div>`).join("")
      : `<div class="note">No slots yet on this date.</div>`;
    updateAddSlotsHint();
    resetSlotTimeRows();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  }
}

async function removeSlot(slotId) {
  if (!(await confirmDialog("Remove this slot? It has to already be unbooked, and this can't be undone."))) return;
  try {
    await api({ mode: "heads-remove-slot", email: state.access.email, slotId });
    await loadSlotsList();
    await loadSlotsOverview();
  } catch (e) {
    const msg = document.getElementById("slots-list-msg");
    msg.className = "msg bad"; msg.textContent = e.message;
  }
}

async function addSlots() {
  const dateInput = document.getElementById("slot-date");
  const msg = document.getElementById("slots-msg");
  const btn = document.getElementById("add-slots");
  const date = dateInput?.value;
  const times = [...document.querySelectorAll(".slot-time-input")]
    .map((input) => input.value.trim())
    .filter(Boolean);

  if (!date) { msg.className = "msg bad"; msg.textContent = "Pick a date first."; return; }
  if (!times.length) { msg.className = "msg bad"; msg.textContent = "Add at least one time."; return; }
  const needed = slotsStillNeeded();
  if (times.length < needed) {
    msg.className = "msg bad";
    msg.textContent = `This day still needs ${needed} to reach ${SLOT_EXTENSION_MIN_PER_DAY} — add ${needed - times.length} more.`;
    return;
  }

  if (!(await confirmDialog(`Add ${times.length} interview slots on ${date} for ${display(state.access.department)}?`))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Adding…";
  try {
    const r = await api({ mode: "heads-add-slots", email: state.access.email, date, times });
    msg.className = "msg ok";
    msg.textContent = `Added ${r.added.length}.${r.alreadyExisted.length ? ` ${r.alreadyExisted.length} already existed.` : ""}`;
    await loadSlotsList();
    await loadSlotsOverview();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("view-slots").addEventListener("click", (e) => {
  if (e.target.id === "add-time-row") { addTimeRow(); return; }
  if (e.target.closest("[data-remove-time]")) { e.target.closest(".row2").remove(); return; }
  if (e.target.id === "add-slots") { addSlots(); return; }
  const removeBtn = e.target.closest("[data-remove-slot]");
  if (removeBtn) { removeSlot(removeBtn.dataset.removeSlot); return; }
  const jumpBtn = e.target.closest("[data-jump-date]");
  if (jumpBtn) {
    document.getElementById("slot-date").value = jumpBtn.dataset.jumpDate;
    loadSlotsList();
    document.getElementById("slot-date").scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
document.getElementById("view-slots").addEventListener("change", (e) => {
  if (e.target.id === "slot-date") loadSlotsList();
});

function readScores() {
  const scores = {};
  for (const input of document.querySelectorAll("[data-criterion]")) {
    const raw = input.value.trim();
    if (raw !== "") scores[input.dataset.criterion] = Number(raw);
  }
  return scores;
}

function updateRunningTotal() {
  const el = document.getElementById("running");
  if (!el) return;
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  const rubric = applicant && rubricFor(applicant);
  if (!rubric) { el.textContent = ""; return; }
  const total = totalScore(rubric, readScores());
  el.textContent = total === null ? "Incomplete" : `${total} / 100`;
}

/* ── actions ────────────────────────────────────────────────────────────── */

async function load(email) {
  const data = await api({ mode: "heads-committee-load", email });
  state.access = data.access;
  state.data = data;
  sessionStorage.setItem("committeeEmail", data.access.email);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("portal").classList.remove("hidden");
  document.getElementById("bar-title").textContent = display(data.access.department);
  document.getElementById("bar-sub").textContent = `${data.access.name} · ${data.access.positionType}`;
  renderTabs(); renderList(); renderPanel(); renderTeam();
}

async function save() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant || state.busy) return;
  const rubric = rubricFor(applicant);
  const scores = readScores();
  const btn = document.getElementById("save");

  state.busy = true; btn.disabled = true; btn.textContent = "Saving…";
  try {
    await api({
      mode: "heads-save-score",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      headRole: applicant.headName || "",
      preference: applicant.preference || "",
      scores,
      total: rubric ? totalScore(rubric, scores) : null,
      notes: document.getElementById("notes").value,
      taskLink: document.getElementById("task-link").value.trim()
    });
    await load(state.access.email);
    document.getElementById("saved").textContent = "Saved";
  } catch (e) {
    document.getElementById("saved").textContent = e.message;
  } finally {
    state.busy = false;
    const b = document.getElementById("save");
    if (b) { b.disabled = false; b.textContent = "Save"; }
  }
}

/* ── wiring ─────────────────────────────────────────────────────────────── */

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.classList.add("hidden");
  if (!email) { err.textContent = "Enter your AUC email."; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try { await load(email); }
  catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  finally { btn.disabled = false; btn.textContent = "Enter portal"; }
});

document.getElementById("email").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  state.tab = tab.dataset.tab; state.selected = null;
  renderTabs(); renderList(); renderPanel();
});

document.getElementById("views").addEventListener("click", (e) => {
  const view = e.target.closest("[data-view]");
  if (!view) return;
  state.view = view.dataset.view; state.teamMsg = null;
  document.getElementById("view-applicants").classList.toggle("hidden", state.view !== "applicants");
  document.getElementById("view-team").classList.toggle("hidden", state.view !== "team");
  document.getElementById("view-onboarding").classList.toggle("hidden", state.view !== "onboarding");
  document.getElementById("view-slots").classList.toggle("hidden", state.view !== "slots");
  for (const btn of document.querySelectorAll("#views [data-view]")) {
    btn.setAttribute("aria-selected", btn.dataset.view === state.view);
  }
  if (state.view === "team") renderTeam();
  if (state.view === "onboarding") renderOnboarding();
  if (state.view === "slots") renderSlotsForm();
});

document.getElementById("view-team").addEventListener("click", (e) => {
  const wlAdd = e.target.closest("[data-wl-add]");
  if (wlAdd) { addToWaitlist(wlAdd.dataset.wlAdd); return; }
  const wlRemove = e.target.closest("[data-wl-remove]");
  if (wlRemove) { removeFromWaitlist(wlRemove.dataset.wlRemove, wlRemove.dataset.wlEmail); return; }
  const assignBtn = e.target.closest("[data-assign]");
  if (assignBtn) { assignToTeam(assignBtn.dataset.assign, assignBtn.dataset.assignHead || null); return; }
  const reallocBtn = e.target.closest("[data-realloc-add]");
  if (reallocBtn) {
    const headId = reallocBtn.dataset.reallocAdd;
    const email = document.querySelector(`[data-realloc-email="${CSS.escape(headId)}"]`)?.value;
    const position = document.querySelector(`[data-realloc-position="${CSS.escape(headId)}"]`)?.value;
    if (email) assignToTeam(email, headId, position);
    return;
  }
  const unassignBtn = e.target.closest("[data-unassign]");
  if (unassignBtn) { unassignFromTeam(unassignBtn.dataset.unassign); return; }
  if (e.target.id === "confirm-team") confirmTeam();
});

document.getElementById("list").addEventListener("click", (e) => {
  const card = e.target.closest("[data-email]");
  if (!card) return;
  state.selected = card.dataset.email;
  renderList(); renderPanel();
});

document.getElementById("panel").addEventListener("input", (e) => {
  if (e.target.dataset.criterion) updateRunningTotal();
});
document.getElementById("panel").addEventListener("click", (e) => {
  if (e.target.id === "save") save();
  if (e.target.id === "set-state") setState();
  if (e.target.id === "reschedule") reschedule();
  if (e.target.id === "cancel-interview") cancelInterview();
  if (e.target.id === "avail-yes") setSecondPreferenceAvailability(true);
  if (e.target.id === "avail-no") setSecondPreferenceAvailability(false);
  if (e.target.id === "toggle-release") toggleRelease(state.selected, e.target.dataset.release === "true");
});

async function setSecondPreferenceAvailability(available) {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!available && !(await confirmDialog(
    `Tell HR your committee can't cover ${applicant.fullName}'s interview on ${applicant.interviewSlot}? ` +
    "They will need to find a third interviewer."
  ))) return;

  const yesBtn = document.getElementById("avail-yes");
  const noBtn = document.getElementById("avail-no");
  if (yesBtn) yesBtn.disabled = true;
  if (noBtn) noBtn.disabled = true;
  try {
    await api({
      mode: "heads-confirm-second-availability",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      available
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
  } catch (e) {
    alert(e.message);
    if (yesBtn) yesBtn.disabled = false;
    if (noBtn) noBtn.disabled = false;
  }
}

async function cancelInterview() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("cancel-interview");
  if (!(await confirmDialog(`Withdraw ${applicant.fullName}'s application?\n\n` +
    `Their interview on ${applicant.interviewSlot} is cancelled, the slot goes back on the board, ` +
    "and they are emailed to say the application is withdrawn. Use Reschedule instead if they only want another time."))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Cancelling…";
  try {
    const r = await api({
      mode: "heads-cancel-interview",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
    const m = document.getElementById("int-msg");
    if (m) { m.className = "msg ok"; m.textContent = `Cancelled.${r.emailSent ? " Applicant emailed." : " Email not sent."}`; }
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

async function setState() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("set-state");
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  try {
    await api({
      mode: "heads-set-interview-status",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      interviewStatus: document.getElementById("state").value
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

async function reschedule() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("reschedule");
  const date = document.getElementById("re-date").value;
  const startTime = document.getElementById("re-time").value;
  if (!date || !startTime) { msg.className = "msg bad"; msg.textContent = "Pick a date and time."; return; }
  if (!(await confirmDialog(`Move ${applicant.fullName}'s interview to ${date} at ${startTime}? This emails them.`))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Rescheduling…";
  try {
    const r = await api({
      mode: "heads-committee-reschedule",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      date, startTime
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
    const m = document.getElementById("int-msg");
    if (m) { m.className = "msg ok"; m.textContent = `Moved.${r.emailSent ? " Applicant emailed." : " Email not sent."}`; }
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

document.getElementById("refresh").addEventListener("click", () => load(state.access.email));
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("committeeEmail");
  location.reload();
});

const saved = sessionStorage.getItem("committeeEmail");
if (saved) load(saved).catch(() => sessionStorage.removeItem("committeeEmail"));
</script>
</body>
