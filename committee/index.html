<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Committee Portal — Resala AUC</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* Brand tokens. Royal Blue is a light-ground colour and never carries text on
     a dark surface; Sky Blue does that job. */
  :root {
    --blue: #0c2c80; --sky: #a7d4f2; --gold: #eac262;
    --ivory: #fdf9f3; --ink: #1b1f23;
    --line: #e4dccd; --muted: #6b7280; --soft: #f7f4ee;
    --good: #1a7f4b; --warn: #9a6b00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ivory); color: var(--ink);
    font: 15px/1.6 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* ── login ─────────────────────────────────────────────────────────────── */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line);
    border-radius: 18px; padding: 34px 30px; text-align: center;
  }
  .login-card img { width: 68px; height: 68px; margin: 0 auto 16px; display: block; }
  .login-card h1 { margin: 0 0 6px; font-size: 21px; color: var(--blue); }
  .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 700;
          text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
  input[type=email], input[type=url], textarea, select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--soft); color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--sky); outline-offset: 1px; background: #fff; }
  .btn {
    background: var(--blue); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 18px; font-weight: 700;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
  .btn-block { width: 100%; margin-top: 18px; }
  .error {
    margin-top: 14px; padding: 10px 12px; border-radius: 9px;
    background: #fdecec; color: #8c1c1c; font-size: 13px; text-align: left;
  }

  /* ── shell ─────────────────────────────────────────────────────────────── */
  header.bar {
    background: var(--blue); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header.bar img { width: 38px; height: 38px; }
  .bar-title { font-weight: 700; font-size: 17px; }
  .bar-sub { color: var(--sky); font-size: 12.5px; }
  .bar-spacer { flex: 1; }
  header.bar button {
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; padding: 7px 13px; font-size: 13px;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab {
    background: #fff; border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; font-size: 14px; color: var(--ink);
  }
  .tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .tab .n { opacity: .7; margin-left: 5px; }

  .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--line);
    border-radius: 13px; padding: 13px 15px; display: grid; gap: 3px;
  }
  .card:hover { border-color: var(--gold); }
  .card[aria-current="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(12,44,128,.12); }
  .card .nm { font-weight: 700; }
  .card .meta { font-size: 12.5px; color: var(--muted); }
  .rank { font-size: 12px; font-weight: 700; color: var(--muted); }
  .score-pill {
    display: inline-block; background: var(--blue); color: #fff; border-radius: 999px;
    padding: 2px 10px; font-size: 12.5px; font-weight: 700;
  }
  .score-pill.partial { background: var(--gold); color: var(--ink); }
  .score-pill.none { background: var(--soft); color: var(--muted); }
  /* Only committees that collect work before the interview show this. */
  .task-pill {
    display: inline-block; border-radius: 999px; padding: 2px 10px;
    font-size: 12.5px; font-weight: 700; background: #e8f5ee; color: #14663d;
  }
  .task-pill.due { background: #fdecec; color: #8c1c1c; }
  .task-pill.draft { background: #fdf4e0; color: var(--warn); }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
  .panel h2 { margin: 0 0 2px; font-size: 22px; color: var(--blue); }
  .panel .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; margin-bottom: 20px; }
  .facts b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; }
  .qa { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
  .qa .q { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .qa .a { white-space: pre-wrap; color: #3f4650; margin-bottom: 16px; }
  h3.sec {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    margin: 26px 0 10px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .crit { margin-bottom: 18px; }
  .crit-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .crit-head .name { font-weight: 700; }
  .crit-head .w { font-size: 12.5px; color: var(--muted); }
  .anchor { font-size: 13px; color: #3f4650; background: var(--soft); border-left: 3px solid var(--line); padding: 8px 11px; border-radius: 4px; margin: 7px 0; }
  .anchor.full { border-left-color: var(--good); }
  .anchor.low { border-left-color: #c0392b; }
  .anchor .lbl { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .7px; }
  .crit input[type=number] { width: 96px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); }
  textarea { min-height: 120px; resize: vertical; }
  .total { font-size: 17px; font-weight: 700; color: var(--blue); }
  .others { font-size: 13.5px; }
  .others .row { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .note { font-size: 13px; color: var(--muted); }
  .banner { padding: 11px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; }
  .banner.warn { background: #fdf4e0; color: var(--warn); }
  .banner.ok { background: #e8f6ee; color: var(--good); }
  .empty { color: var(--muted); padding: 28px 4px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .state { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; }
  .state.done  { background: #e8f6ee; color: var(--good); }
  .state.noshow{ background: #fdecec; color: #a3231b; }
  .state.notdone { background: var(--soft); color: var(--muted); }
  .state.pending { background: #fdf4e0; color: var(--warn); }
  /* Withdrawn is not "not done": nobody is waiting on this interview. */
  .state.cancelled { background: #efe7f5; color: #5b3d78; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row2 > div { flex: 1 1 140px; }
  .row2 .go { flex: 0 0 auto; }
  input[type=date], input[type=time] { width: 100%; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--soft); color: var(--ink); }
  .msg { font-size: 13.5px; margin-top: 9px; }
  .msg.ok { color: var(--good); }
  .msg.bad { color: #a3231b; }

  /* ── team diagram ──────────────────────────────────────────────────────── */
  .views { display: flex; gap: 8px; margin-bottom: 18px; }
  .team-summary {
    display: flex; gap: 10px 20px; flex-wrap: wrap; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 20px;
  }
  .team-summary .count { font-size: 13.5px; color: var(--muted); }
  .team-summary .count b { color: var(--ink); }
  .team-summary .go { margin-left: auto; }
  h2.sec2 { font-size: 15px; color: var(--blue); margin: 0 0 12px; }
  /* One role per row, full width — reviewing is "who's up for this role",
     not a grid you scan corner to corner. */
  .team-roles { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
  .role-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .role-box.missing { border-color: #e3b96a; background: #fffaf0; }
  .role-box-title { font-weight: 700; font-size: 16px; margin-bottom: 13px; }
  .role-box-body { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .role-box-body { grid-template-columns: 1fr; } }
  .slot-group { margin-bottom: 11px; }
  .slot-group:last-child { margin-bottom: 0; }
  .candidate-list { display: flex; flex-direction: column; gap: 8px; }
  .reallocate { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .reallocate select { font-size: 13px; }
  .slot-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); font-weight: 700; margin-bottom: 6px;
  }
  .slot-chip {
    display: flex; align-items: center; gap: 7px; background: var(--soft);
    border-radius: 9px; padding: 6px 9px; margin-bottom: 6px; font-size: 13.5px;
  }
  .chip-status {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 1px 7px; border-radius: 999px; flex: 0 0 auto;
  }
  .chip-status.draft { background: #fdf4e0; color: var(--warn); }
  .chip-status.submitted { background: #e8effd; color: var(--blue); }
  .chip-status.sent { background: #e8f6ee; color: var(--good); }
  .chip-status.pending { background: #fdecec; color: #a3231b; }
  .chip-x {
    margin-left: auto; background: none; border: 0; color: var(--muted);
    font-size: 16px; line-height: 1; padding: 2px 4px; flex: 0 0 auto;
  }
  .chip-x:hover { color: #a3231b; }
  .pool-grid { display: grid; gap: 10px; }
  .pool-card { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 13px 15px; }
  .pool-card .nm { font-weight: 700; }
  .pool-card .meta { font-size: 12.5px; color: var(--muted); }

  /* In-page confirm, replacing window.confirm(): on mobile, a browser can
     silently start refusing to show native confirm/alert dialogs after a
     couple of them fire in quick succession — no popup, no error, confirm()
     just returns false, so the action it guards quietly does nothing. This
     dialog is a normal page element instead, so it always renders. */
  dialog#confirm-dialog { border: 0; border-radius: 16px; padding: 0; max-width: 420px; width: calc(100% - 40px); box-shadow: 0 24px 60px rgba(0,0,0,.24); }
  dialog#confirm-dialog::backdrop { background: rgba(12,26,50,.5); }
  .confirm-body { padding: 22px 24px; }
  .confirm-body p { margin: 0 0 20px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<dialog id="confirm-dialog">
  <div class="confirm-body">
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-gold" id="confirm-ok">Confirm</button>
    </div>
  </div>
</dialog>

<!-- login ─────────────────────────────────────────────────────────────────── -->
<div class="login" id="login">
  <div class="login-card">
    <img src="https://upnmxdgqdkvgzfwqaicb.supabase.co/storage/v1/object/public/resala-logo/Resala%20Logo%20-%20source.png" alt="Resala AUC">
    <h1>Committee Portal</h1>
    <p>Heads recruitment. Sign in with the AUC email on your board record.</p>
    <label for="email">AUC email</label>
    <input type="email" id="email" placeholder="you@aucegypt.edu" autocomplete="email">
    <button class="btn btn-block" id="login-btn">Enter portal</button>
    <div class="error hidden" id="login-error"></div>
  </div>
</div>

<!-- portal ────────────────────────────────────────────────────────────────── -->
<div class="hidden" id="portal">
  <header class="bar">
    <img src="https://upnmxdgqdkvgzfwqaicb.supabase.co/storage/v1/object/public/resala-logo/Resala%20Logo%20-%20source.png" alt="">
    <div>
      <div class="bar-title" id="bar-title">—</div>
      <div class="bar-sub" id="bar-sub">—</div>
    </div>
    <div class="bar-spacer"></div>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>

  <main>
    <div class="views" role="tablist" id="views">
      <button class="tab" data-view="applicants" aria-selected="true">Applicants</button>
      <button class="tab" data-view="team" aria-selected="false">Team diagram</button>
      <button class="tab" data-view="slots" aria-selected="false">Slots</button>
    </div>

    <div id="view-applicants">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="layout">
        <div>
          <div class="list" id="list"></div>
          <div class="empty hidden" id="list-empty">No applicants here yet.</div>
        </div>
        <div class="panel" id="panel"><div class="empty">Select an applicant.</div></div>
      </div>
    </div>

    <div id="view-team" class="hidden"></div>
    <div id="view-slots" class="hidden"></div>
  </main>
</div>

<script type="module">
import { getRubric, totalScore } from "../scoring-rubrics.js";
import { getInterviewConfig } from "../interview-config.js";
import { getRoleGuideById } from "../role-guide-data.js";

const ENDPOINT = "https://upnmxdgqdkvgzfwqaicb.supabase.co/functions/v1/submit";

/* The sheet stores the committee's display name; rubrics are keyed by id. Rows
   written before the heads tab existed have no id, so fall back to the name. */
const IDS_BY_NAME = {
  "tech director": "tech-director",
  "operations": "operations",
  "branding / media": "branding-media",
  "hr": "hr",
  "pr / fundraising": "pr-fundraising",
  "visits": "visits",
  "children day director": "children-day-director",
  "initiatives director": "initiatives-director"
};

const DISPLAY_NAMES = {
  "tech director": "Tech Team",
  "initiatives director": "Initiatives",
  "children day director": "Children\u2019s Day"
};
const norm = (v) => String(v ?? "").trim().toLowerCase();

/* Applicant records carry the raw committee name, which still ends in
   "Director" — a person's position, never a committee's name. Everything a
   human reads goes through here. Second preferences arrive as
   "Committee — Head", so the committee half is renamed and the head passed on. */
const display = (v) => {
  const [committee, ...rest] = String(v ?? "").trim().split("—");
  const head = rest.join("—").trim();
  const named = DISPLAY_NAMES[norm(committee)] ?? committee.trim();
  return head ? `${named} — ${head}` : named;
};
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/*
 * Replaces window.confirm(): on mobile, a browser can quietly stop showing
 * native confirm/alert dialogs after a couple fire in quick succession — no
 * popup, no error, confirm() just returns false. Whatever it guarded then
 * does nothing, with no sign of why. A dialog built from page elements always
 * renders, because it is not that native chrome.
 */
function confirmDialog(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById("confirm-dialog");
    document.getElementById("confirm-message").textContent = message;
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    const finish = (result) => {
      dlg.close();
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      dlg.removeEventListener("cancel", onCancel);
      resolve(result);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    dlg.addEventListener("cancel", onCancel); // Esc key
    dlg.showModal();
  });
}

let state = {
  access: null, tab: "firstPreference", data: null, selected: null, busy: false,
  view: "applicants", teamMsg: null
};

async function api(payload) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const body = await res.json();
  if (!res.ok || body.ok === false) throw new Error(body.error || "Something went wrong.");
  return body;
}

function committeeIdOf(applicant) {
  return applicant.committeeId || IDS_BY_NAME[norm(applicant.committee || applicant.roleAppliedFor)] || "";
}

/* HR weights its criteria differently per head, so the rubric needs the head
   key. Migrated rows carry only the head's display name. */
function headIdOf(applicant) {
  if (applicant.headId) return applicant.headId;
  const name = norm(applicant.headName);
  for (const key of ["engagement", "inclusion", "tracking", "recognition"]) {
    if (name.includes(key)) return key;
  }
  return "";
}

function rubricFor(applicant) {
  return getRubric(committeeIdOf(applicant), headIdOf(applicant));
}

const STATES = ["Not Done", "Done", "No Show", "Pending"];
const stateLabel = (a) => String(a.interviewStatus || "").trim() || "Not Done";
const stateClass = (a) => ({
  "done": "done", "no show": "noshow", "pending": "pending",
  "cancelled": "cancelled", "withdrawn": "cancelled"
}[norm(stateLabel(a))] ?? "notdone");

/** This interviewer's own saved score for an applicant, if any. */
function myScore(applicant) {
  return (applicant.scores || []).find((s) => norm(s.interviewerEmail) === norm(state.access.email)) || null;
}

/** Panel average, used for ranking. Null until at least one score exists. */
function rankScore(applicant) {
  const totals = (applicant.scores || [])
    .map((s) => Number(s.total))
    .filter((n) => Number.isFinite(n));
  if (!totals.length) return null;
  return totals.reduce((a, b) => a + b, 0) / totals.length;
}

/* ── rendering ──────────────────────────────────────────────────────────── */

function renderTabs() {
  const tabs = [
    ["firstPreference", "First preference"],
    ["secondPreference", "Second preference"],
    ["assigned", "Assigned to me"]
  ];
  document.getElementById("tabs").innerHTML = tabs.map(([key, label]) => `
    <button class="tab" role="tab" data-tab="${key}" aria-selected="${state.tab === key}">
      ${label}<span class="n">${(state.data?.[key] ?? []).length}</span>
    </button>`).join("");
}

function currentList() {
  // Ranked by panel average. Unscored applicants sink below scored ones rather
  // than counting as zero, which would rank them against people who were judged.
  return [...(state.data?.[state.tab] ?? [])].sort((a, b) => {
    const sa = rankScore(a), sb = rankScore(b);
    if (sa === null && sb === null) return String(a.fullName).localeCompare(String(b.fullName));
    if (sa === null) return 1;
    if (sb === null) return -1;
    return sb - sa;
  });
}

function renderList() {
  const list = currentList();
  const el = document.getElementById("list");
  document.getElementById("list-empty").classList.toggle("hidden", list.length > 0);

  el.innerHTML = list.map((a, i) => {
    const score = rankScore(a);
    const mine = myScore(a);
    const cls = score === null ? "none" : mine ? "" : "partial";
    const label = score === null ? "Not scored" : `${Math.round(score)}/100`;
    return `
      <button class="card" data-email="${esc(a.email)}" aria-current="${norm(a.email) === norm(state.selected)}">
        <div class="rank">${score === null ? "—" : "#" + (i + 1)}</div>
        <div class="nm">${esc(a.fullName)}</div>
        <div class="meta">${esc(a.headName || display(a.roleAppliedFor))}</div>
        <div class="meta">${esc(a.interviewSlot || "No slot booked")}</div>
        <div><span class="score-pill ${cls}">${label}</span>
             <span class="state ${stateClass(a)}">${esc(stateLabel(a))}</span>
             ${expectsTask(a)
               ? `<span class="task-pill ${submittedLink(a) ? "" : "due"}">${submittedLink(a) ? "Task in" : "Task due"}</span>`
               : ""}
             ${a.accepted ? `<span class="task-pill">Accepted</span>` : a.acceptedDraft ? `<span class="task-pill draft">Drafted</span>` : ""}</div>
      </button>`;
  }).join("");
}

function renderCriterion(criterion, value, headId) {
  const id = `crit-${criterion.name.replace(/\W+/g, "-")}`;
  /* PR scores Skills against a list that differs per head — "6-4 skills" means
     nothing without knowing which six. */
  const skills = criterion.skillsByRole?.[headId];
  const anchors = criterion.bands
    // PR grades in three bands with their own point ranges.
    ? criterion.bands.map((band) => `
        <div class="anchor full">
          <span class="lbl">${esc(band.label)} · ${band.range[0]}–${band.range[1]}</span><br>${esc(band.text)}
        </div>`).join("")
    : `<div class="anchor full"><span class="lbl">Full marks</span><br>${esc(criterion.anchors.full)}</div>
       <div class="anchor low"><span class="lbl">Low marks</span><br>${esc(criterion.anchors.low)}</div>`;

  return `
    <div class="crit">
      <div class="crit-head">
        <span class="name">${esc(criterion.name)}</span>
        <span class="w">out of ${criterion.weight}${criterion.lookFor ? " · look for " + esc(criterion.lookFor) : ""}</span>
      </div>
      ${anchors}
      ${skills ? `<div class="anchor full"><span class="lbl">Skills for this head</span><br>${esc(skills)}</div>` : ""}
      <input type="number" id="${id}" data-criterion="${esc(criterion.name)}"
             min="0" max="${criterion.weight}" step="1"
             value="${value === undefined || value === null ? "" : esc(value)}"
             placeholder="0–${criterion.weight}">
    </div>`;
}

/* There is one interview per applicant, run by the committee they put first.
   A second preference and an assigned third interviewer are guests on it:
   they score, they join, but they never move or cancel it — otherwise the
   committee actually running it finds out their slot changed from the
   applicant. The backend enforces this too; this only hides what would fail. */
function runsThisInterview(applicant) {
  /* Against the viewer's own department, not the row's committee: a third
     interviewer assigned to score the FIRST preference would otherwise pass
     this check while belonging to another committee entirely. */
  return normalizeRole(state.access?.department) === normalizeRole(applicant.roleAppliedFor);
}

const normalizeRole = (v) => String(v ?? "").trim().toLowerCase().replaceAll("/", " ").replace(/\s+/g, " ");

/* Whether this applicant's committee collects work before the interview, read
   from the same config the booking flow and the emails use — so adding a task
   to another committee lights this portal up without touching it. */
function expectsTask(applicant) {
  const task = getInterviewConfig(committeeIdOf(applicant))?.task;
  return Boolean(task?.required && task.submissionUrl);
}

const submittedLink = (a) => {
  const link = String(a.taskLink || "").trim();
  return /^https?:\/\//.test(link) ? link : "";
};

/* Committees that collect a task before the interview: the work is the evidence
   the Skills section grades, so it belongs at the top of the panel, not buried.
   Applicants from every other committee simply have no link. */
function taskBanner(applicant) {
  const link = submittedLink(applicant);
  if (!link) {
    return expectsTask(applicant)
      ? `<div class="banner warn">No task submitted yet. It is due an hour before the interview and carries the
         Skills score — if the slot is close, chase it.</div>`
      : "";
  }
  const when = String(applicant.taskSubmittedAt || "").slice(0, 16).replace("T", " ");
  return `<div class="banner ok">Task submitted${when ? ` ${esc(when)}` : ""}:
    <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div>`;
}

/* There is no second interview slot — a second preference only ever rides
   along on the interview the applicant already booked with their first
   choice. So this asks one question: can this committee actually staff that
   existing time. A "No" is what should send HR to assign someone else. */
function availabilityBlock(applicant) {
  const status = String(applicant.secondPreferenceAvailability || "").trim();
  const when = String(applicant.secondPreferenceAvailabilitySetAt || "").slice(0, 16).replace("T", " ");
  const disabledIf = !applicant.interviewSlot;

  const statusLine = status
    ? `<div class="banner ${status === "Available" ? "ok" : "warn"}">
        ${status === "Available" ? "Marked available" : "Marked not available"} for ${esc(applicant.interviewSlot || "this interview")}${when ? ` · ${esc(when)}` : ""}.
      </div>`
    : `<div class="banner warn">Not answered yet: can your committee join this applicant's interview
       ${applicant.interviewSlot ? `on <b>${esc(applicant.interviewSlot)}</b>` : ""}? Say so below, so HR knows
       whether to find someone else.</div>`;

  return `${statusLine}
    <div class="row2" style="margin-bottom:18px;">
      <div class="go"><button class="btn btn-sm ${status === "Available" ? "btn-gold" : "btn-ghost"}"
        id="avail-yes" ${disabledIf ? "disabled" : ""}>We can make it</button></div>
      <div class="go"><button class="btn btn-sm ${status === "Not Available" ? "btn-gold" : "btn-ghost"}"
        id="avail-no" ${disabledIf ? "disabled" : ""}>We can't make it</button></div>
    </div>`;
}

function renderPanel() {
  const panel = document.getElementById("panel");
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) { panel.innerHTML = `<div class="empty">Select an applicant.</div>`; return; }

  const rubric = rubricFor(applicant);
  const mine = myScore(applicant);
  const others = (applicant.scores || []).filter((s) => norm(s.interviewerEmail) !== norm(state.access.email));

  const facts = [
    ["Email", applicant.email],
    ["Phone", applicant.phone],
    ["Major", applicant.major],
    ["Year", applicant.yearLevel],
    ["Interview", applicant.interviewSlot || "Not booked"],
    ["Status", applicant.interviewStatus || applicant.status],
    /* Only where the committee collects work beforehand. Stated as a fact
       rather than left to the banner, so "did this one hand it in?" is
       answered in the same place as their slot and their phone number. */
    ["Task", expectsTask(applicant)
      ? (submittedLink(applicant) ? "Submitted" : "Not submitted")
      : ""]
  ].filter(([, v]) => String(v ?? "").trim());

  const answers = (applicant.answers || []).map((qa) => `
    <div class="q">${esc(qa.prompt)}</div>
    <div class="a">${esc(qa.answer) || "<span class='note'>No answer</span>"}</div>`).join("");

  // "2026-08-12 at 4:00 PM" -> date and 24h time for the inputs.
  const slotMatch = String(applicant.interviewSlot || "")
    .match(/^(\d{4}-\d{2}-\d{2})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  let reDate = "", reTime = "";
  if (slotMatch) {
    reDate = slotMatch[1];
    let hour = Number(slotMatch[2]);
    const meridiem = (slotMatch[4] || "").toUpperCase();
    if (meridiem === "PM" && hour !== 12) hour += 12;
    if (meridiem === "AM" && hour === 12) hour = 0;
    reTime = `${String(hour).padStart(2, "0")}:${slotMatch[3]}`;
  }

  const scoring = rubric
    ? rubric.criteria.map((c) => renderCriterion(c, mine?.scores?.[c.name], headIdOf(applicant))).join("")
    : `<div class="banner warn">${esc(display(applicant.committee || applicant.roleAppliedFor))} has no scoring rubric in its
       brief, so this interview is recorded as notes only. Add a rubric to score it.</div>`;

  panel.innerHTML = `
    <h2>${esc(applicant.fullName)}</h2>
    <div class="sub">
      ${esc(applicant.headName || "—")} · ${esc(display(applicant.committee || applicant.roleAppliedFor))}
      ${applicant.preference === "Second" ? " · applied here as second preference" : ""}
      ${applicant.preference === "Assigned" ? " · you were assigned to this interview" : ""}
    </div>

    ${applicant.preference === "Second" ? `<div class="banner warn">Second preference. Their first choice is
       ${esc(display(applicant.roleAppliedFor))}, and the interview they booked follows that committee's questions.</div>` : ""}
    ${/^https?:\/\//.test(applicant.meetLink || "") ? `<div class="banner ok">Google Meet: <a href="${esc(applicant.meetLink)}">${esc(applicant.meetLink)}</a></div>` : ""}
    ${taskBanner(applicant)}
    ${applicant.preference === "Second" ? availabilityBlock(applicant) : ""}

    <div class="facts">
      ${facts.map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join("")}
    </div>

    <div class="qa">${answers || "<div class='note'>No answers recorded.</div>"}</div>

    ${others.length ? `<h3 class="sec">Also scored by</h3><div class="others">
      ${others.map((s) => `<div class="row"><b>${esc(s.interviewerName || s.interviewerEmail)}</b>
        ${s.interviewerPosition ? " · " + esc(s.interviewerPosition) : ""} — ${esc(s.total || "no total")}/100
        ${s.notes ? `<div class="note">${esc(s.notes)}</div>` : ""}</div>`).join("")}
    </div>` : ""}

    <h3 class="sec">Interview</h3>
    ${!runsThisInterview(applicant) ? `
      <div class="facts"><div><b>When</b>${esc(applicant.interviewSlot || "Not booked")}</div>
        <div><b>Status</b>${esc(stateLabel(applicant))}</div></div>
      <div class="note">${esc(display(applicant.roleAppliedFor))} runs this interview, so they are the ones who
        move, cancel, or mark it. You join it and score${applicant.preference === "Second"
          ? " your committee's side of it" : ""} — say above whether the time works for you, and they will
        arrange the rest.</div>
    ` : applicant.interviewSlot || applicant.reservationRowIndex ? `
      ${applicant.interviewSlot ? `
        <div class="row2" style="margin-bottom:10px;">
          <div>
            <label for="state">Did it happen?</label>
            <select id="state">
              ${STATES.map((v) => `<option value="${v}"${norm(v) === norm(stateLabel(applicant)) ? " selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
          <div class="go"><button class="btn btn-sm btn-ghost" id="set-state">Update</button></div>
        </div>
        <div class="note" style="margin-bottom:14px;">
          Mark <b>No Show</b> if they never joined. It is what the ranking and any follow-up read.
        </div>
      ` : `<div class="banner warn">This application was withdrawn and the slot went back on the board.
           If they change their mind, booking a time below puts them back in.</div>`}

      <div class="row2">
        <div><label for="re-date">Move to date</label><input type="date" id="re-date" value="${esc(reDate)}"></div>
        <div><label for="re-time">Start</label><input type="time" id="re-time" value="${esc(reTime)}"></div>
        <div class="go"><button class="btn btn-sm btn-ghost" id="reschedule">Reschedule</button></div>
      </div>
      <div class="note" style="margin-top:6px;">Moves the calendar event and emails the applicant. Agree the new time with them first.</div>

      ${applicant.interviewSlot ? `
        <div class="row2" style="margin-top:14px;">
          <div class="note">Only if they are pulling out altogether. This withdraws their application,
            frees the slot for someone else, and emails them. Moving them to another time is the
            reschedule above, not this.</div>
          <div class="go"><button class="btn btn-sm btn-ghost" id="cancel-interview">Withdraw application</button></div>
        </div>` : ""}
      <div class="msg" id="int-msg"></div>
    ` : `<div class="note">They never booked an interview, so there is nothing to mark or move.</div>`}

    <h3 class="sec">Your scoring${rubric ? ` · ${esc(rubric.source || "")}` : ""}</h3>
    ${scoring}

    <div class="crit">
      <label for="task-link">Task link</label>
      <input type="url" id="task-link" placeholder="https://…"
             value="${esc(mine?.taskLink || submittedLink(applicant))}">
      <div class="note" style="margin-top:6px;">${
        !mine?.taskLink && submittedLink(applicant)
          ? "Filled in from what they submitted before the interview. Replace it only if they sent something newer."
          : "Paste the work they sent or brought, so the panel can open it later."
      }</div>
    </div>

    <div class="crit">
      <label for="notes">Interview notes</label>
      <textarea id="notes" placeholder="What they actually said. Specifics beat impressions.">${esc(mine?.notes || "")}</textarea>
    </div>

    <div class="actions">
      <button class="btn btn-gold" id="save">Save</button>
      <span class="total" id="running"></span>
      <span class="note" id="saved">${mine ? "Last saved " + esc(String(mine.updatedAt).slice(0, 16).replace("T", " ")) : ""}</span>
    </div>

    <h3 class="sec">Accepting</h3>
    ${acceptStatus(applicant)}`;

  updateRunningTotal();
}

/*
 * A read-only summary of where this applicant stands. Placing and confirming
 * happens on the Team diagram tab, which sees every applicant reachable from
 * this committee at once — needed to tell what is still missing, which one
 * applicant in isolation cannot show.
 */
function acceptStatus(applicant) {
  const p = placementOn(applicant);

  // Held by some other committee's diagram — only possible to see this from
  // the applicant's actual first-preference committee, since that is the
  // only side whose own committee field never matches where someone else put
  // them. First preference has the claim, so this is where the call is made.
  if (applicant.acceptedStatus && !p) {
    const committeeName = display(applicant.committee || applicant.roleAppliedFor);
    const released = applicant.firstPreferenceReleased;
    const statusNote = { Draft: " — still a draft, not submitted yet.", Submitted: " — submitted, awaiting admin approval.", Yes: " — already approved and emailed." }[applicant.acceptedStatus] || "";
    return `
      <div class="banner warn">
        Wanted by <b>${esc(applicant.acceptedCommittee)}</b>, as ${esc(applicant.acceptedPosition)} of
        ${esc(applicant.acceptedRole)}${statusNote}
      </div>
      <div class="note" style="margin-bottom:10px;">
        ${esc(committeeName)} is their first preference, so nothing is final until you decide: claim them for
        ${esc(committeeName)} from the <b>Team diagram</b> tab, or release them so ${esc(applicant.acceptedCommittee)} can proceed.
      </div>
      <div class="actions">
        <button class="btn btn-sm ${released ? "btn-gold" : "btn-ghost"}" id="toggle-release" data-release="${released ? "false" : "true"}">
          ${released ? "Revoke release" : `Release to ${esc(applicant.acceptedCommittee)}`}
        </button>
        <span class="msg" id="release-msg"></span>
      </div>
      ${released ? `<div class="note" style="margin-top:8px;">Released${applicant.firstPreferenceReleasedAt ? " · " + esc(String(applicant.firstPreferenceReleasedAt).slice(0, 16).replace("T", " ")) : ""}.</div>` : ""}`;
  }

  if (!applicant.acceptedStatus) {
    return `<div class="note">Not on the diagram yet. Add them from the <b>Team diagram</b> tab above.</div>`;
  }
  const when = applicant.acceptedAt ? `· ${esc(String(applicant.acceptedAt).slice(0, 16).replace("T", " "))}` : "";
  if (applicant.acceptedStatus === "Yes") {
    return `<div class="banner ok">Approved as ${esc(applicant.acceptedPosition || "—")} of
      ${esc(applicant.acceptedRole || "—")} on ${esc(applicant.acceptedCommittee)}'s diagram, and emailed by the recruitment admin.</div>`;
  }
  if (applicant.acceptedStatus === "Submitted") {
    const submittedWhen = applicant.submittedAt ? `· ${esc(String(applicant.submittedAt).slice(0, 16).replace("T", " "))}` : "";
    return `<div class="banner warn">Submitted as ${esc(applicant.acceptedPosition || "—")} of
      ${esc(applicant.acceptedRole || "—")} ${submittedWhen}. Waiting on the recruitment admin to approve it — nothing is
      emailed until they do.</div>`;
  }
  if (applicant.preference !== "First" && !applicant.firstPreferenceReleased) {
    return `<div class="banner warn">Drafted as ${esc(applicant.acceptedPosition || "—")} of
      ${esc(applicant.acceptedRole || "—")} ${when}, but ${esc(display(applicant.roleAppliedFor))} is their first preference and
      has not released them yet. Cannot be submitted until they do.</div>`;
  }
  return `<div class="banner warn">Drafted as ${esc(applicant.acceptedPosition || "—")} of
    ${esc(applicant.acceptedRole || "—")} on ${esc(applicant.acceptedCommittee)}'s diagram ${when}. Not submitted yet —
    submit the diagram from the <b>Team diagram</b> tab to send it to the recruitment admin for approval.</div>`;
}

/* ── team diagram ───────────────────────────────────────────────────────── */

function myGuideId() {
  return IDS_BY_NAME[norm(state.access?.department)] || "";
}

/* Everyone relevant to this committee, deduped across the three tabs — the
   same reach scoring already grants, just gathered into one pool instead of
   picked one applicant at a time. */
function teamPool() {
  const seen = new Map();
  for (const list of [state.data?.firstPreference, state.data?.secondPreference, state.data?.assigned]) {
    for (const a of list ?? []) {
      const key = norm(a.email);
      if (!seen.has(key)) seen.set(key, a);
    }
  }
  return [...seen.values()];
}

/* Whichever role/position this applicant holds on THIS committee's diagram —
   null if they are unplaced, or placed on a different committee's diagram
   entirely (a second preference accepted elsewhere, say). */
function placementOn(applicant) {
  if (!applicant.acceptedStatus) return null;
  const committeeName = display(applicant.committee || applicant.roleAppliedFor);
  if (norm(applicant.acceptedCommittee) !== norm(committeeName)) return null;
  return { role: applicant.acceptedRole, position: applicant.acceptedPosition, status: applicant.acceptedStatus };
}

/* Drafted but stuck behind the applicant's first-preference committee, who
   has not released them yet — the only status a placement here can be in
   without also being ready to send. */
function isHeldForFirstPreference(applicant) {
  const p = placementOn(applicant);
  return p?.status === "Draft" && applicant.preference !== "First" && !applicant.firstPreferenceReleased;
}

function slotChip(applicant) {
  const p = placementOn(applicant);
  const pending = isHeldForFirstPreference(applicant);
  const label = p.status === "Yes" ? "Sent" : p.status === "Submitted" ? "Submitted" : pending ? "Pending" : "Draft";
  const cls = p.status === "Yes" ? "sent" : p.status === "Submitted" ? "submitted" : pending ? "pending" : "draft";
  return `
    <div class="slot-chip">
      <span>${esc(applicant.fullName)}</span>
      <span class="chip-status ${cls}">${label}</span>
      ${p.status !== "Yes" ? `<button type="button" class="chip-x" data-unassign="${esc(applicant.email)}" title="Remove">×</button>` : ""}
    </div>
    ${pending ? `<div class="note" style="margin:-3px 0 6px;">Waiting on ${esc(display(applicant.roleAppliedFor))}'s committee to release them.</div>` : ""}`;
}

/** Panel average, same ranking the Applicants tab already shows — so "best
    candidate for this role" reads the same number in both places. */
function scoreSummary(applicant) {
  const score = rankScore(applicant);
  return score === null
    ? `<span class="score-pill none">Not scored</span>`
    : `<span class="score-pill">${Math.round(score)}/100</span>`;
}

/** Up to two interviewers' notes, trimmed — enough to judge fit without
    leaving the diagram to open the full applicant panel. */
function notesSummary(applicant) {
  const notes = (applicant.scores || [])
    .map((s) => ({ who: s.interviewerName || s.interviewerEmail, text: String(s.notes || "").trim() }))
    .filter((n) => n.text);
  if (!notes.length) return `<div class="note">No interview notes yet.</div>`;
  return notes
    .slice(0, 2)
    .map((n) => `<div class="note"><b>${esc(n.who)}:</b> ${esc(n.text.length > 120 ? n.text.slice(0, 120) + "…" : n.text)}</div>`)
    .join("");
}

/* A candidate shown under the specific role they applied for — the role is
   implicit (the box it's in), so there is no role picker here, only whether
   they join as Head or Member. `headOpen` hides the Head option once the
   role already has one, since only one Head per role is allowed. */
function candidateCard(applicant, headId, headOpen) {
  return `
    <div class="pool-card">
      <div class="nm">${esc(applicant.fullName)} ${scoreSummary(applicant)}</div>
      <div class="meta">${esc(display(applicant.committee || applicant.roleAppliedFor))}${applicant.preference !== "First" ? ` · their ${esc(applicant.preference.toLowerCase())} preference` : ""}</div>
      ${notesSummary(applicant)}
      <div class="row2" style="margin-top:9px;">
        <div><select data-pool-position="${esc(applicant.email)}">
          <option value="Member" selected>Member</option>
          ${headOpen ? `<option value="Head">Head</option>` : ""}
        </select></div>
        <div class="go"><button type="button" class="btn btn-sm btn-gold" data-assign="${esc(applicant.email)}" data-assign-head="${esc(headId)}">Add</button></div>
      </div>
    </div>`;
}

/* Pulls in anyone from the whole unplaced pool, not just people who applied
   for this specific role — the deliberate way to make someone Head (or
   Member) of a role they never applied for, as opposed to candidateCard
   above, which only ever offers people who did apply for it. */
function reallocatePicker(headId, headOpen, candidates) {
  if (!candidates.length) return "";
  const options = candidates
    .map((a) => `<option value="${esc(a.email)}">${esc(a.fullName)} — applied for ${esc(a.headName || display(a.roleAppliedFor))}</option>`)
    .join("");
  return `
    <div class="reallocate">
      <div class="slot-label">Move someone else in</div>
      <div class="row2">
        <div style="flex:2 1 200px;">
          <select data-realloc-email="${esc(headId)}">
            <option value="" selected disabled>Pick an applicant…</option>
            ${options}
          </select>
        </div>
        <div>
          <select data-realloc-position="${esc(headId)}">
            <option value="Member" selected>Member</option>
            ${headOpen ? `<option value="Head">Head</option>` : ""}
          </select>
        </div>
        <div class="go"><button type="button" class="btn btn-sm btn-ghost" data-realloc-add="${esc(headId)}">Add</button></div>
      </div>
    </div>`;
}

function poolCard(applicant, heads) {
  const elsewhere = applicant.acceptedStatus && !placementOn(applicant);
  if (elsewhere) {
    return `
      <div class="pool-card">
        <div class="nm">${esc(applicant.fullName)}</div>
        <div class="meta">${esc(applicant.headName || display(applicant.roleAppliedFor))} · ${esc(display(applicant.committee || applicant.roleAppliedFor))}</div>
        <div class="note" style="margin-top:6px;">Already placed on ${esc(applicant.acceptedCommittee)}'s diagram, as
          ${esc(applicant.acceptedPosition)} of ${esc(applicant.acceptedRole)}.</div>
      </div>`;
  }
  const appliedHeadId = headIdOf(applicant);
  const headOptions = heads
    .map((h) => `<option value="${esc(h.id)}"${h.id === appliedHeadId ? " selected" : ""}>${esc(h.name)}</option>`)
    .join("");
  return `
    <div class="pool-card">
      <div class="nm">${esc(applicant.fullName)}</div>
      <div class="meta">${esc(applicant.headName || display(applicant.roleAppliedFor))} · ${esc(display(applicant.committee || applicant.roleAppliedFor))}</div>
      <div class="row2" style="margin-top:9px;">
        <div><select data-pool-head="${esc(applicant.email)}">${headOptions}</select></div>
        <div><select data-pool-position="${esc(applicant.email)}">
          <option value="Member" selected>Member</option>
          <option value="Head">Head</option>
        </select></div>
        <div class="go"><button type="button" class="btn btn-sm btn-gold" data-assign="${esc(applicant.email)}">Add</button></div>
      </div>
    </div>`;
}

function renderTeam() {
  const el = document.getElementById("view-team");
  if (!state.access) return;

  const guide = getRoleGuideById(myGuideId());
  const heads = guide?.heads ?? [];
  if (!heads.length) {
    el.innerHTML = `<div class="empty">${esc(display(state.access.department))} has no listed roles to build a diagram from.</div>`;
    return;
  }

  const pool = teamPool();
  const here = pool.filter((a) => placementOn(a));
  const unplaced = pool.filter((a) => !a.acceptedStatus);
  const elsewhere = pool.filter((a) => a.acceptedStatus && !placementOn(a));
  const readyCount = here.filter((a) => placementOn(a).status === "Draft" && !isHeldForFirstPreference(a)).length;
  const pendingCount = here.filter(isHeldForFirstPreference).length;
  const submittedCount = here.filter((a) => placementOn(a).status === "Submitted").length;
  const sentCount = here.filter((a) => placementOn(a).status === "Yes").length;

  // Ranked highest score first, same ordering the Applicants tab uses —
  // unscored sinks to the bottom rather than counting as zero.
  const byScore = (a, b) => {
    const sa = rankScore(a), sb = rankScore(b);
    if (sa === null && sb === null) return String(a.fullName).localeCompare(String(b.fullName));
    if (sa === null) return 1;
    if (sb === null) return -1;
    return sb - sa;
  };

  // Grouped by the role each unplaced candidate actually applied for, so a
  // role's box shows exactly who is up for it. Anyone whose applied role
  // is not one of this committee's own heads falls to "Other candidates"
  // below instead.
  const unplacedByHead = new Map();
  const otherUnplaced = [];
  for (const a of unplaced) {
    const hid = headIdOf(a);
    if (hid && heads.some((h) => h.id === hid)) {
      if (!unplacedByHead.has(hid)) unplacedByHead.set(hid, []);
      unplacedByHead.get(hid).push(a);
    } else {
      otherUnplaced.push(a);
    }
  }
  for (const list of unplacedByHead.values()) list.sort(byScore);
  otherUnplaced.sort(byScore);

  const boxes = heads
    .map((h) => {
      const inRole = here.filter((a) => norm(placementOn(a).role) === norm(h.name));
      const headHolders = inRole.filter((a) => placementOn(a).position === "Head");
      const members = inRole.filter((a) => placementOn(a).position === "Member");
      const candidates = unplacedByHead.get(h.id) || [];
      const headOpen = headHolders.length === 0;
      // Everyone else unplaced, for reallocating in someone who applied for
      // a different role entirely.
      const reallocatable = unplaced.filter((a) => headIdOf(a) !== h.id).sort(byScore);
      return `
        <div class="role-box ${headHolders.length ? "" : "missing"}">
          <div class="role-box-title">${esc(h.name)}</div>
          <div class="role-box-body">
            <div class="slot-group">
              <div class="slot-label">Head</div>
              ${headHolders.length ? headHolders.map(slotChip).join("") : `<div class="note">No head assigned yet.</div>`}
            </div>
            <div class="slot-group">
              <div class="slot-label">Members</div>
              ${members.length ? members.map(slotChip).join("") : `<div class="note">None yet.</div>`}
            </div>
            <div class="slot-group">
              <div class="slot-label">Candidates${candidates.length ? ` (${candidates.length})` : ""}</div>
              <div class="candidate-list">
                ${candidates.length
                  ? candidates.map((a) => candidateCard(a, h.id, headOpen)).join("")
                  : `<div class="note">Nobody who applied for this role is still unplaced.</div>`}
              </div>
              ${reallocatePicker(h.id, headOpen, reallocatable)}
            </div>
          </div>
        </div>`;
    })
    .join("");

  const otherCards = [...otherUnplaced, ...elsewhere].map((a) => poolCard(a, heads)).join("");

  el.innerHTML = `
    <div class="team-summary">
      <span class="count"><b>${readyCount}</b> ready to submit</span>
      ${pendingCount ? `<span class="count"><b>${pendingCount}</b> waiting on first preference</span>` : ""}
      <span class="count"><b>${submittedCount}</b> awaiting admin approval</span>
      <span class="count"><b>${sentCount}</b> approved and sent</span>
      <span class="count"><b>${unplaced.length}</b> not yet placed</span>
      <div class="go">
        <button class="btn btn-gold" id="confirm-team"${readyCount ? "" : " disabled"}>Submit for admin approval</button>
      </div>
    </div>
    <div class="note" style="margin:-10px 0 18px;">Submitting does not email anyone — the recruitment admin reviews it
      and sends the acceptance emails from their own portal.</div>
    ${state.teamMsg ? `<div class="msg ${state.teamMsg.type}" style="margin:-8px 0 20px;">${esc(state.teamMsg.text)}</div>` : ""}

    <h2 class="sec2">${esc(display(state.access.department))} — roles</h2>
    <div class="team-roles">${boxes}</div>

    <h2 class="sec2">Other candidates</h2>
    <div class="note" style="margin-bottom:12px;">Applied elsewhere, or already placed on another committee's
      diagram — pick a role for them directly if you still want them here.</div>
    <div class="pool-grid">
      ${otherCards || `<div class="empty">Nobody left outside a role's own list.</div>`}
    </div>`;
}

async function assignToTeam(email, fixedHeadId, fixedPosition) {
  const applicant = teamPool().find((a) => norm(a.email) === norm(email));
  if (!applicant) return;
  // A role-scoped candidate card carries its role (and the reallocate picker
  // carries both role and position) on the button itself — only "Other
  // candidates" still needs its own role picker looked up by email.
  const headId = fixedHeadId || document.querySelector(`[data-pool-head="${CSS.escape(email)}"]`)?.value;
  const position = fixedPosition || document.querySelector(`[data-pool-position="${CSS.escape(email)}"]`)?.value;
  if (!headId || !position) return;

  state.teamMsg = null;
  try {
    await api({
      mode: "heads-assign-applicant",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      headId,
      position
    });
    await load(state.access.email);
  } catch (e) {
    state.teamMsg = { type: "bad", text: e.message };
    renderTeam();
  }
}

async function unassignFromTeam(email) {
  const applicant = teamPool().find((a) => norm(a.email) === norm(email));
  if (!applicant) return;
  if (!(await confirmDialog(`Remove ${applicant.fullName} from the diagram? Nothing has been emailed to them yet.`))) return;

  state.teamMsg = null;
  try {
    await api({
      mode: "heads-unassign-applicant",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor
    });
    await load(state.access.email);
  } catch (e) {
    state.teamMsg = { type: "bad", text: e.message };
    renderTeam();
  }
}

async function confirmTeam() {
  // Only what is actually submittable — a placement still waiting on the
  // applicant's first-preference committee is excluded here the same way the
  // backend excludes it, so the confirm dialog's count matches what really
  // goes to the admin.
  const drafts = teamPool().filter((a) => placementOn(a)?.status === "Draft" && !isHeldForFirstPreference(a));
  if (!drafts.length) return;
  const headCount = drafts.filter((a) => placementOn(a).position === "Head").length;
  const memberCount = drafts.length - headCount;

  if (!(await confirmDialog(
    `Submit ${drafts.length} ${drafts.length === 1 ? "person" : "people"} ` +
    `(${headCount} as Head, ${memberCount} as Member) for admin approval?\n\n` +
    "This does not email anyone yet — the recruitment admin reviews the roster and sends the acceptance emails."
  ))) return;

  const btn = document.getElementById("confirm-team");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
  try {
    const r = await api({ mode: "heads-submit-team", email: state.access.email, committee: state.access.department });
    const heldNote = r.held.length
      ? ` ${r.held.length} still waiting on their first preference: ${r.held.map((h) => `${h.fullName} (${h.firstPreferenceCommittee})`).join(", ")}.`
      : "";
    state.teamMsg = {
      type: "ok",
      text: `Submitted ${r.submitted.length} for admin approval.${r.missingHeadRoles.length ? ` Still no Head for: ${r.missingHeadRoles.join(", ")}.` : ""}${heldNote}`
    };
    await load(state.access.email);
  } catch (e) {
    state.teamMsg = { type: "bad", text: e.message };
    renderTeam();
  }
}

async function toggleRelease(applicantEmail, release) {
  const applicant = currentList().find((a) => norm(a.email) === norm(applicantEmail));
  if (!applicant) return;
  const msg = document.getElementById("release-msg");
  const btn = document.getElementById("toggle-release");

  if (release && !(await confirmDialog(
    `Release ${applicant.fullName} to ${applicant.acceptedCommittee}? They will be free to confirm and email this applicant.`
  ))) return;

  if (btn) btn.disabled = true;
  if (msg) { msg.className = "msg"; msg.textContent = release ? "Releasing…" : "Revoking…"; }
  try {
    await api({
      mode: "heads-release-first-preference",
      email: state.access.email,
      applicantEmail: applicant.email,
      release
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
  } catch (e) {
    if (msg) { msg.className = "msg bad"; msg.textContent = e.message; }
    if (btn) btn.disabled = false;
  }
}

/* ── manage interview slots ────────────────────────────────────────────── */

const SLOT_EXTENSION_START = "2026-08-18";
const SLOT_EXTENSION_END = "2026-08-23";
const SLOT_EXTENSION_MIN_PER_DAY = 4;

// Active slots on whatever date is currently loaded — drives how many more
// the add form actually requires. Refreshed by loadSlotsList().
let slotsForCurrentDate = [];

function slotTimeRowHtml() {
  return `
    <div class="row2" style="margin-bottom:8px;">
      <div><input type="time" class="slot-time-input"></div>
      <div class="go"><button type="button" class="btn btn-sm btn-ghost" data-remove-time>Remove</button></div>
    </div>`;
}

function renderSlotsForm() {
  const el = document.getElementById("view-slots");
  if (!state.access) return;
  slotsForCurrentDate = [];

  el.innerHTML = `
    <h2 class="sec2">Interview slots for ${esc(display(state.access.department))}</h2>
    <div class="note" style="margin-bottom:16px;">
      Pick a date to see what's already scheduled and remove anything still unbooked. Adding more is self-service
      too — between <b>${esc(SLOT_EXTENSION_START)}</b> and <b>${esc(SLOT_EXTENSION_END)}</b>. A day starting from
      nothing needs at least ${SLOT_EXTENSION_MIN_PER_DAY} different times in one go; once a day already has that
      many, add just one more if that's all you need. Every slot runs your committee's own established interview
      length.
    </div>

    <div class="panel" style="max-width:520px;margin-bottom:20px;">
      <label for="slot-date">Date</label>
      <input type="date" id="slot-date">
      <div class="msg" id="slots-list-msg"></div>
      <div id="slots-list" style="margin-top:10px;"></div>
    </div>

    <div class="panel" style="max-width:520px;">
      <h3 class="sec" style="margin-top:0;padding-top:0;border-top:0;">Add more for this day</h3>
      <div class="note" id="add-slots-hint" style="margin-bottom:10px;">Pick a date above first.</div>
      <div id="slot-times">${slotTimeRowHtml()}</div>
      <button type="button" class="btn btn-sm btn-ghost" id="add-time-row">+ Add another time</button>

      <div class="actions">
        <button class="btn btn-gold" id="add-slots">Add these slots</button>
        <span class="msg" id="slots-msg"></span>
      </div>
    </div>`;
}

function addTimeRow() {
  document.getElementById("slot-times").insertAdjacentHTML("beforeend", slotTimeRowHtml());
}

/** How many more active slots this date still needs to hit the daily minimum. */
function slotsStillNeeded() {
  const active = slotsForCurrentDate.filter((s) => s.active).length;
  return Math.max(0, SLOT_EXTENSION_MIN_PER_DAY - active);
}

function updateAddSlotsHint() {
  const hint = document.getElementById("add-slots-hint");
  if (!hint) return;
  const needed = slotsStillNeeded();
  hint.textContent = needed > 0
    ? `This day needs ${needed} more to reach ${SLOT_EXTENSION_MIN_PER_DAY} — add at least that many below.`
    : "This day already has its minimum — add as many or as few more as you like.";
}

/** Resets the time-input rows to match what this day still needs — one blank row once the minimum is met. */
function resetSlotTimeRows() {
  const count = Math.max(1, slotsStillNeeded());
  document.getElementById("slot-times").innerHTML = Array.from({ length: count }, slotTimeRowHtml).join("");
}

async function loadSlotsList() {
  const date = document.getElementById("slot-date")?.value;
  const listEl = document.getElementById("slots-list");
  const msg = document.getElementById("slots-list-msg");
  if (!date) { listEl.innerHTML = ""; slotsForCurrentDate = []; updateAddSlotsHint(); return; }

  msg.className = "msg"; msg.textContent = "Loading…";
  try {
    const r = await api({ mode: "heads-list-slots", email: state.access.email, date });
    msg.textContent = "";
    slotsForCurrentDate = r.slots;
    listEl.innerHTML = r.slots.length
      ? r.slots.map((s) => `
        <div class="slot-chip">
          <span>${esc(s.startTime)}–${esc(s.endTime)}</span>
          <span class="chip-status ${!s.active ? "pending" : s.booked ? "sent" : "draft"}">${
            !s.active ? "Removed" : s.booked ? "Booked" : "Open"
          }</span>
          ${s.active && !s.booked ? `<button type="button" class="chip-x" data-remove-slot="${esc(s.id)}" title="Remove">×</button>` : ""}
        </div>`).join("")
      : `<div class="note">No slots yet on this date.</div>`;
    updateAddSlotsHint();
    resetSlotTimeRows();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  }
}

async function removeSlot(slotId) {
  if (!(await confirmDialog("Remove this slot? It has to already be unbooked, and this can't be undone."))) return;
  try {
    await api({ mode: "heads-remove-slot", email: state.access.email, slotId });
    await loadSlotsList();
  } catch (e) {
    const msg = document.getElementById("slots-list-msg");
    msg.className = "msg bad"; msg.textContent = e.message;
  }
}

async function addSlots() {
  const dateInput = document.getElementById("slot-date");
  const msg = document.getElementById("slots-msg");
  const btn = document.getElementById("add-slots");
  const date = dateInput?.value;
  const times = [...document.querySelectorAll(".slot-time-input")]
    .map((input) => input.value.trim())
    .filter(Boolean);

  if (!date) { msg.className = "msg bad"; msg.textContent = "Pick a date first."; return; }
  if (!times.length) { msg.className = "msg bad"; msg.textContent = "Add at least one time."; return; }
  const needed = slotsStillNeeded();
  if (times.length < needed) {
    msg.className = "msg bad";
    msg.textContent = `This day still needs ${needed} to reach ${SLOT_EXTENSION_MIN_PER_DAY} — add ${needed - times.length} more.`;
    return;
  }

  if (!(await confirmDialog(`Add ${times.length} interview slots on ${date} for ${display(state.access.department)}?`))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Adding…";
  try {
    const r = await api({ mode: "heads-add-slots", email: state.access.email, date, times });
    msg.className = "msg ok";
    msg.textContent = `Added ${r.added.length}.${r.alreadyExisted.length ? ` ${r.alreadyExisted.length} already existed.` : ""}`;
    await loadSlotsList();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("view-slots").addEventListener("click", (e) => {
  if (e.target.id === "add-time-row") { addTimeRow(); return; }
  if (e.target.closest("[data-remove-time]")) { e.target.closest(".row2").remove(); return; }
  if (e.target.id === "add-slots") { addSlots(); return; }
  const removeBtn = e.target.closest("[data-remove-slot]");
  if (removeBtn) removeSlot(removeBtn.dataset.removeSlot);
});
document.getElementById("view-slots").addEventListener("change", (e) => {
  if (e.target.id === "slot-date") loadSlotsList();
});

function readScores() {
  const scores = {};
  for (const input of document.querySelectorAll("[data-criterion]")) {
    const raw = input.value.trim();
    if (raw !== "") scores[input.dataset.criterion] = Number(raw);
  }
  return scores;
}

function updateRunningTotal() {
  const el = document.getElementById("running");
  if (!el) return;
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  const rubric = applicant && rubricFor(applicant);
  if (!rubric) { el.textContent = ""; return; }
  const total = totalScore(rubric, readScores());
  el.textContent = total === null ? "Incomplete" : `${total} / 100`;
}

/* ── actions ────────────────────────────────────────────────────────────── */

async function load(email) {
  const data = await api({ mode: "heads-committee-load", email });
  state.access = data.access;
  state.data = data;
  sessionStorage.setItem("committeeEmail", data.access.email);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("portal").classList.remove("hidden");
  document.getElementById("bar-title").textContent = display(data.access.department);
  document.getElementById("bar-sub").textContent = `${data.access.name} · ${data.access.positionType}`;
  renderTabs(); renderList(); renderPanel(); renderTeam();
}

async function save() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant || state.busy) return;
  const rubric = rubricFor(applicant);
  const scores = readScores();
  const btn = document.getElementById("save");

  state.busy = true; btn.disabled = true; btn.textContent = "Saving…";
  try {
    await api({
      mode: "heads-save-score",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      headRole: applicant.headName || "",
      preference: applicant.preference || "",
      scores,
      total: rubric ? totalScore(rubric, scores) : null,
      notes: document.getElementById("notes").value,
      taskLink: document.getElementById("task-link").value.trim()
    });
    await load(state.access.email);
    document.getElementById("saved").textContent = "Saved";
  } catch (e) {
    document.getElementById("saved").textContent = e.message;
  } finally {
    state.busy = false;
    const b = document.getElementById("save");
    if (b) { b.disabled = false; b.textContent = "Save"; }
  }
}

/* ── wiring ─────────────────────────────────────────────────────────────── */

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.classList.add("hidden");
  if (!email) { err.textContent = "Enter your AUC email."; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try { await load(email); }
  catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  finally { btn.disabled = false; btn.textContent = "Enter portal"; }
});

document.getElementById("email").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  state.tab = tab.dataset.tab; state.selected = null;
  renderTabs(); renderList(); renderPanel();
});

document.getElementById("views").addEventListener("click", (e) => {
  const view = e.target.closest("[data-view]");
  if (!view) return;
  state.view = view.dataset.view; state.teamMsg = null;
  document.getElementById("view-applicants").classList.toggle("hidden", state.view !== "applicants");
  document.getElementById("view-team").classList.toggle("hidden", state.view !== "team");
  document.getElementById("view-slots").classList.toggle("hidden", state.view !== "slots");
  for (const btn of document.querySelectorAll("#views [data-view]")) {
    btn.setAttribute("aria-selected", btn.dataset.view === state.view);
  }
  if (state.view === "team") renderTeam();
  if (state.view === "slots") renderSlotsForm();
});

document.getElementById("view-team").addEventListener("click", (e) => {
  const assignBtn = e.target.closest("[data-assign]");
  if (assignBtn) { assignToTeam(assignBtn.dataset.assign, assignBtn.dataset.assignHead || null); return; }
  const reallocBtn = e.target.closest("[data-realloc-add]");
  if (reallocBtn) {
    const headId = reallocBtn.dataset.reallocAdd;
    const email = document.querySelector(`[data-realloc-email="${CSS.escape(headId)}"]`)?.value;
    const position = document.querySelector(`[data-realloc-position="${CSS.escape(headId)}"]`)?.value;
    if (email) assignToTeam(email, headId, position);
    return;
  }
  const unassignBtn = e.target.closest("[data-unassign]");
  if (unassignBtn) { unassignFromTeam(unassignBtn.dataset.unassign); return; }
  if (e.target.id === "confirm-team") confirmTeam();
});

document.getElementById("list").addEventListener("click", (e) => {
  const card = e.target.closest("[data-email]");
  if (!card) return;
  state.selected = card.dataset.email;
  renderList(); renderPanel();
});

document.getElementById("panel").addEventListener("input", (e) => {
  if (e.target.dataset.criterion) updateRunningTotal();
});
document.getElementById("panel").addEventListener("click", (e) => {
  if (e.target.id === "save") save();
  if (e.target.id === "set-state") setState();
  if (e.target.id === "reschedule") reschedule();
  if (e.target.id === "cancel-interview") cancelInterview();
  if (e.target.id === "avail-yes") setSecondPreferenceAvailability(true);
  if (e.target.id === "avail-no") setSecondPreferenceAvailability(false);
  if (e.target.id === "toggle-release") toggleRelease(state.selected, e.target.dataset.release === "true");
});

async function setSecondPreferenceAvailability(available) {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!available && !(await confirmDialog(
    `Tell HR your committee can't cover ${applicant.fullName}'s interview on ${applicant.interviewSlot}? ` +
    "They will need to find a third interviewer."
  ))) return;

  const yesBtn = document.getElementById("avail-yes");
  const noBtn = document.getElementById("avail-no");
  if (yesBtn) yesBtn.disabled = true;
  if (noBtn) noBtn.disabled = true;
  try {
    await api({
      mode: "heads-confirm-second-availability",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      available
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
  } catch (e) {
    alert(e.message);
    if (yesBtn) yesBtn.disabled = false;
    if (noBtn) noBtn.disabled = false;
  }
}

async function cancelInterview() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("cancel-interview");
  if (!(await confirmDialog(`Withdraw ${applicant.fullName}'s application?\n\n` +
    `Their interview on ${applicant.interviewSlot} is cancelled, the slot goes back on the board, ` +
    "and they are emailed to say the application is withdrawn. Use Reschedule instead if they only want another time."))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Cancelling…";
  try {
    const r = await api({
      mode: "heads-cancel-interview",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
    const m = document.getElementById("int-msg");
    if (m) { m.className = "msg ok"; m.textContent = `Cancelled.${r.emailSent ? " Applicant emailed." : " Email not sent."}`; }
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

async function setState() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("set-state");
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  try {
    await api({
      mode: "heads-set-interview-status",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      interviewStatus: document.getElementById("state").value
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

async function reschedule() {
  const applicant = currentList().find((a) => norm(a.email) === norm(state.selected));
  if (!applicant) return;
  if (!runsThisInterview(applicant)) return;   // guests never control the booking
  const msg = document.getElementById("int-msg");
  const btn = document.getElementById("reschedule");
  const date = document.getElementById("re-date").value;
  const startTime = document.getElementById("re-time").value;
  if (!date || !startTime) { msg.className = "msg bad"; msg.textContent = "Pick a date and time."; return; }
  if (!(await confirmDialog(`Move ${applicant.fullName}'s interview to ${date} at ${startTime}? This emails them.`))) return;

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Rescheduling…";
  try {
    const r = await api({
      mode: "heads-committee-reschedule",
      email: state.access.email,
      applicantEmail: applicant.email,
      committee: applicant.committee || applicant.roleAppliedFor,
      date, startTime
    });
    await load(state.access.email);
    state.selected = applicant.email;
    renderList(); renderPanel();
    const m = document.getElementById("int-msg");
    if (m) { m.className = "msg ok"; m.textContent = `Moved.${r.emailSent ? " Applicant emailed." : " Email not sent."}`; }
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

document.getElementById("refresh").addEventListener("click", () => load(state.access.email));
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("committeeEmail");
  location.reload();
});

const saved = sessionStorage.getItem("committeeEmail");
if (saved) load(saved).catch(() => sessionStorage.removeItem("committeeEmail"));
</script>
</body>
</html>
