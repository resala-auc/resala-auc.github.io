<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Recruitment — Resala AUC</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0c2c80; --sky: #a7d4f2; --gold: #eac262;
    --ivory: #fdf9f3; --ink: #1b1f23;
    --line: #e4dccd; --muted: #6b7280; --soft: #f7f4ee;
    --good: #1a7f4b; --warn: #9a6b00; --bad: #a3231b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink);
         font: 15px/1.6 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  a { color: var(--blue); }

  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line);
                border-radius: 18px; padding: 34px 30px; text-align: center; }
  .login-card img { width: 68px; height: 68px; margin: 0 auto 16px; display: block; }
  .login-card h1 { margin: 0 0 6px; font-size: 21px; color: var(--blue); }
  .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase;
          letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
  input[type=email], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--soft); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--sky); outline-offset: 1px; background: #fff; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 11px 17px; font-weight: 700; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-ghost { background: #fff; color: var(--blue); border: 1px solid var(--line); font-weight: 600; }
  .btn-block { width: 100%; margin-top: 18px; }
  .error { margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: #fdecec; color: #8c1c1c;
           font-size: 13px; text-align: left; }

  header.bar { background: var(--blue); color: #fff; padding: 14px 20px; display: flex;
               align-items: center; gap: 14px; flex-wrap: wrap; }
  header.bar img { width: 38px; height: 38px; }
  .bar-title { font-weight: 700; font-size: 17px; }
  .bar-sub { color: var(--sky); font-size: 12.5px; }
  .bar-spacer { flex: 1; }
  header.bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
                      border-radius: 8px; padding: 7px 13px; font-size: 13px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 70px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 18px; min-width: 130px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; }
  .filters > div { min-width: 180px; }

  .views { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; background: #fff;
          border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { background: var(--soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fcfaf6; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
  .pill.done { background: #e8f6ee; color: var(--good); }
  .pill.open { background: var(--soft); color: var(--muted); }
  .pill.part { background: #fdf4e0; color: var(--warn); }
  .pill.bad { background: #fdecec; color: var(--bad); }
  .wrap-x { overflow-x: auto; }

  dialog { border: 0; border-radius: 16px; padding: 0; max-width: 760px; width: calc(100% - 32px);
           box-shadow: 0 24px 60px rgba(0,0,0,.24); }
  dialog::backdrop { background: rgba(12,26,50,.5); }
  .dlg { padding: 24px 26px 26px; }
  .dlg h2 { margin: 0 0 2px; font-size: 21px; color: var(--blue); }
  .dlg .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; margin-bottom: 16px; }
  .facts b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
             color: var(--muted); font-weight: 700; }
  h3.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
           margin: 20px 0 9px; padding-top: 14px; border-top: 1px solid var(--line); }
  .qa .q { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .qa .a { white-space: pre-wrap; color: #3f4650; margin-bottom: 13px; font-size: 14px; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row2 > div { flex: 1 1 150px; }
  .note { font-size: 13px; color: var(--muted); }
  .msg { margin-top: 12px; font-size: 13.5px; }
  .msg.ok { color: var(--good); }
  .msg.bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 30px 4px; }
  .close { float: right; background: transparent; border: 0; font-size: 22px; color: var(--muted); line-height: 1; }
  .banner { background: #fdf4e0; border: 1px solid #e3b96a; border-radius: 12px; padding: 12px 16px;
            font-size: 13.5px; color: #6b4c00; margin-bottom: 18px; }
  .committee-group { margin-bottom: 26px; }
  .committee-group > h2 { font-size: 15px; color: var(--blue); margin: 0 0 10px;
                    display: flex; align-items: baseline; gap: 9px; }
  .committee-group > h2 .c { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .ccard { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
           text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
  .ccard:hover { border-color: var(--blue); transform: translateY(-1px); }
  .ccard .n { font-size: 16px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
  .ccard .m { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .ccard .m b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .btn-back { margin-bottom: 14px; }
  #committee-heading { font-size: 19px; color: var(--blue); margin: 0 0 16px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .danger { background: #fdecec; color: var(--bad); border: 1px solid #f0c7c4; }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://resala-auc.github.io/join/resala-logo.png" alt="Resala AUC">
    <h1>Member Recruitment</h1>
    <p>Members cycle. Restricted to the people running this recruitment.</p>
    <label for="email">AUC email</label>
    <input type="email" id="email" placeholder="you@aucegypt.edu" autocomplete="email">
    <button class="btn btn-block" id="login-btn">Enter</button>
    <div class="error hidden" id="login-error"></div>
  </div>
</div>

<div class="hidden" id="app">
  <header class="bar">
    <img src="https://resala-auc.github.io/join/resala-logo.png" alt="">
    <div>
      <div class="bar-title">Member Recruitment</div>
      <div class="bar-sub" id="bar-sub">—</div>
    </div>
    <div class="bar-spacer"></div>
    <button id="check-meet">Check Meet access</button>
    <button id="send-reminders">Send due reminders</button>
    <button id="check-times">Check interview times</button>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="views" role="tablist" id="views">
      <button class="tab" data-view="applicants" aria-selected="true">Applicants</button>
      <button class="tab" data-view="approvals">Approvals</button>
      <button class="tab" data-view="slots">Slots</button>
    </div>

    <div id="view-applicants">
      <div id="committee-grid"></div>

      <div id="committee-detail" class="hidden">
        <button class="btn btn-ghost btn-back" id="back-to-committees">← All committees</button>
        <h2 id="committee-heading"></h2>
      <div class="filters">
        <div>
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Any</option>
            <option value="New">New</option>
            <option value="Interviewed">Interviewed</option>
            <option value="Accepted">Accepted</option>
            <option value="Declined">Declined</option>
          </select>
        </div>
        <div>
          <label for="f-scheduling">Interview</label>
          <select id="f-scheduling">
            <option value="">Any</option>
            <option value="booked">Booked, invite sent</option>
            <option value="unscheduled">Needs scheduling</option>
          </select>
        </div>
      </div>
      <div id="applicant-groups"></div>
      </div>
      <div class="empty hidden" id="applicants-empty">No applications yet.</div>
    </div>

    <div id="view-approvals" class="hidden"></div>
    <div id="view-slots" class="hidden"></div>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<dialog id="confirm-dialog" style="max-width:420px;">
  <div class="dlg" style="padding:22px 24px;">
    <p id="confirm-message" style="margin:0 0 20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-gold" id="confirm-ok">Confirm</button>
    </div>
  </div>
</dialog>

<dialog id="report-dialog" style="max-width:560px;">
  <div class="dlg" style="padding:22px 24px;">
    <p id="report-message" style="margin:0 0 20px;font-size:14px;line-height:1.6;white-space:pre-wrap;"></p>
    <div style="display:flex;justify-content:flex-end;">
      <button type="button" class="btn btn-gold" id="report-close">Close</button>
    </div>
  </div>
</dialog>

<script type="module">
const ENDPOINT = "https://upnmxdgqdkvgzfwqaicb.supabase.co/functions/v1/submit";
const GENERAL_VOLUNTEER = "General Volunteer";

/* The sheet stores three answers per applicant but not the questions they
   answered — those live in experience/src/data/members.ts. Mirrored here so a
   reviewer reads a question and its answer together instead of three
   unlabelled paragraphs. Same three per committee, in the same order. */
const COMMITTEE_QUESTIONS = {
  "tech": [
    "What interests you about joining the Tech Team?",
    "Have you used or are you interested in learning any technical skills? (For example: coding, website building, spreadsheets, automation, design systems, etc.)",
    "What is one thing you would like to help improve or build in Resala?"
  ],
  "operations": [
    "Why do you want to join the Operations Team?",
    "Do you enjoy planning, organizing, or solving problems? Tell us a little about why.",
    "What do you think is most important when organizing an event or activity?"
  ],
  "branding-media": [
    "What interests you about joining Branding/Media?",
    "Which area interests you the most? (Design, photography, videography, editing, content creation, writing, or social media)",
    "If you could help people see one side of Resala better, what would it be?"
  ],
  "hr": [
    "Why do you want to join HR?",
    "What do you think makes a community feel welcoming and connected?",
    "How would you like to help make the Resala experience better for its members?"
  ],
  "pr-fundraising": [
    "What interests you about PR/Fundraising?",
    "Which part interests you the most? (Partnerships, sponsorships, outreach, fundraising, communication, or something else.)",
    "What do you think makes someone good at representing Resala to other people or organizations?"
  ],
  "visits": [
    "Why do you want to join the Visits Committee?",
    "What type of visits or activities would you be interested in helping organize?",
    "What do you think is important when interacting with the people and communities we visit?"
  ],
  "childrens-day": [
    "Why do you want to join Children's Day?",
    "Have you worked with or spent time with children before? (Tell us about any experience you have.)",
    "What do you think makes a child enjoy and benefit from an activity?"
  ],
  "initiatives": [
    "Why do you want to join Initiatives?",
    "If you noticed a problem around you, what is one thing you would want to help change?",
    "Do you prefer coming up with ideas, planning them, organizing them, or working during execution? Why?"
  ]
};
/* No waitlist: accepted, general volunteer, or turned down. Waitlisted is kept
   out of the list but still shown on anyone who already carries it, so nobody
   is silently retitled by a dropdown that no longer offers what they are. */
const STATUSES = ["New", "Interviewed", "Accepted", GENERAL_VOLUNTEER, "Declined", "No Show"];
const statusesFor = (current) =>
  current && !STATUSES.includes(current) ? [...STATUSES, current] : STATUSES;

const norm = (v) => String(v ?? "").trim().toLowerCase();
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function noticeDialog(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById("report-dialog");
    document.getElementById("report-message").textContent = message;
    const closeBtn = document.getElementById("report-close");
    const finish = () => {
      dlg.close();
      closeBtn.removeEventListener("click", finish);
      dlg.removeEventListener("cancel", finish);
      resolve();
    };
    closeBtn.addEventListener("click", finish);
    dlg.addEventListener("cancel", finish);
    if (!dlg.open) dlg.showModal();
  });
}

function confirmDialog(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById("confirm-dialog");
    document.getElementById("confirm-message").textContent = message;
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    const finish = (result) => {
      dlg.close();
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      dlg.removeEventListener("cancel", onCancel);
      resolve(result);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    dlg.addEventListener("cancel", onCancel);
    dlg.showModal();
  });
}

let state = { admin: null, data: null, msg: null, view: "applicants", committee: null };

/* Two ways an applicant ends up without a usable interview: they applied
   before booking existed (no slot at all), or they booked while Google was
   refusing to make the invite (slot, no Meet link). Both need a person, so
   both are counted and filtered together. */
const hasSlot = (a) => Boolean(String(a.interviewSlot ?? "").trim());
const needsInvite = (a) => hasSlot(a) && !String(a.meetLink ?? "").trim();
const needsScheduling = (a) => !hasSlot(a) || needsInvite(a);

async function api(payload) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  let body;
  try {
    body = await res.json();
  } catch {
    // A runtime failure (a timeout, a crashed worker) answers with something
    // that is not our JSON at all; saying so beats "Something went wrong."
    throw new Error(`The server answered ${res.status} with no detail. Try again, and tell whoever maintains this.`);
  }
  if (!res.ok || body.ok === false) {
    throw new Error(body.error || `The server answered ${res.status} with no detail.`);
  }
  return body;
}

async function load(email) {
  const body = await api({ mode: "member-admin-load", email });
  state.admin = body.admin;
  state.data = { applicants: body.applicants ?? [], reservations: body.reservations ?? [] };
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("bar-sub").textContent = state.admin?.email ?? "";
  sessionStorage.setItem("member-recruitment-admin-email", email);
  renderAll();
}

function renderStats() {
  const applicants = state.data.applicants;
  const byStatus = {};
  for (const a of applicants) byStatus[a.status || "New"] = (byStatus[a.status || "New"] ?? 0) + 1;
  const unscheduled = applicants.filter(needsScheduling).length;
  const el = document.getElementById("stats");
  el.innerHTML = [
    `<div class="stat"><div class="v">${applicants.length}</div><div class="k">Total</div></div>`,
    `<div class="stat"><div class="v">${unscheduled}</div><div class="k">Needs scheduling</div></div>`,
    ...STATUSES.map((s) => `<div class="stat"><div class="v">${byStatus[s] ?? 0}</div><div class="k">${esc(s)}</div></div>`)
  ].join("");
}

function committeeOptions() {
  return [...new Set(state.data.applicants.map((a) => a.committee).filter(Boolean))].sort();
}

/* The page opens on the committees, not on 400 rows: a committee is the unit
   people actually work in, and its own list is one click away. */
function renderCommitteeGrid() {
  const grid = document.getElementById("committee-grid");
  const detail = document.getElementById("committee-detail");
  grid.classList.toggle("hidden", Boolean(state.committee));
  detail.classList.toggle("hidden", !state.committee);

  if (state.committee) {
    const people = state.data.applicants.filter((a) => a.committee === state.committee);
    document.getElementById("committee-heading").textContent = `${state.committee} · ${people.length} applicant${people.length === 1 ? "" : "s"}`;
    return;
  }

  const committees = committeeOptions();
  if (!committees.length) { grid.innerHTML = ""; return; }

  grid.innerHTML = `<div class="cgrid">${committees.map((c) => {
    const people = state.data.applicants.filter((a) => a.committee === c);
    const booked = people.filter((a) => hasSlot(a) && !needsInvite(a)).length;
    const waiting = people.filter(needsScheduling).length;
    return `
      <button type="button" class="ccard" data-committee="${esc(c)}">
        <div class="n">${esc(c)}</div>
        <div class="m">
          <span><b>${people.length}</b> applicants</span>
          <span><b>${booked}</b> booked</span>
          ${waiting ? `<span><b>${waiting}</b> need scheduling</span>` : ""}
        </div>
      </button>`;
  }).join("")}</div>`;
}

function renderApplicants() {
  if (!state.committee) { document.getElementById("applicant-groups").innerHTML = ""; return; }
  const committeeFilter = state.committee;
  const statusFilter = document.getElementById("f-status").value;
  const schedulingFilter = document.getElementById("f-scheduling").value;
  const rows = state.data.applicants.filter((a) => {
    const settled = hasSlot(a) && !needsInvite(a);
    return (
      (!committeeFilter || a.committee === committeeFilter) &&
      (!statusFilter || (a.status || "New") === statusFilter) &&
      (!schedulingFilter || (schedulingFilter === "booked" ? settled : needsScheduling(a)))
    );
  });

  document.getElementById("applicants-empty").classList.toggle("hidden", state.data.applicants.length > 0);
  const groupsEl = document.getElementById("applicant-groups");

  if (!rows.length) {
    groupsEl.innerHTML = state.data.applicants.length
      ? `<div class="empty">No applicants match these filters.</div>`
      : "";
    return;
  }

  const byCommittee = new Map();
  for (const a of rows) {
    const key = a.committee || "—";
    if (!byCommittee.has(key)) byCommittee.set(key, []);
    byCommittee.get(key).push(a);
  }

  groupsEl.innerHTML = [...byCommittee.entries()].sort(([x], [y]) => x.localeCompare(y)).map(([, people]) => `
    <div class="committee-group">
      <div class="wrap-x"><table>
        <thead><tr><th>Applicant</th><th>Sub-committee</th><th>Standing / Major</th><th>Interview</th><th>Status</th></tr></thead>
        <tbody>
          ${people.map((a) => `
            <tr data-open="${esc(a.rowIndex)}">
              <td><b>${esc(a.fullName)}</b><div class="note">${esc(a.aucEmail)}</div></td>
              <td>${esc(a.subCommittee) || `<span class="note">—</span>`}</td>
              <td>${esc(a.yearLevel)}<div class="note">${esc(a.major)}</div></td>
              <td>${
                !hasSlot(a)
                  ? `<span class="pill part">Needs scheduling</span>`
                  : needsInvite(a)
                    ? `${esc(a.interviewSlot)}<div class="note"><span class="pill bad">Invite not sent</span></div>`
                    : `${esc(a.interviewSlot)}<div class="note"><a href="${esc(a.meetLink)}" target="_blank" rel="noopener">Meet link</a></div>`
              }</td>
              <td><span class="pill ${a.status === "Accepted" ? "done" : a.status === "Declined" ? "bad" : a.status === "Interviewed" ? "part" : "open"}">${esc(a.status || "New")}</span></td>
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>`).join("");
}

function renderDialog(a) {
  const dlgBody = document.getElementById("dlg-body");
  dlgBody.innerHTML = `
    <button class="close" data-close>&times;</button>
    <h2>${esc(a.fullName)}</h2>
    <div class="sub">${esc(a.aucEmail)} · ${esc(a.studentId)}</div>
    <div class="facts">
      <div><b>Committee</b>${esc(a.committee)}</div>
      <div><b>Sub-committee</b>${esc(a.subCommittee) || esc(a.secondPreference) || "—"}</div>
      <div><b>Major</b>${esc(a.major)}</div>
      <div><b>Standing</b>${esc(a.yearLevel)}</div>
      <div><b>Phone</b>${esc(a.phone)}</div>
      <div><b>WhatsApp consent</b>${esc(a.whatsappConsent)}</div>
      <div><b>Interview</b>${esc(a.interviewSlot) || "Needs scheduling"}</div>
      <div><b>Confirmation email</b>${
        a.confirmationThreadId
          ? `Sent${a.reminderSentAt ? " · reminder sent" : ""}`
          : `<span style="color:var(--bad);font-weight:700;">Never sent</span>`
      }</div>
      ${
        a.meetLink
          ? `<div><b>Meet link</b><a href="${esc(a.meetLink)}" target="_blank" rel="noopener">Join</a></div>`
          : hasSlot(a)
            ? `<div><b>Meet link</b>Never created</div>`
            : ""
      }
    </div>
    ${
      needsInvite(a)
        ? `<div class="row2" style="margin-top:14px;align-items:center;">
             <div style="flex:1 1 auto;">
               <div class="note">Their time is held, but the invite and the confirmation never went out —

           </div>`
        : ""
    }
    <h3 class="sec">Application</h3>
    <div class="qa">
      ${[a.answer1, a.answer2, a.answer3]
        .map((ans, i) => ({ ans, q: (COMMITTEE_QUESTIONS[a.committeeId] ?? [])[i] }))
        .filter((pair) => pair.ans)
        .map((pair) => `${pair.q ? `<div class="q">${esc(pair.q)}</div>` : ""}<div class="a">${esc(pair.ans)}</div>`)
        .join("")}
    </div>
    <h3 class="sec">Interview</h3>
    <div class="row2">
      <div>
        <label for="dlg-slot">Move to</label>
        <select id="dlg-slot"><option value="">Loading times…</option></select>
      </div>
      <div style="flex:0 0 auto;">
        <button class="btn" id="dlg-reschedule" data-row="${esc(a.rowIndex)}" disabled>Reschedule</button>
      </div>
      ${hasSlot(a) ? `<div style="flex:0 0 auto;">
        <button class="btn btn-ghost" id="dlg-cancel-interview" data-row="${esc(a.rowIndex)}">Cancel interview</button>
      </div>` : ""}
    </div>

    <h3 class="sec">Decision</h3>
    <div class="actions">
      <button class="btn danger" id="dlg-general-volunteer" data-row="${esc(a.rowIndex)}"${
        (a.status || "") === GENERAL_VOLUNTEER ? " disabled" : ""
      }>${(a.status || "") === GENERAL_VOLUNTEER ? "Already a general volunteer" : "Accept as general volunteer"}</button>
    </div>
    <div class="note" style="margin-top:6px;">Emails them straight away that they are in as a general volunteer, and frees their interview slot.</div>

    <h3 class="sec">Status</h3>
    <div class="row2">
      <div>
        <select id="dlg-status">
          ${statusesFor(a.status).map((s) => `<option value="${esc(s)}"${(a.status || "New") === s ? " selected" : ""}>${esc(s)}</option>`).join("")}
        </select>
      </div>
      <div style="flex:0 0 auto;">
        <button class="btn btn-gold" id="dlg-save-status" data-row="${esc(a.rowIndex)}">Save status</button>
      </div>
    </div>
    <div class="msg ${state.msg?.type ?? ""}">${state.msg ? esc(state.msg.text) : ""}</div>
  `;
  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();
  loadSlotChoices(a);
}

/*
 * The times this applicant can actually be moved to, answered by the server
 * rather than worked out here.
 *
 * It used to read the applicant-facing endpoint, which applies the five-day
 * booking window — so an admin could only ever see the next five days of a
 * three-week board, and a slot beyond that looked as though it did not exist.
 * It then greyed out taken slots from a separately-loaded reservation list,
 * which is a second opinion about availability and therefore a second thing to
 * be wrong. Both portals now ask the same question of the same function.
 */
async function loadSlotChoices(a) {
  const sel = document.getElementById("dlg-slot");
  const btn = document.getElementById("dlg-reschedule");
  if (!sel) return;
  try {
    const body = await api({
      mode: "member-admin-slots",
      email: state.admin.email,
      committeeId: a.committeeId,
      currentSlotId: a.interviewSlotId
    });
    const slots = Array.isArray(body?.slots) ? body.slots : [];
    sel.innerHTML = slots.length
      ? `<option value="">Choose a time…</option>` + slots
          .map((slot) => `<option value="${esc(slot.id)}"${slot.current ? " disabled" : ""}>${esc(slot.label)}${slot.current ? " — where they are now" : ""}</option>`)
          .join("")
      : `<option value="">No open times left on this board</option>`;
    if (btn) btn.disabled = !slots.length;
  } catch (err) {
    sel.innerHTML = `<option value="">${esc(err.message)}</option>`;
  }
}

function renderSlots() {
  const el = document.getElementById("view-slots");
  const reservations = state.data.reservations;
  if (!reservations.length) {
    el.innerHTML = `
      <div class="banner">Late policy: interviewers give a member 5 minutes after the scheduled time before treating them as a no-show — a no-show becomes a general member, not a re-booked interview. No self-service rescheduling; if a head cannot attend, the committee director conducts it instead.</div>
      <div class="empty">No interviews booked yet.</div>`;
    return;
  }

  const byCommittee = new Map();
  for (const r of reservations) {
    const key = r.committeeId || "—";
    if (!byCommittee.has(key)) byCommittee.set(key, []);
    byCommittee.get(key).push(r);
  }

  el.innerHTML = `
    <div class="banner">Late policy: interviewers give a member 5 minutes after the scheduled time before treating them as a no-show — a no-show becomes a general member, not a re-booked interview. No self-service rescheduling; if a head cannot attend, the committee director conducts it instead.</div>
    ${[...byCommittee.entries()].sort(([x], [y]) => x.localeCompare(y)).map(([committee, rows]) => `
      <div class="committee-group">
        <h2>${esc(committee)} <span class="c">${rows.length} booked</span></h2>
        <div class="wrap-x"><table>
          <thead><tr><th>When</th><th>Applicant</th></tr></thead>
          <tbody>
            ${rows.sort((a, b) => a.slotLabel.localeCompare(b.slotLabel)).map((r) => `
              <tr><td>${esc(r.slotLabel)}</td><td>${esc(r.fullName)} · ${esc(r.aucEmail)}</td></tr>`).join("")}
          </tbody>
        </table></div>
      </div>`).join("")}
  `;
}

/*
 * The lists committees have sent up, grouped the way they were decided —
 * committee, then sub-committee. Approving is what sends the acceptance
 * emails, and it is the only place in the members cycle that does, so it
 * confirms with a count and names the people first.
 */
function renderApprovals() {
  const el = document.getElementById("view-approvals");
  const rows = (state.data?.applicants ?? []).filter((a) => a.submittedAt);
  if (!rows.length) {
    el.innerHTML = `<div class="committee-group"><div class="empty">No committee has sent a list up yet.</div></div>`;
    return;
  }

  const groups = new Map();
  for (const a of rows) {
    const key = `${a.committee || "—"}\u0000${a.subCommittee || "Not given"}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }

  el.innerHTML = [...groups.entries()].sort(([x], [y]) => x.localeCompare(y)).map(([key, people]) => {
    const [committee, sub] = key.split("\u0000");
    const pending = people.filter((a) => !a.approvedAt);
    const unsent = people.filter((a) => a.approvedAt && !a.acceptanceSentAt);
    const emailed = people.filter((a) => a.acceptanceSentAt).length;
    return `
    <div class="committee-group">
      <div class="wrap-x"><table>
        <thead><tr>
          <th colspan="4">${esc(committee)} · ${esc(sub)} — ${people.length} submitted${
            emailed ? `, ${emailed} emailed` : ""
          }</th>
        </tr></thead>
        <tbody>
          ${people.map((a) => `
            <tr>
              <td><b>${esc(a.fullName)}</b><div class="note">${esc(a.aucEmail)}</div></td>
              <td>${esc(a.status)}</td>
              <td>${
                a.acceptanceSentAt
                  ? `<span class="pill done">Accepted &amp; emailed</span>`
                  : a.approvedAt
                    ? `<span class="pill part">Approved, not emailed</span>`
                    : `<span class="pill open">Waiting on you</span>`
              }<div class="note">sent up by ${esc(a.submittedBy)}</div></td>
              <td></td>
            </tr>`).join("")}
          <tr>
            <td colspan="4">
              ${pending.length
                ? `<button class="btn btn-gold btn-sm" data-approve="${esc(key)}">Approve ${pending.length} and email them</button>
                   <button class="btn btn-ghost btn-sm" data-return="${esc(key)}">Send back</button>`
                : unsent.length
                  /* Approved, but the email did not go — the case the send is
                     designed to survive. Without this it had no way back. */
                  ? `<button class="btn btn-gold btn-sm" data-approve="${esc(key)}">Send the ${unsent.length} acceptance email${unsent.length === 1 ? "" : "s"}</button>
                     <span class="note">Approved already — this only sends what did not go out.</span>`
                  : `<span class="note">Nothing here is waiting on you.</span>`}
            </td>
          </tr>
        </tbody>
      </table></div>
    </div>`;
  }).join("");
}

document.getElementById("view-approvals").addEventListener("click", async (event) => {
  const approveKey = event.target.closest("[data-approve]")?.dataset.approve;
  const returnKey = event.target.closest("[data-return]")?.dataset.return;
  const key = approveKey ?? returnKey;
  if (!key) return;

  const people = (state.data?.applicants ?? []).filter(
    (a) =>
      a.submittedAt &&
      !a.acceptanceSentAt &&
      `${a.committee || "—"}\u0000${a.subCommittee || "Not given"}` === key
  );
  if (!people.length) return;
  const [committee, sub] = key.split("\u0000");

  if (approveKey) {
    const names = people.slice(0, 15).map((a) => `  ${a.fullName}`).join("\n");
    if (!(await confirmDialog(
      `Accept ${people.length} ${people.length === 1 ? "person" : "people"} into ${committee} · ${sub}?\n\n` +
      names + (people.length > 15 ? `\n  …and ${people.length - 15} more` : "") +
      "\n\nEach one is emailed that they are in, as a reply on their own confirmation thread — the message they will treat as final — and joins the team board as a member of their sub-committee."
    ))) return;

    try {
      const r = await api({ mode: "member-admin-approve", email: state.admin.email, rowIndexes: people.map((a) => a.rowIndex) });
      await load(state.admin.email);
      state.view = "approvals";
      renderAll();
      await noticeDialog(
        `${r.emailed} accepted and emailed.` +
        (r.addedToTeam ? `\n${r.addedToTeam} added to the team board as members of their sub-committee.` : "") +
        (r.failures?.length
          ? `\n\n${r.failures.length} did not go out:\n` + r.failures.map((f) => `  ${f.fullName} — ${f.reason}`).join("\n")
          : "")
      );
    } catch (error) { await noticeDialog(error.message); }
    return;
  }

  if (!(await confirmDialog(`Send ${committee} · ${sub} back to the committee? Nobody is emailed.`))) return;
  try {
    await api({ mode: "member-admin-return", email: state.admin.email, rowIndexes: people.map((a) => a.rowIndex) });
    await load(state.admin.email);
    state.view = "approvals";
    renderAll();
  } catch (error) { await noticeDialog(error.message); }
});

function renderAll() {
  renderStats();
  renderApprovals();
  renderCommitteeGrid();
  renderApplicants();
  renderSlots();
}

/*
 * One-off repair, kept as a button rather than run on load: bookings made
 * while the interview board was written as UTC+02:00 sit an hour after the
 * time the applicant was actually given, because Egypt is on UTC+03:00 until
 * the end of October. It reports first and only moves anything on a second,
 * explicit confirmation. Safe to run repeatedly — an invite already at the
 * right time is left alone — and it emails nobody.
 */
document.getElementById("check-times").addEventListener("click", async () => {
  const button = document.getElementById("check-times");
  button.disabled = true;
  try {
    const report = await api({ mode: "member-admin-fix-interview-times", email: state.admin.email });
    const wrong = report.wrong ?? [];
    const problems = report.problems ?? [];

    const cairo = (iso) => {
      if (!iso) return "unknown";
      try {
        return new Intl.DateTimeFormat("en-GB", {
          timeZone: "Africa/Cairo", weekday: "short", day: "numeric", month: "short",
          hour: "numeric", minute: "2-digit", hour12: true
        }).format(new Date(iso));
      } catch { return iso; }
    };

    /* Every number adds up to the total on purpose: the first version of this
       report left a third of the applicants unaccounted for on screen, which
       reads as "where did the rest go" rather than "those are the past ones". */
    const happened = report.alreadyHappened ?? 0;
    const lines = [
      `${report.checked} booked applicant${report.checked === 1 ? "" : "s"} checked:`,
      `  ${happened} already interviewed — left alone`,
      `  ${report.alreadyCorrect} still to come, already at the right time`,
      `  ${wrong.length} still to come, sitting at the wrong time`,
      `  ${problems.length} need a person to look at ${problems.length === 1 ? "it" : "them"}`,
      `  = ${happened + report.alreadyCorrect + wrong.length + problems.length}`
    ];
    if (wrong.length) {
      lines.push("", "These would move:");
      for (const row of wrong.slice(0, 12)) {
        lines.push(`  ${row.fullName} — calendar says ${cairo(row.was)}, should be ${cairo(row.now)}`);
      }
      if (wrong.length > 12) lines.push(`  …and ${wrong.length - 12} more.`);
    }
    if (problems.length) {
      lines.push("", "Not fixable from here:");
      for (const row of problems.slice(0, 8)) lines.push(`  ${row.fullName} — ${row.reason}`);
      if (problems.length > 8) lines.push(`  …and ${problems.length - 8} more.`);
    }

    if (!wrong.length) {
      await noticeDialog(lines.join("\n"));
      return;
    }

    lines.push("", "Move these invites to the time each applicant was actually given? Nobody is emailed.");
    if (!(await confirmDialog(lines.join("\n")))) return;

    const applied = await api({ mode: "member-admin-fix-interview-times", email: state.admin.email, apply: true });
    const moved = (applied.wrong ?? []).filter((row) => row.fixed).length;
    const stuck = (applied.problems ?? []).length;
    await noticeDialog(
      `${moved} interview invite${moved === 1 ? "" : "s"} moved to the time the applicant was given. Nobody was emailed.` +
        (stuck ? `\n\n${stuck} still need${stuck === 1 ? "s" : ""} a person to look at ${stuck === 1 ? "it" : "them"}.` : "")
    );
    await load(state.admin.email);
  } catch (error) {
    await noticeDialog(error.message);
  } finally {
    button.disabled = false;
  }
});

/*
 * The reminder normally fires on a schedule; this is the manual handle for it.
 * Reports who is due first — a reminder is a real email to a real applicant,
 * so it is never sent on a single click. Already-reminded applicants are
 * skipped by the job itself, so pressing this twice cannot double-mail anyone.
 */
/*
 * Whether this deployment can make an open Meet space — the thing that lets an
 * applicant with no AUC account walk into their interview instead of knocking.
 * Books nothing, writes nothing, emails nobody; it creates one unused meeting
 * link and reports what Google said.
 */
document.getElementById("check-meet").addEventListener("click", async () => {
  const button = document.getElementById("check-meet");
  button.disabled = true;
  try {
    const r = await api({ mode: "member-admin-meet-check", email: state.admin.email });
    await noticeDialog(
      r.available
        ? "Open Meet spaces are working.\n\n" +
          "Every interview booked from now on gets a meeting anyone can walk into — no knocking, no host — " +
          "with the committee on it as co-hosts.\n\n" +
          `Test link (nobody is in it): ${r.meetingUri}`
        : "Open Meet spaces are NOT working, so interviews still use a meeting people may have to be let into.\n\n" +
          `Google said:\n${r.detail}\n\n` +
          "403 usually means the Meet API is not enabled on the project, or the refresh token is missing the " +
          "meetings.space.created scope."
    );
  } catch (error) {
    await noticeDialog(error.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById("send-reminders").addEventListener("click", async () => {
  const button = document.getElementById("send-reminders");
  button.disabled = true;
  try {
    const report = await api({ mode: "member-send-reminders", email: state.admin.email, apply: false });
    const due = report.due ?? [];
    const problems = report.problems ?? [];

    const lines = [
      `${due.length} interview${due.length === 1 ? "" : "s"} starting in the next ${report.windowMinutes} minutes without a reminder yet.`,
      `${report.alreadyReminded} already reminded.`
    ];
    if (due.length) {
      lines.push("", "These would be emailed:");
      for (const row of due.slice(0, 12)) {
        lines.push(`  ${row.fullName} — ${row.slotLabel}${row.threaded ? "" : "  (not on the confirmation thread)"}`);
      }
      if (due.length > 12) lines.push(`  …and ${due.length - 12} more.`);
    }
    if (problems.length) {
      lines.push("", "Needs a person:");
      for (const row of problems.slice(0, 8)) lines.push(`  ${row.fullName} — ${row.reason}`);
    }

    if (!due.length) {
      await noticeDialog(lines.join("\n"));
      return;
    }

    lines.push("", "Send these reminders now? Each one goes out as a reply on that applicant's confirmation thread.");
    if (!(await confirmDialog(lines.join("\n")))) return;

    const applied = await api({ mode: "member-send-reminders", email: state.admin.email, apply: true });
    const sent = (applied.due ?? []).filter((row) => row.sent).length;
    const stuck = (applied.problems ?? []).length;
    await noticeDialog(
      `${sent} reminder${sent === 1 ? "" : "s"} sent.` +
        (stuck ? `\n\n${stuck} could not be sent and will be retried on the next run.` : "")
    );
  } catch (error) {
    await noticeDialog(error.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById("dlg-body").addEventListener("click", async (e) => {
  if (e.target.closest("[data-close]")) {
    document.getElementById("dlg").close();
    return;
  }
  const applicantOf = (btn) => state.data.applicants.find((x) => x.rowIndex === Number(btn.dataset.row));

  const resendBtn = e.target.closest("#dlg-resend");
  if (resendBtn) {
    const a = applicantOf(resendBtn);
    if (!a) return;
    if (!(await confirmDialog(
      `Send ${a.fullName} their interview invite and confirmation?\n\n` +
      `They keep the time they already booked — ${a.interviewSlot}.\n\n` +
      "This is a real email to the applicant, copied to their committee."
    ))) return;
    resendBtn.disabled = true;
    try {
      const r = await api({ mode: "member-admin-resend-confirmation", email: state.admin.email, rowIndex: a.rowIndex });
      state.msg = {
        type: "ok",
        text: `${r.fullName} emailed for ${r.slotLabel}.` +
          (r.inviteCreated ? " Calendar invite created." : " The invite could not be created — the email went anyway.")
      };
      await load(state.admin.email);
    } catch (err) {
      resendBtn.disabled = false;
      state.msg = { type: "bad", text: err.message };
      renderDialog(a);
    }
    return;
  }

  const reBtn = e.target.closest("#dlg-reschedule");
  if (reBtn) {
    const a = applicantOf(reBtn);
    const sel = document.getElementById("dlg-slot");
    const slotId = sel.value;
    if (!slotId) { state.msg = { type: "bad", text: "Choose a time first." }; renderDialog(a); return; }
    const label = sel.options[sel.selectedIndex].textContent;
    if (!(await confirmDialog(
      `Move ${a.fullName}'s interview to ${label}?\n\nThis emails them the new time and updates the calendar invite.`
    ))) return;
    reBtn.disabled = true;
    try {
      const r = await api({ mode: "member-admin-reschedule", email: state.admin.email, rowIndex: a.rowIndex, slotId });
      state.msg = { type: "ok", text: `Moved to ${r.slotLabel}.${r.emailSent ? "" : " Email could not be sent — tell them yourself."}` };
      await load(state.admin.email);
    } catch (err) {
      state.msg = { type: "bad", text: err.message };
    }
    renderDialog(state.data.applicants.find((x) => x.rowIndex === a.rowIndex) ?? a);
    return;
  }

  const cancelBtn = e.target.closest("#dlg-cancel-interview");
  if (cancelBtn) {
    const a = applicantOf(cancelBtn);
    if (!(await confirmDialog(
      `Cancel ${a.fullName}'s interview?\n\nThe slot is freed and the calendar invite withdrawn. No email is sent — tell them yourself, or reschedule them here.`
    ))) return;
    cancelBtn.disabled = true;
    try {
      await api({ mode: "member-admin-cancel-interview", email: state.admin.email, rowIndex: a.rowIndex });
      state.msg = { type: "ok", text: "Interview cancelled — they are back in Needs scheduling." };
      await load(state.admin.email);
    } catch (err) {
      state.msg = { type: "bad", text: err.message };
    }
    renderDialog(state.data.applicants.find((x) => x.rowIndex === a.rowIndex) ?? a);
    return;
  }

  const gvBtn = e.target.closest("#dlg-general-volunteer");
  if (gvBtn) {
    const a = applicantOf(gvBtn);
    if (!(await confirmDialog(
      `Accept ${a.fullName} as a general volunteer?\n\nThis emails them immediately that they are accepted as a general volunteer, not as a committee member, and frees their interview slot. It cannot be undone from here.`
    ))) return;
    gvBtn.disabled = true;
    try {
      const r = await api({ mode: "member-admin-general-volunteer", email: state.admin.email, rowIndex: a.rowIndex });
      state.msg = {
        type: r.emailSent ? "ok" : "bad",
        text: r.emailSent
          ? `${r.fullName} accepted as a general volunteer and emailed.`
          : `${r.fullName} marked as a general volunteer, but the email did not send — tell them yourself.`
      };
      await load(state.admin.email);
    } catch (err) {
      state.msg = { type: "bad", text: err.message };
    }
    renderDialog(state.data.applicants.find((x) => x.rowIndex === a.rowIndex) ?? a);
    return;
  }

  const saveBtn = e.target.closest("#dlg-save-status");
  if (saveBtn) {
    const rowIndex = Number(saveBtn.dataset.row);
    const status = document.getElementById("dlg-status").value;
    saveBtn.disabled = true;
    try {
      await api({ mode: "member-admin-set-status", email: state.admin.email, rowIndex, status });
      const applicant = state.data.applicants.find((x) => x.rowIndex === rowIndex);
      if (applicant) applicant.status = status;
      state.msg = { type: "ok", text: "Status saved." };
      renderApplicants();
      renderStats();
    } catch (err) {
      state.msg = { type: "bad", text: err.message };
    }
    const applicant = state.data.applicants.find((x) => x.rowIndex === rowIndex);
    if (applicant) renderDialog(applicant);
  }
});

const cachedEmail = sessionStorage.getItem("member-recruitment-admin-email");
if (cachedEmail) {
  document.getElementById("email").value = cachedEmail;
  load(cachedEmail).catch(() => {});
}
</script>
</body>
