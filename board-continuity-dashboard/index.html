<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Continuity Dashboard | Resala AUC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c2c80">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dashboard.css">
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <div class="badge"><img src="../The brand System/assets/Resala Logo - source.png" alt="Resala AUC" width="1920" height="1080"></div>
    <h1>Board Continuity</h1>
    <p>The Board's reflections and continuity answers. Sign in with the Resala account.</p>
    <div id="google-signin" style="display:flex;justify-content:center;min-height:44px;"></div>
    <div class="error hidden" id="login-error"></div>
  </div>
</div>

<div class="hidden" id="app">
  <header class="bar">
    <div class="badge"><img src="../The brand System/assets/Resala Logo - source.png" alt="" width="1920" height="1080"></div>
    <div>
      <div class="bar-title">Board Continuity</div>
      <div class="bar-sub" id="bar-sub"></div>
    </div>
    <span class="spacer"></span>
    <button class="btn btn-bar" id="refresh" type="button" title="Reload answers">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      <span class="btn-text">Refresh</span>
    </button>
    <button class="btn btn-bar" id="export" type="button" title="Download as CSV">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      <span class="btn-text">Export CSV</span>
    </button>
    <button class="btn btn-bar" id="signout" type="button">Sign out</button>
  </header>

  <main>
    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, email, position, or any answer…" aria-label="Search">
      <label>Continuing
        <select id="f-continue" aria-label="Filter by continuing">
          <option value="">All</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </label>
      <label>Board wish
        <select id="f-board" aria-label="Filter by board preference">
          <option value="">All</option>
          <option value="Yes, in my current position">Same position</option>
          <option value="Yes, but I am open to a different position">Open to another</option>
          <option value="No, I would prefer to continue as a Resala member rather than a Board member">Member only</option>
          <option value="No, I do not wish to continue with Resala">Leaving</option>
        </select>
      </label>
      <label>Status
        <select id="f-status" aria-label="Filter by status"><option value="">All</option></select>
      </label>
      <span class="count" id="count"></span>
    </div>

    <div class="split">
      <div class="panel list-panel"><div class="list" id="list" role="listbox" aria-label="Responses"></div></div>
      <article class="panel detail" id="detail" aria-live="polite"></article>
    </div>
  </main>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script type="module">
import { mountSignIn, currentSession, sessionToken, signOut, signedOutGuard, isSignInError } from "../admin-auth.js";
const ENDPOINT = "https://upnmxdgqdkvgzfwqaicb.supabase.co/functions/v1/submit";
const isPreview = new URLSearchParams(location.search).get("preview") === "1";

const BOARD_SHORT = {
  "Yes, in my current position": { label: "Same position", cls: "green" },
  "Yes, but I am open to a different position": { label: "Open to another role", cls: "blue" },
  "No, I would prefer to continue as a Resala member rather than a Board member": { label: "Member only", cls: "amber" },
  "No, I do not wish to continue with Resala": { label: "Leaving Resala", cls: "red" }
};
const STATUS_CLS = { "Undecided": "", "Keep in role": "green", "Move to new role": "blue", "Continue as member": "amber", "Not continuing": "red" };
const SECTIONS = [
  { title: "Semester Reflection", keys: ["bestFit", "shortcomings", "negativeFactors", "learned", "stillFit", "messages", "recommendations"] },
  { title: "Continuity & Future Intentions", keys: ["continueJourney", "boardConsideration", "otherConsiderations"] }
];

let state = { viewer: null, questions: [], responses: [], decisions: {}, statuses: [], selected: null };
const $ = (id) => document.getElementById(id);
const norm = (v) => String(v ?? "").trim().toLowerCase();
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };

async function api(payload) {
  if (isPreview) return previewApi(payload);
  const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...payload, session: sessionToken() }) });
  let body;
  try { body = await res.json(); } catch { throw new Error(`The server answered ${res.status} with no detail.`); }
  if (!res.ok || body.ok === false) throw signedOutGuard(new Error(body.error || `The server answered ${res.status} with no detail.`));
  return body;
}

function absorb(body) {
  state.viewer = body.viewer; state.questions = body.questions; state.decisions = body.decisions || {}; state.statuses = body.statuses || [];
  state.allResponses = body.responses || [];
  // A person may submit more than once: show their latest, keep the count.
  const latest = new Map();
  for (const r of state.allResponses) {
    const k = norm(r.aucEmail);
    const prev = latest.get(k);
    if (!prev || String(r.submittedAt) >= String(prev.submittedAt)) latest.set(k, r);
  }
  state.responses = [...latest.values()].sort((a, b) => String(b.submittedAt).localeCompare(String(a.submittedAt)));
  const f = $("f-status");
  if (f.options.length === 1) state.statuses.forEach((s) => f.add(new Option(s, s)));
}

const statusOf = (r) => state.decisions[norm(r.aucEmail)]?.status || "Undecided";
const submissionsOf = (r) => state.allResponses.filter((x) => norm(x.aucEmail) === norm(r.aucEmail)).length;

function filtered() {
  const q = norm($("search").value);
  const fc = $("f-continue").value, fb = $("f-board").value, fs = $("f-status").value;
  return state.responses.filter((r) => {
    if (fc && r.continueJourney !== fc) return false;
    if (fb && r.boardConsideration !== fb) return false;
    if (fs && statusOf(r) !== fs) return false;
    if (q && !Object.values(r).some((v) => norm(v).includes(q)) && !norm(state.decisions[norm(r.aucEmail)]?.notes).includes(q)) return false;
    return true;
  });
}

function renderStats() {
  const all = state.responses, n = all.length || 1;
  const c = (fn) => all.filter(fn).length;
  const items = [
    { k: "Responses", v: all.length, p: null },
    { k: "Willing to continue", v: c((r) => r.continueJourney === "Yes") },
    { k: "Same position", v: c((r) => r.boardConsideration === "Yes, in my current position") },
    { k: "Open to another role", v: c((r) => r.boardConsideration === "Yes, but I am open to a different position") },
    { k: "Member only / leaving", v: c((r) => r.boardConsideration.startsWith("No")) },
    { k: "Decided", v: c((r) => statusOf(r) !== "Undecided") }
  ];
  $("stats").innerHTML = items.map((it, i) => `<div class="stat"><div class="v">${it.v}</div><div class="k">${esc(it.k)}</div>${i ? `<div class="bar-mini"><span style="width:${Math.round((it.v / n) * 100)}%"></span></div>` : ""}</div>`).join("");
}

function renderList() {
  const rows = filtered();
  $("count").textContent = `${rows.length} of ${state.responses.length} shown`;
  if (!state.responses.length) {
    $("list").innerHTML = `<div class="empty"><strong>No responses yet</strong>Answers appear here as Board members submit the form.</div>`;
    return;
  }
  if (!rows.length) { $("list").innerHTML = `<div class="empty"><strong>Nothing matches</strong>Try clearing a filter.</div>`; return; }
  $("list").innerHTML = rows.map((r) => {
    const b = BOARD_SHORT[r.boardConsideration] || { label: r.boardConsideration, cls: "" };
    const st = statusOf(r);
    return `<button type="button" class="row" role="option" data-email="${esc(norm(r.aucEmail))}" aria-selected="${norm(r.aucEmail) === state.selected}">
      <span class="name">${esc(r.fullName)}</span><span class="when">${esc(fmt(r.submittedAt))}</span>
      <span class="pos">${esc(r.position)}</span>
      <span class="tags"><span class="tag ${b.cls}">${esc(b.label)}</span>${st !== "Undecided" ? `<span class="tag ${STATUS_CLS[st] || ""}">${esc(st)}</span>` : ""}</span>
    </button>`;
  }).join("");
}

function renderDetail() {
  const r = state.responses.find((x) => norm(x.aucEmail) === state.selected);
  if (!r) {
    $("detail").innerHTML = `<div class="empty"><strong>Select a response</strong>Pick a Board member on the left to read their reflection.</div>`;
    return;
  }
  const header = Object.fromEntries(state.questions.map((q) => [q.key, q.header]));
  const d = state.decisions[norm(r.aucEmail)] || {};
  const b = BOARD_SHORT[r.boardConsideration] || { label: r.boardConsideration, cls: "" };
  const subs = submissionsOf(r);
  const qa = (k) => `<div class="qa"><div class="q">${esc(header[k] || k)}</div><div class="a ${r[k] ? "" : "none"}">${r[k] ? esc(r[k]) : "No answer"}</div></div>`;
  $("detail").innerHTML = `
    <div class="detail-head">
      <button type="button" class="btn back" id="back">← All responses</button>
      <h2>${esc(r.fullName)}</h2>
      <div class="meta">${esc(r.position)} · <a href="mailto:${esc(r.aucEmail)}">${esc(r.aucEmail)}</a> · ${esc(fmt(r.submittedAt))}</div>
      <div class="tags"><span class="tag ${r.continueJourney === "Yes" ? "green" : "red"}">Continuing: ${esc(r.continueJourney)}</span><span class="tag ${b.cls}">${esc(b.label)}</span></div>
      ${subs > 1 ? `<div class="history">Submitted ${subs} times. Showing the latest; earlier ones stay in the sheet.</div>` : ""}
    </div>
    <form class="decision" id="decision-form">
      <h3>Presidential Team decision</h3>
      <div class="grid">
        <div><label for="d-status">Status</label><select id="d-status">${state.statuses.map((s) => `<option ${s === (d.status || "Undecided") ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></div>
        <div><label for="d-role">Proposed role next semester</label><input id="d-role" maxlength="200" value="${esc(d.proposedRole || "")}" placeholder="e.g. Director of Operations"></div>
      </div>
      <div style="margin-top:10px;"><label for="d-notes">Private notes</label><textarea id="d-notes" maxlength="5000" placeholder="Only the Presidential Team sees these.">${esc(d.notes || "")}</textarea></div>
      <div class="foot"><button type="submit" class="btn btn-primary" id="d-save">Save decision</button><span class="saved">${d.updatedAt ? `Last saved by ${esc(d.updatedBy)} · ${esc(fmt(d.updatedAt))}` : "Not decided yet"}</span></div>
    </form>
    <div class="answers">
      ${SECTIONS.map((s) => `<p class="section-label">${esc(s.title)}</p>${s.keys.map(qa).join("")}`).join("")}
    </div>`;
  $("back").addEventListener("click", () => { document.body.classList.remove("show-detail"); window.scrollTo({ top: 0 }); });
  $("decision-form").addEventListener("submit", saveDecision);
}

function render() { renderStats(); renderList(); renderDetail(); }

async function saveDecision(e) {
  e.preventDefault();
  const btn = $("d-save"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    absorb(await api({ mode: "board-continuity-decide", aucEmail: state.selected, status: $("d-status").value, proposedRole: $("d-role").value, notes: $("d-notes").value }));
    render(); toast("Decision saved");
  } catch (error) { toast(error.message); btn.disabled = false; btn.textContent = "Save decision"; }
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2600); }

function exportCsv() {
  const header = state.questions.map((q) => q.header);
  const cols = ["Submitted At", ...header, "Status", "Proposed Role", "Notes"];
  const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [cols.map(cell).join(",")];
  for (const r of filtered()) {
    const d = state.decisions[norm(r.aucEmail)] || {};
    lines.push([r.submittedAt, ...state.questions.map((q) => r[q.key]), statusOf(r), d.proposedRole, d.notes].map(cell).join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `board-continuity-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$("list").addEventListener("click", (e) => {
  const row = e.target.closest(".row"); if (!row) return;
  state.selected = row.dataset.email;
  document.body.classList.add("show-detail");
  renderList(); renderDetail();
  if (window.matchMedia("(max-width: 860px)").matches) window.scrollTo({ top: 0 });
});
["search", "f-continue", "f-board", "f-status"].forEach((id) => $(id).addEventListener("input", renderList));
$("export").addEventListener("click", exportCsv);
$("refresh").addEventListener("click", async () => {
  const b = $("refresh"); b.disabled = true;
  try { absorb(await api({ mode: "board-continuity-load" })); render(); toast("Up to date"); } catch (error) { toast(error.message); } finally { b.disabled = false; }
});
$("signout").addEventListener("click", () => { signOut(); location.reload(); });

async function load() {
  absorb(await api({ mode: "board-continuity-load" }));
  if (!state.selected && state.responses[0] && window.matchMedia("(min-width: 861px)").matches) state.selected = norm(state.responses[0].aucEmail);
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("bar-sub").textContent = state.viewer?.email ?? "";
  render();
}

function showSignInError(error) { const el = $("login-error"); el.textContent = error.message; el.classList.remove("hidden"); }

/* ?preview=1: stand-in answers, nothing read or saved, so the layout can be
   checked without a Presidential Team account. */
function previewApi(payload) {
  const Q = [["fullName","Full Name"],["aucEmail","AUC Email"],["position","Current Board Position & Team"],["bestFit","Why I Am the Best Fit"],["shortcomings","Biggest Shortcomings"],["negativeFactors","Factors That Negatively Impacted Me"],["learned","What I Learned"],["stillFit","Still a Good Fit? Why"],["messages","Messages to Resala"],["recommendations","Recommendations for Next Semester"],["continueJourney","Continue With Resala Next Semester"],["boardConsideration","Board Position Next Semester"],["otherConsiderations","Anything Else to Consider"]].map(([key, header]) => ({ key, header }));
  window.__pv ??= {
    decisions: { "sample.two@aucegypt.edu": { status: "Keep in role", proposedRole: "Director of Operations", notes: "Strong semester.", updatedBy: "preview@aucegypt.edu", updatedAt: new Date().toISOString() } },
    responses: [
      { fullName: "Sample Member One", aucEmail: "sample.one@aucegypt.edu", position: "Head of Graphic Design, Branding / Media", bestFit: "Sample answer.", shortcomings: "Sample answer.", negativeFactors: "Sample answer.", learned: "Sample answer.", stillFit: "Sample answer.", messages: "", recommendations: "Sample answer.", continueJourney: "Yes", boardConsideration: "Yes, but I am open to a different position", otherConsiderations: "", submittedAt: "2026-11-22T10:00:00Z" },
      { fullName: "Sample Member Two", aucEmail: "sample.two@aucegypt.edu", position: "Director, Operations", bestFit: "Sample answer.", shortcomings: "Sample answer.", negativeFactors: "Sample answer.", learned: "Sample answer.", stillFit: "Sample answer.", messages: "Sample answer.", recommendations: "", continueJourney: "Yes", boardConsideration: "Yes, in my current position", otherConsiderations: "", submittedAt: "2026-11-22T09:00:00Z" },
      { fullName: "Sample Member Three", aucEmail: "sample.three@aucegypt.edu", position: "Vice-Director, HR", bestFit: "Sample answer.", shortcomings: "Sample answer.", negativeFactors: "Sample answer.", learned: "Sample answer.", stillFit: "Sample answer.", messages: "", recommendations: "", continueJourney: "No", boardConsideration: "No, I do not wish to continue with Resala", otherConsiderations: "Sample answer.", submittedAt: "2026-11-21T18:00:00Z" }
    ]
  };
  if (payload.mode === "board-continuity-decide") {
    window.__pv.decisions[payload.aucEmail] = { status: payload.status, proposedRole: payload.proposedRole, notes: payload.notes, updatedBy: "preview@aucegypt.edu", updatedAt: new Date().toISOString() };
  }
  return { ok: true, viewer: { email: "Preview · nothing is saved" }, questions: Q, responses: window.__pv.responses, decisions: window.__pv.decisions, statuses: ["Undecided", "Keep in role", "Move to new role", "Continue as member", "Not continuing"] };
}

if (isPreview) {
  load();
} else {
  mountSignIn({
    endpoint: ENDPOINT,
    container: $("google-signin"),
    onSignedIn: () => { $("login-error").classList.add("hidden"); return load(); },
    onError: showSignInError
  });
  if (currentSession()) load().catch((error) => { if (!isSignInError(error)) showSignInError(error); });
}
</script>
</body>
</html>
