<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Admin — Resala AUC</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0c2c80; --sky: #a7d4f2; --gold: #eac262;
    --ivory: #fdf9f3; --ink: #1b1f23;
    --line: #e4dccd; --muted: #6b7280; --soft: #f7f4ee;
    --good: #1a7f4b; --warn: #9a6b00; --bad: #a3231b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink);
         font: 15px/1.6 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  a { color: var(--blue); }

  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line);
                border-radius: 18px; padding: 34px 30px; text-align: center; }
  .login-card img { width: 68px; height: 68px; margin: 0 auto 16px; display: block; }
  .login-card h1 { margin: 0 0 6px; font-size: 21px; color: var(--blue); }
  .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase;
          letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
  input[type=email], input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--soft); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--sky); outline-offset: 1px; background: #fff; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 11px 17px; font-weight: 700; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-ghost { background: #fff; color: var(--blue); border: 1px solid var(--line); font-weight: 600; }
  .btn-sm { padding: 7px 12px; font-size: 13.5px; }
  .btn-block { width: 100%; margin-top: 18px; }
  .error { margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: #fdecec; color: #8c1c1c;
           font-size: 13px; text-align: left; }

  header.bar { background: var(--blue); color: #fff; padding: 14px 20px; display: flex;
               align-items: center; gap: 14px; flex-wrap: wrap; }
  header.bar img { width: 38px; height: 38px; }
  .bar-title { font-weight: 700; font-size: 17px; }
  .bar-sub { color: var(--sky); font-size: 12.5px; }
  .bar-spacer { flex: 1; }
  header.bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
                      border-radius: 8px; padding: 7px 13px; font-size: 13px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 70px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 18px; min-width: 130px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; }
  .filters > div { min-width: 180px; }

  .committee { margin-bottom: 26px; }
  .committee > h2 { font-size: 15px; color: var(--blue); margin: 0 0 10px;
                    display: flex; align-items: baseline; gap: 9px; }
  .committee > h2 .c { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { background: var(--soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fcfaf6; }
  tbody tr[aria-current="true"] { background: #f2f6fd; }
  .num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
  .pill.done { background: #e8f6ee; color: var(--good); }
  .pill.open { background: var(--soft); color: var(--muted); }
  .pill.part { background: #fdf4e0; color: var(--warn); }
  .pill.bad { background: #fdecec; color: var(--bad); }
  .wrap-x { overflow-x: auto; }

  dialog { border: 0; border-radius: 16px; padding: 0; max-width: 760px; width: calc(100% - 32px);
           box-shadow: 0 24px 60px rgba(0,0,0,.24); }
  dialog::backdrop { background: rgba(12,26,50,.5); }
  .dlg { padding: 24px 26px 26px; }
  .dlg h2 { margin: 0 0 2px; font-size: 21px; color: var(--blue); }
  .dlg .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; margin-bottom: 16px; }
  .facts b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
             color: var(--muted); font-weight: 700; }
  h3.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
           margin: 20px 0 9px; padding-top: 14px; border-top: 1px solid var(--line); }
  .qa .q { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .qa .a { white-space: pre-wrap; color: #3f4650; margin-bottom: 13px; font-size: 14px; }
  .srow { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 9px; font-size: 13.5px; }
  .srow .who { font-weight: 700; }
  .srow .brk { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .srow .nt { white-space: pre-wrap; margin-top: 6px; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row2 > div { flex: 1 1 150px; }
  .note { font-size: 13px; color: var(--muted); }
  .msg { margin-top: 12px; font-size: 13.5px; }
  .msg.ok { color: var(--good); }
  .msg.bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 30px 4px; }
  .close { float: right; background: transparent; border: 0; font-size: 22px; color: var(--muted); line-height: 1; }

  /* ── team diagrams (admin approval) ───────────────────────────────────── */
  .views { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .team-summary { display: flex; gap: 10px 20px; flex-wrap: wrap; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 18px; margin-bottom: 16px; }
  .team-summary .count { font-size: 13.5px; color: var(--muted); }
  .team-summary .count b { color: var(--ink); }
  .missing-summary { background: #fdf4e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; }
  .missing-summary-title { font-weight: 700; color: var(--warn); font-size: 13px; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 12px; }
  .missing-grid { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; align-items: start; }
  .missing-name { font-weight: 700; font-size: 13.5px; color: var(--ink); white-space: nowrap; padding-top: 3px; }
  .missing-roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-chip { background: #fff; border: 1px solid #e3b96a; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--ink); }
  @media (max-width: 640px) { .missing-grid { grid-template-columns: 1fr; } .missing-name { padding-top: 0; } }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin: 14px 0 16px; }
  .role-box { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; }
  .role-box.missing { border-color: #e3b96a; background: #fffaf0; }
  .role-box-title { font-weight: 700; margin-bottom: 9px; font-size: 14px; }
  .slot-group { margin-bottom: 9px; }
  .slot-group:last-child { margin-bottom: 0; }
  .slot-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .slot-chip { display: flex; align-items: center; gap: 7px; background: var(--soft); border-radius: 9px; padding: 6px 9px; margin-bottom: 6px; font-size: 13px; }
  .chip-check { flex: 0 0 auto; margin: 0; accent-color: var(--blue); }
  .contested-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 9px 0; border-top: 1px solid #f0e2c4; }
  .contested-row:first-of-type { border-top: 0; }
  .contested-who { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; }
  .contested-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-name { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .chip-name:hover { color: var(--blue); }
  .wl-rank { flex: 0 0 auto; width: 17px; height: 17px; border-radius: 999px; background: var(--blue);
    color: #fff; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .retired-tag { margin-left: 7px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); background: var(--soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 7px; vertical-align: middle; }
  .add-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .add-row select { flex: 1 1 100%; padding: 6px 8px; font-size: 12.5px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--soft); color: var(--ink); }
  .add-row select[data-add-position] { flex: 1 1 0; min-width: 0; }
  .add-row button { flex: 0 0 auto; }
  .chip-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
  .chip-status.draft { background: #fdf4e0; color: var(--warn); }
  .chip-status.submitted { background: #e8effd; color: var(--blue); }
  .chip-status.sent { background: #e8f6ee; color: var(--good); }
  .chip-status.pending { background: #fdecec; color: var(--bad); }
  .chip-x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 14px; line-height: 1; padding: 2px 4px; flex: 0 0 auto; }
  .chip-x:hover { color: var(--bad); }
  .cov-ok { background: #e8f6ee; color: var(--good); font-weight: 700; }
  .cov-short { background: #fdecec; color: var(--bad); font-weight: 700; }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://resala-auc.github.io/join/resala-logo.png" alt="Resala AUC">
    <h1>Recruitment Admin</h1>
    <p>Heads cycle. Restricted to the people running this recruitment.</p>
    <label for="email">AUC email</label>
    <input type="email" id="email" placeholder="you@aucegypt.edu" autocomplete="email">
    <button class="btn btn-block" id="login-btn">Enter</button>
    <div class="error hidden" id="login-error"></div>
  </div>
</div>

<div class="hidden" id="app">
  <header class="bar">
    <img src="https://resala-auc.github.io/join/resala-logo.png" alt="">
    <div>
      <div class="bar-title">Recruitment Admin</div>
      <div class="bar-sub" id="bar-sub">—</div>
    </div>
    <div class="bar-spacer"></div>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="views" role="tablist" id="views">
      <button class="tab" data-view="applicants" aria-selected="true">Applicants</button>
      <button class="tab" data-view="teams">Team diagrams</button>
      <button class="tab" data-view="hierarchy">Hierarchy</button>
      <button class="tab" data-view="onboarding">Onboarding</button>
      <button class="tab" data-view="slots">Slots</button>
    </div>

    <div id="view-applicants">
      <div class="filters">
        <div>
          <label for="f-committee">Committee</label>
          <select id="f-committee"><option value="">All committees</option></select>
        </div>
        <div>
          <label for="f-state">Scoring</label>
          <select id="f-state">
            <option value="">Any</option>
            <option value="none">Not scored</option>
            <option value="part">Partly scored</option>
            <option value="done">Scored by both</option>
          </select>
        </div>
      </div>
      <div id="groups"></div>
      <div class="empty hidden" id="empty">No applications yet.</div>
    </div>

    <div id="view-teams" class="hidden"></div>
    <div id="view-hierarchy" class="hidden"></div>
    <div id="view-onboarding" class="hidden"></div>
    <div id="view-slots" class="hidden"></div>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<!-- Replaces window.confirm(): on mobile, a browser can quietly stop showing
     native confirm/alert dialogs after a couple fire in quick succession — no
     popup, no error, confirm() just returns false, and whatever it guarded
     does nothing with no sign of why. A dialog built from page elements
     always renders, because it is not that native chrome. -->
<dialog id="confirm-dialog" style="max-width:420px;">
  <div class="dlg" style="padding:22px 24px;">
    <p id="confirm-message" style="margin:0 0 20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-gold" id="confirm-ok">Confirm</button>
    </div>
  </div>
</dialog>

<script type="module">
import { getRubric, totalScore } from "../scoring-rubrics.js";
import { getInterviewConfig } from "../interview-config.js";
import { getRoleGuideById, getAllHeadsForHierarchy } from "../role-guide-data.js";

const ENDPOINT = "https://upnmxdgqdkvgzfwqaicb.supabase.co/functions/v1/submit";

const IDS_BY_NAME = {
  "tech director": "tech-director", "operations": "operations",
  "branding / media": "branding-media", "hr": "hr",
  "pr / fundraising": "pr-fundraising", "visits": "visits",
  "children day director": "children-day-director", "initiatives director": "initiatives-director"
};
const DISPLAY_NAMES = {
  "tech director": "Tech Team", "initiatives director": "Initiatives",
  "children day director": "Children’s Day"
};
const norm = (v) => String(v ?? "").trim().toLowerCase();
/* Second preferences arrive as "Committee — Head": rename the committee half,
   pass the head through. A bare committee name works the same way. */
const display = (v) => {
  const [committee, ...rest] = String(v ?? "").trim().split("—");
  const head = rest.join("—").trim();
  const named = DISPLAY_NAMES[norm(committee)] ?? committee.trim();
  return head ? `${named} — ${head}` : named;
};
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yesNoBadge = (v) => v === "Yes"
  ? `<span class="pill done">Yes</span>`
  : `<span class="pill open">Not yet</span>`;

function confirmDialog(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById("confirm-dialog");
    document.getElementById("confirm-message").textContent = message;
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    const finish = (result) => {
      dlg.close();
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      dlg.removeEventListener("cancel", onCancel);
      resolve(result);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    dlg.addEventListener("cancel", onCancel); // Esc key
    dlg.showModal();
  });
}

let state = { admin: null, data: null, selected: null, teamMsg: null };

async function api(payload) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const body = await res.json();
  if (!res.ok || body.ok === false) throw new Error(body.error || "Something went wrong.");
  return body;
}

const committeeIdOf = (a) => a.committeeId || IDS_BY_NAME[norm(a.roleAppliedFor)] || "";
function headIdOf(a) {
  if (a.headId) return a.headId;
  const name = norm(a.headName);
  return ["engagement", "inclusion", "tracking", "recognition"].find((k) => name.includes(k)) || "";
}

/* The two things an applicant can be scored on: the committee they put first,
   and — for whoever sits in on the second-preference half of the interview —
   the committee they put second. Each carries its own rubric and its own head,
   so they are scored separately and stored as separate rows. */
function preferencesOf(a) {
  const [secondCommittee, ...rest] = String(a.secondPreference || "").split("—");
  const list = [{
    key: "first",
    label: `${display(a.roleAppliedFor)} · ${a.headName || "—"} (first)`,
    committee: a.roleAppliedFor,
    committeeId: committeeIdOf(a),
    headId: headIdOf(a),
    headRole: a.headName || "",
    preference: "First"
  }];
  if (String(a.secondPreference || "").trim()) {
    list.push({
      key: "second",
      label: `${display(a.secondPreference)} (second)`,
      committee: a.secondPreference,
      committeeId: a.secondCommitteeId || IDS_BY_NAME[norm(secondCommittee)] || "",
      headId: a.secondHeadId || "",
      headRole: rest.join("—").trim(),
      preference: "Second"
    });
  }
  return list;
}

/** This admin's own saved score for one applicant on one committee, if any. */
const myScoreFor = (a, committee) => (a.scores || []).find(
  (s) => norm(s.interviewerEmail) === norm(state.admin?.email) && normRole(s.committee) === normRole(committee)
);

const normRole = (v) => String(v ?? "").trim().toLowerCase().replaceAll("/", " ").replace(/\s+/g, " ");

/* A committee collects work before the interview when its own config says so,
   which is the same config the booking flow and the emails read. */
function expectsTask(a) {
  const task = getInterviewConfig(committeeIdOf(a))?.task;
  return Boolean(task?.required && task.submissionUrl);
}
const submittedLink = (a) => {
  const link = String(a.taskLink || "").trim();
  return /^https?:\/\//.test(link) ? link : "";
};

/* There is no second interview slot: a second preference only ever rides
   along on the interview already booked with the first choice, so this is
   the second committee's own answer to "can you make that time" — not a
   score, not a booking. A "Not available" is the cue to assign someone else. */
const secondPrefAvailabilityPill = (a) => {
  if (!a.secondPreference) return "";
  const status = String(a.secondPreferenceAvailability || "").trim();
  if (status === "Available") return `<span class="pill done">Available</span>`;
  if (status === "Not Available") return `<span class="pill bad">Can't make it</span>`;
  return `<span class="pill part">Awaiting reply</span>`;
};

/** Scores for the committee the applicant actually applied to. */
const firstScores = (a) =>
  (a.scores || []).filter((s) => norm(s.committee) === norm(a.roleAppliedFor));

function panelAverage(a) {
  const totals = firstScores(a).map((s) => Number(s.total)).filter(Number.isFinite);
  return totals.length ? totals.reduce((x, y) => x + y, 0) / totals.length : null;
}

function scoringState(a) {
  const n = firstScores(a).length;
  return n === 0 ? "none" : n === 1 ? "part" : "done";
}

/* ── rendering ──────────────────────────────────────────────────────────── */

function renderStats() {
  const all = state.data.applicants;
  const scored = all.filter((a) => scoringState(a) !== "none").length;
  const booked = all.filter((a) => String(a.interviewSlot || "").trim()).length;
  const committees = new Set(all.map((a) => norm(a.roleAppliedFor))).size;
  document.getElementById("stats").innerHTML = [
    [all.length, "Applicants"], [booked, "Interviews booked"],
    [scored, "Scored"], [committees, "Committees active"],
    [state.data.assignments.length, "Third interviewers"]
  ].map(([v, k]) => `<div class="stat"><div class="v num">${v}</div><div class="k">${k}</div></div>`).join("");
}

function renderFilters() {
  const sel = document.getElementById("f-committee");
  const names = [...new Set(state.data.applicants.map((a) => a.roleAppliedFor))].filter(Boolean).sort();
  const current = sel.value;
  sel.innerHTML = `<option value="">All committees</option>` +
    names.map((n) => `<option value="${esc(n)}">${esc(display(n))}</option>`).join("");
  sel.value = current;
}

function visibleApplicants() {
  const committee = document.getElementById("f-committee").value;
  const wanted = document.getElementById("f-state").value;
  return state.data.applicants.filter((a) =>
    (!committee || a.roleAppliedFor === committee) && (!wanted || scoringState(a) === wanted));
}

function renderGroups() {
  const list = visibleApplicants();
  document.getElementById("empty").classList.toggle("hidden", list.length > 0);

  const byCommittee = new Map();
  for (const a of list) {
    const key = a.roleAppliedFor || "Unassigned";
    if (!byCommittee.has(key)) byCommittee.set(key, []);
    byCommittee.get(key).push(a);
  }

  const html = [...byCommittee.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([committee, rows]) => {
    // Ranked by panel average; unscored sink to the bottom rather than counting
    // as zero, which would rank them against people who were actually judged.
    rows.sort((a, b) => {
      const x = panelAverage(a), y = panelAverage(b);
      if (x === null && y === null) return String(a.fullName).localeCompare(String(b.fullName));
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });

    // Only the committees that collect work before the interview carry the
    // column, so the other tables stay as narrow as they were.
    const showTask = rows.some((a) => expectsTask(a));

    return `<section class="committee">
      <h2>${esc(display(committee))} <span class="c">${rows.length} applicant${rows.length === 1 ? "" : "s"}</span></h2>
      <div class="wrap-x"><table>
        <thead><tr>
          <th>#</th><th>Applicant</th><th>Head</th><th>Interview</th>
          ${showTask ? "<th>Task</th>" : ""}
          <th>Score</th><th>Scoring</th><th>Second preference</th><th>3rd interviewer</th>
        </tr></thead>
        <tbody>${rows.map((a, i) => {
          const avg = panelAverage(a);
          const st = scoringState(a);
          const assigned = (a.assignments || []).map((x) => x.assigneeName || x.assigneeEmail).join(", ");
          return `<tr data-email="${esc(a.email)}" aria-current="${norm(a.email) === norm(state.selected)}">
            <td class="num">${avg === null ? "—" : i + 1}</td>
            <td><b>${esc(a.fullName)}</b><div class="note">${esc(a.email)}</div></td>
            <td>${esc(a.headName || "—")}</td>
            <td>${esc(a.interviewSlot || "Not booked")}
                <div class="note">${esc(a.interviewStatus || "")}</div></td>
            ${showTask ? `<td>${
              submittedLink(a)
                ? `<a href="${esc(submittedLink(a))}" target="_blank" rel="noopener">Open</a>
                   <div class="note">${esc(String(a.taskSubmittedAt || "").slice(0, 16).replace("T", " "))}</div>`
                : expectsTask(a) ? `<span class="note">Not submitted</span>` : "—"
            }</td>` : ""}
            <td class="num">${avg === null ? "—" : Math.round(avg) + "/100"}</td>
            <td><span class="pill ${st}">${st === "none" ? "Not scored" : st === "part" ? "1 of 2" : "Both"}</span></td>
            <td>${esc(display(a.secondPreference) || "—")}
                ${secondPrefAvailabilityPill(a) ? `<div style="margin-top:4px;">${secondPrefAvailabilityPill(a)}</div>` : ""}</td>
            <td>${esc(assigned || "—")}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </section>`;
  }).join("");

  document.getElementById("groups").innerHTML = html;
}

/* What the applicant handed in themselves, which is a different thing from the
   link an interviewer pastes onto their own score row. */
function taskLine(a) {
  const link = submittedLink(a);
  if (link) {
    const when = String(a.taskSubmittedAt || "").slice(0, 16).replace("T", " ");
    return `<div class="note">Task submitted${when ? ` ${esc(when)}` : ""}:
      <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div>`;
  }
  return expectsTask(a)
    ? `<div class="note">Task not submitted yet. It is due an hour before the interview.</div>`
    : "";
}

/* Shown just above the assign-a-third-interviewer form: what to act on, and
   why, rather than making HR cross-reference the pill in the table. */
function secondPreferenceStatusBanner(a) {
  const status = String(a.secondPreferenceAvailability || "").trim();
  const committee = display(a.secondPreference);
  const when = String(a.secondPreferenceAvailabilitySetAt || "").slice(0, 16).replace("T", " ");
  if (status === "Not Available") {
    return `<div class="note" style="background:#fdecec;color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
      <b>${esc(committee)} can't cover this interview</b>${when ? ` · told us ${esc(when)}` : ""}.
      ${esc(a.secondPreferenceAvailabilityNote || "")} Assign someone else below.
    </div>`;
  }
  if (status === "Available") {
    return `<div class="note" style="margin-bottom:10px;">${esc(committee)} confirmed they can join this
      interview${when ? ` (${esc(when)})` : ""} — an assignment below is optional, only if you want a third
      opinion anyway.</div>`;
  }
  return `<div class="note" style="margin-bottom:10px;">${esc(committee)} has not said yet whether they can join
    this applicant's interview. If time is short, assign someone else directly.</div>`;
}

function renderDialog(a) {
  const rubric = getRubric(committeeIdOf(a), headIdOf(a));
  const scores = a.scores || [];

  const facts = [
    ["Email", a.email], ["Phone", a.phone], ["Major", a.major], ["Year", a.yearLevel],
    ["First preference", `${display(a.roleAppliedFor)} · ${a.headName || "—"}`],
    ["Second preference", display(a.secondPreference) || "—"],
    ["Second preference availability", a.secondPreference
      ? (String(a.secondPreferenceAvailability || "").trim() || "Awaiting reply")
      : ""],
    ["Interview", a.interviewSlot || "Not booked"],
    ["Interview status", a.interviewStatus || a.status],
    // Only for committees that collect work before the interview.
    ["Task", expectsTask(a) ? (submittedLink(a) ? "Submitted" : "Not submitted") : ""]

  const answers = (a.answers || []).map((qa) =>
    `<div class="q">${esc(qa.prompt)}</div><div class="a">${esc(qa.answer) || "—"}</div>`).join("");

  const scoreRows = scores.length ? scores.map((s) => {
    const breakdown = Object.entries(s.scores || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ");

      ${s.taskLink ? `<div class="brk">Task: <a href="${esc(s.taskLink)}" target="_blank" rel="noopener">${esc(s.taskLink)}</a></div>` : ""}
      ${s.notes ? `<div class="nt">${esc(s.notes)}</div>` : ""}

  const panelOptions = (state.data.panel || [])
    .map((p) => `<option value="${esc(p.email)}">${esc(p.name)} — ${esc(display(p.department))} ${esc(p.positionType)}</option>`)
    .join("");

  /* Scoring from here, so whoever actually sat in on the interview can record
     it without being on that committee — including the second-preference half,
     which is exactly the case no committee portal covers. */
  const prefs = preferencesOf(a);
  const prefOptions = prefs
    .map((p, i) => `<option value="${esc(p.key)}"${i === 0 ? " selected" : ""}>${esc(p.label)}</option>`)
    .join("");

  // Prefill the reschedule form from the booked slot: "2026-08-12 at 4:00 PM".
  const slotMatch = String(a.interviewSlot || "").match(/^(\d{4}-\d{2}-\d{2})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  let dateVal = "", timeVal = "";
  if (slotMatch) {
    dateVal = slotMatch[1];
    let hour = Number(slotMatch[2]);
    const meridiem = (slotMatch[4] || "").toUpperCase();
    if (meridiem === "PM" && hour !== 12) hour += 12;
    if (meridiem === "AM" && hour === 12) hour = 0;
    timeVal = `${String(hour).padStart(2, "0")}:${slotMatch[3]}`;

  document.getElementById("dlg-body").innerHTML = `

    <div class="facts">${facts.map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join("")}</div>

        ${a.interviewSlot

          <div><label for="swap-time">Start</label><input type="time" id="swap-time"></div>

/* ── scoring from the admin side ────────────────────────────────────────── */

/**
 * Renders the rubric for whichever preference is selected, prefilled with this
 * admin's own previous score for it. A committee with no rubric in its brief
 * still gets the notes box — notes are the record in that case.
 */
function renderScoreForm(a, pref) {
  const rubric = getRubric(pref.committeeId, pref.headId);
  const mine = myScoreFor(a, pref.committee);
  const box = document.getElementById("score-form");

  const criteria = rubric
    ? rubric.criteria.map((c) => {
        const id = `sc-${c.name.replace(/\W+/g, "-")}`;
        const value = mine?.scores?.[c.name];
        return `<div class="row2" style="margin-bottom:8px;">
          <div><label for="${id}">${esc(c.name)} <span class="note">out of ${c.weight}</span></label>
            <input type="number" id="${id}" data-criterion="${esc(c.name)}" min="0" max="${c.weight}" step="1"
                   value="${value === undefined || value === null ? "" : esc(value)}" placeholder="0–${c.weight}"></div>
        </div>`;
      }).join("")
    : `<div class="note" style="margin-bottom:8px;">${esc(display(pref.committee))} has no rubric in its brief,
        so record what you saw in the notes.</div>`;

  box.innerHTML = `${criteria}
    <div style="margin-top:10px;">
      <label for="score-notes">Notes</label>
      <textarea id="score-notes" rows="4"
        placeholder="What they actually said. Specifics beat impressions.">${esc(mine?.notes || "")}</textarea>
    </div>
    <div style="margin-top:10px;">
      <label for="score-task">Task link (optional)</label>
      <input type="url" id="score-task" placeholder="https://…" value="${esc(mine?.taskLink || submittedLink(a))}">
    </div>
    <div class="row2" style="margin-top:12px;">
      <div style="flex:0 0 auto;"><button class="btn btn-sm" id="score-save">Save my score</button></div>
      <div class="note" style="align-self:center;">${mine
        ? "Last saved " + esc(String(mine.updatedAt).slice(0, 16).replace("T", " "))
        : "Not scored by you yet"}</div>
    </div>`;

  updateScoreTotal(pref);
  box.querySelectorAll("input[data-criterion]").forEach((input) => {
    input.addEventListener("input", () => updateScoreTotal(pref));
  });
  document.getElementById("score-save").onclick = () => saveScore(a, pref);
}

const readScores = () => {
  const scores = {};
  document.querySelectorAll("#score-form input[data-criterion]").forEach((input) => {
    const raw = input.value.trim();
    if (raw !== "") scores[input.dataset.criterion] = Number(raw);
  });
  return scores;
};

function updateScoreTotal(pref) {
  const rubric = getRubric(pref.committeeId, pref.headId);
  const total = totalScore(rubric, readScores());
  document.getElementById("score-total").textContent =
    total === null ? (rubric ? "Fill every criterion for a total" : "Notes only") : `${total}/100`;
}

function wireScoring(a, prefs) {
  const select = document.getElementById("score-pref");
  if (!select) return;
  const current = () => prefs.find((p) => p.key === select.value) ?? prefs[0];
  renderScoreForm(a, current());
  select.onchange = () => renderScoreForm(a, current());
}

async function saveScore(a, pref) {
  const msg = document.getElementById("score-msg");
  const btn = document.getElementById("score-save");
  const rubric = getRubric(pref.committeeId, pref.headId);
  const scores = readScores();
  const total = totalScore(rubric, scores);
  const notes = document.getElementById("score-notes").value.trim();

  if (rubric && total === null && !notes) {
    msg.className = "msg bad";
    msg.textContent = "Score every criterion, or leave a note saying why you could not.";
    return;
  }

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  try {
    await api({
      mode: "heads-save-score",
      email: state.admin.email,
      applicantEmail: a.email,
      committee: pref.committee,
      headRole: pref.headRole,
      preference: pref.preference,
      scores,
      total: total === null ? "" : total,
      notes,
      taskLink: document.getElementById("score-task").value.trim()
    });
    msg.className = "msg ok"; msg.textContent = "Saved.";
    await load(state.admin.email, true);
  } catch (err) {
    msg.className = "msg bad"; msg.textContent = err.message;
  } finally { btn.disabled = false; }
}

/* ── team diagrams (admin approval) ────────────────────────────────────── */

/* Every committee recruiting this cycle: its raw sheet name (what the API
   expects as `committee`) paired with its role-guide id (what the head list
   is keyed by). */
const CYCLE_COMMITTEES = [
  { raw: "Tech Director", id: "tech-director" },
  { raw: "Operations", id: "operations" },
  { raw: "Branding / Media", id: "branding-media" },
  { raw: "HR", id: "hr" },
  { raw: "PR / Fundraising", id: "pr-fundraising" },
  { raw: "Visits", id: "visits" },
  { raw: "Children Day Director", id: "children-day-director" },
  { raw: "Initiatives Director", id: "initiatives-director" }
];

function teamApplicantsFor(rawCommittee) {
  const label = display(rawCommittee);
  return state.data.applicants.filter((a) => a.acceptedStatus && norm(a.acceptedCommittee) === norm(label));
}

/* Drafted but stuck behind the applicant's own first-preference committee,
   who has not released them yet — mirrors the same rule the committee portal
   and the backend both enforce. */
function isHeldForFirstPreference(a, rawCommittee) {
  return a.acceptedStatus === "Draft" && normRole(a.roleAppliedFor) !== normRole(rawCommittee) && !a.firstPreferenceReleased;
}

/* Placed by a committee that is not this applicant's first preference, where
   that committee has not released them. The admin is the one who decides which
   committee needs them more, so this is flagged everywhere and left out of any
   bulk send until they say otherwise. */
function isContested(a, rawCommittee) {
  return Boolean(a.acceptedStatus) && normRole(a.roleAppliedFor) !== normRole(rawCommittee) && !a.firstPreferenceReleased;
}

/* Role names already carry their own title — "Head of Graphic Design",
   "Discovery Head", "The Organizer" — so putting a position in front of them
   unchanged gives "Head of Head of Graphic Design". Strip the position word
   out of the name, then put it back once, in front. Mirrors roleTitle in the
   edge function so the portals and the email never disagree. */
function roleTitle(position, headName) {
  const name = String(headName ?? "").trim();
  if (!name) return String(position ?? "");
  const core = name.replace(/^(?:co-)?heads?\s+of\s+/i, "").replace(/\s+heads?$/i, "").trim() || name;
  if (/^the\s+/i.test(core)) return `${position} — ${core}`;
  return `${position} of ${core}`;
}

function adminChip(a, rawCommittee) {
  const pending = isHeldForFirstPreference(a, rawCommittee);
  const contested = isContested(a, rawCommittee);
  const label = a.acceptedStatus === "Yes" ? "Sent" : a.acceptedStatus === "Submitted" ? "Submitted" : pending ? "Pending" : "Draft";
  const cls = a.acceptedStatus === "Yes" ? "sent" : a.acceptedStatus === "Submitted" ? "submitted" : pending ? "pending" : "draft";
  const selectable = a.acceptedStatus === "Submitted";
  const sent = a.acceptedStatus === "Yes";
  return `<div class="slot-chip">
    ${selectable ? `<input type="checkbox" class="chip-check" data-select="${esc(a.email)}" data-select-committee="${esc(rawCommittee)}"${contested ? "" : " checked"} title="${contested ? "Their first preference is " + esc(display(a.roleAppliedFor)) + " — tick only if you are giving them to this committee" : "Include in the acceptance send"}">` : ""}
    <span class="chip-name" data-open="${esc(a.email)}" title="Open their application and scores">${esc(a.fullName)}</span>
    <span class="chip-status ${cls}">${label}</span>
    ${contested ? `<span class="chip-status pending" title="First preference: ${esc(display(a.roleAppliedFor))}">2nd · ${esc(display(a.roleAppliedFor))} first</span>` : ""}
    ${selectable ? `<button type="button" class="chip-x" data-reject="${esc(a.email)}" data-reject-committee="${esc(rawCommittee)}" title="Send back to the committee as a Draft">↺</button>` : ""}
    ${sent ? "" : `<button type="button" class="chip-x" data-unassign="${esc(a.email)}" title="Take them out of this role">×</button>`}
  </div>`;
}

/* Anyone not already placed on some committee's diagram. The admin can put any
   of them into any role — including a role, or a committee, they never applied
   to — which is the whole point of being able to fill a team from here rather
   than waiting on the committee to submit one. */
function unplacedApplicants() {
  return state.data.applicants
    .filter((a) => !a.acceptedStatus)
    .sort((x, y) => {
      const sx = panelAverage(x), sy = panelAverage(y);
      if (sx === null && sy === null) return String(x.fullName).localeCompare(String(y.fullName));
      if (sx === null) return 1;
      if (sy === null) return -1;
      return sy - sx;
    });
}

/* One picker per role: who to add, and as what. Candidates who applied to this
   very committee are floated to the top of the list, since they are usually
   the intended answer, but the rest stay reachable in the same control. */
function adminRolePicker(rawCommittee, head, headOpen, coHeadOpen, candidates) {
  if (!candidates.length) return `<div class="note">Nobody left unplaced to add.</div>`;
  const mine = candidates.filter((a) => normRole(a.roleAppliedFor) === normRole(rawCommittee));
  const others = candidates.filter((a) => normRole(a.roleAppliedFor) !== normRole(rawCommittee));
  const opt = (a) => {
    const score = panelAverage(a);
    return `<option value="${esc(a.email)}">${esc(a.fullName)}${score === null ? "" : ` · ${Math.round(score)}/100`} — ${esc(a.headName || display(a.roleAppliedFor))}</option>`;
  };
  const key = `${rawCommittee}|${head.id}`;
  return `
    <div class="add-row">
      <select data-add-email="${esc(key)}">
        <option value="" selected disabled>Add someone…</option>
        ${mine.length ? `<optgroup label="Applied to ${esc(display(rawCommittee))}">${mine.map(opt).join("")}</optgroup>` : ""}
        ${others.length ? `<optgroup label="Applied elsewhere">${others.map(opt).join("")}</optgroup>` : ""}
      </select>
      <select data-add-position="${esc(key)}">
        ${headOpen ? `<option value="Head">Head</option>` : ""}
        ${coHeadOpen ? `<option value="Co-Head">Co-Head</option>` : ""}
        <option value="Member"${headOpen ? "" : " selected"}>Member</option>
      </select>
      <button type="button" class="btn btn-sm btn-ghost" data-add-go="${esc(key)}">Add</button>
    </div>`;
}

function renderTeamCommittee(rawCommittee, guideId) {
  const heads = getRoleGuideById(guideId)?.heads ?? [];
  const applicants = teamApplicantsFor(rawCommittee);

  const submitted = applicants.filter((a) => a.acceptedStatus === "Submitted");
  const sent = applicants.filter((a) => a.acceptedStatus === "Yes");
  const pending = applicants.filter((a) => isHeldForFirstPreference(a, rawCommittee));

  const candidates = unplacedApplicants();

  const boxes = heads.map((h) => {
    const inRole = applicants.filter((a) => norm(a.acceptedRole) === norm(h.name));
    const headHolders = inRole.filter((a) => a.acceptedPosition === "Head");
    const coHeadHolders = inRole.filter((a) => a.acceptedPosition === "Co-Head");
    const members = inRole.filter((a) => a.acceptedPosition === "Member");
    return `<div class="role-box ${headHolders.length ? "" : "missing"}">
      <div class="role-box-title">${esc(h.name)}</div>
      <div class="slot-group"><div class="slot-label">Head</div>
        ${headHolders.length ? headHolders.map((a) => adminChip(a, rawCommittee)).join("") : `<div class="note">No head assigned yet.</div>`}</div>
      <div class="slot-group"><div class="slot-label">Co-Head</div>
        ${coHeadHolders.length ? coHeadHolders.map((a) => adminChip(a, rawCommittee)).join("") : `<div class="note">None yet.</div>`}</div>
      <div class="slot-group"><div class="slot-label">Members</div>
        ${members.length ? members.map((a) => adminChip(a, rawCommittee)).join("") : `<div class="note">None yet.</div>`}</div>
      <div class="slot-group">
        ${adminRolePicker(rawCommittee, h, headHolders.length === 0, coHeadHolders.length === 0, candidates)}
      </div>
    </div>`;
  }).join("");

  const missing = heads
    .filter((h) => !applicants.some((a) => norm(a.acceptedRole) === norm(h.name) && a.acceptedPosition === "Head"))
    .map((h) => h.name);

  return { raw: rawCommittee, label: display(rawCommittee), boxes, missing, submittedCount: submitted.length, sentCount: sent.length, pendingCount: pending.length };
}

function renderTeams() {
  const el = document.getElementById("view-teams");
  if (!state.data) return;

  const results = CYCLE_COMMITTEES.map((c) => renderTeamCommittee(c.raw, c.id));
  const totalSubmitted = results.reduce((n, r) => n + r.submittedCount, 0);
  const totalMissing = results.reduce((n, r) => n + r.missing.length, 0);
  const stillMissing = results.filter((r) => r.missing.length);

  const summary = `
    <div class="team-summary">
      <span class="count"><b>${totalSubmitted}</b> submitted, awaiting your approval</span>
      <span class="count"><b>${totalMissing}</b> head roles still unfilled, across ${stillMissing.length} committee${stillMissing.length === 1 ? "" : "s"}</span>
    </div>
    ${stillMissing.length ? `
      <div class="missing-summary">
        <div class="missing-summary-title">Still missing a Head — extend the deadline for these roles only, approving is not blocked by them</div>
        <div class="missing-grid">
          ${stillMissing.map((r) => `
            <div class="missing-name">${esc(r.label)}</div>
            <div class="missing-roles">${r.missing.map((m) => `<span class="role-chip">${esc(m)}</span>`).join("")}</div>
          `).join("")}
        </div>
      </div>` : ""}
    ${state.teamMsg ? `<div class="msg ${state.teamMsg.type}" style="margin:-6px 0 20px;">${esc(state.teamMsg.text)}</div>` : ""}`;

  const sections = results.map((r) => `
    <section class="committee" data-committee="${esc(r.raw)}">
      <h2>${esc(r.label)}
        <span class="c">${r.sentCount} sent · ${r.submittedCount} awaiting approval${r.pendingCount ? ` · ${r.pendingCount} pending first preference` : ""}</span>
      </h2>
      ${r.missing.length ? `<div class="note" style="margin-bottom:8px;">Still missing a Head for: ${r.missing.map(esc).join(", ")}.</div>` : ""}
      <div class="team-grid">${r.boxes}</div>
      <div class="row2" style="align-items:center;">
        <div class="note">${r.submittedCount ? "Uncheck anyone you don't want emailed yet — checked ones send." : "Nothing submitted yet."}</div>
        <div style="flex:0 0 auto;">
          <button class="btn btn-sm btn-gold" data-approve="${esc(r.raw)}"${r.submittedCount ? "" : " disabled"}>Send selected acceptance emails</button>
        </div>
      </div>
    </section>`).join("");

  el.innerHTML = `${summary}${sections}`;
}

async function approveTeam(rawCommittee, btn) {
  const label = display(rawCommittee);
  const section = btn.closest("section[data-committee]");
  const checked = [...section.querySelectorAll(`[data-select-committee="${CSS.escape(rawCommittee)}"]:checked`)]
    .map((c) => c.dataset.select);
  if (!checked.length) return;

  if (!(await confirmDialog(`Approve and send acceptance emails for ${checked.length} applicant(s) in ${label}?\n\nThis emails them immediately, cc the committee and HR.`))) return;

  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await api({ mode: "heads-admin-confirm-team", email: state.admin.email, committee: rawCommittee, applicantEmails: checked });
    state.teamMsg = {
      type: "ok",
      text: `${label}: sent ${r.sent.length}.${r.missingHeadRoles.length ? ` Still no Head for: ${r.missingHeadRoles.join(", ")}.` : ""}`
    };
    await load(state.admin.email);
    renderTeams();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    renderTeams();
  }
}

async function adminAddToRole(key, rerender = renderTeams, scope = document) {
  const [rawCommittee, headId] = key.split("|");
  /* Scoped to the tab the button was clicked in: the team-diagram and
     hierarchy views render the same role keys, and once both have been opened
     they are both in the DOM — an unscoped lookup would happily read the
     hidden tab's dropdown and add whoever happened to be selected there. */
  const email = scope.querySelector(`[data-add-email="${CSS.escape(key)}"]`)?.value;
  const position = scope.querySelector(`[data-add-position="${CSS.escape(key)}"]`)?.value;
  if (!email || !position) return;
  const who = state.data.applicants.find((a) => norm(a.email) === norm(email));

  state.teamMsg = null;
  try {
    const r = await api({
      mode: "heads-admin-assign-applicant",
      email: state.admin.email,
      applicantEmail: email,
      committee: rawCommittee,
      headId,
      position
    });
    state.teamMsg = { type: "ok", text: `${who?.fullName || email} added as ${roleTitle(r.position, r.headName)}. Tick them below and send when ready.` };
    await load(state.admin.email);
    rerender();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    rerender();
  }
}

/* Re-places someone stranded by a cancelled role. Same endpoint as a normal
   placement — the applicant is fixed here and the role is what varies, which is
   the opposite of adminAddToRole. */
async function adminMoveStranded(key, rerender = renderHierarchy, scope = document) {
  const sep = key.indexOf("|");
  const rawCommittee = key.slice(0, sep);
  const applicantEmail = key.slice(sep + 1);
  const headId = scope.querySelector(`[data-move-head="${CSS.escape(key)}"]`)?.value;
  const position = scope.querySelector(`[data-move-position="${CSS.escape(key)}"]`)?.value;
  if (!headId || !position) return;
  const who = state.data.applicants.find((a) => norm(a.email) === norm(applicantEmail));

  state.teamMsg = null;
  try {
    const r = await api({
      mode: "heads-admin-assign-applicant",
      email: state.admin.email,
      applicantEmail,
      committee: rawCommittee,
      headId,
      position
    });
    state.teamMsg = { type: "ok", text: `${who?.fullName || applicantEmail} moved to ${roleTitle(r.position, r.headName)}.` };
    await load(state.admin.email);
    rerender();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    rerender();
  }
}

async function adminRemoveFromRole(email, rerender = renderTeams) {
  const who = state.data.applicants.find((a) => norm(a.email) === norm(email));
  if (!(await confirmDialog(`Take ${who?.fullName || "this applicant"} out of their role?\n\nNothing has been emailed to them yet, and they go back to the unplaced list.`))) return;

  state.teamMsg = null;
  try {
    await api({ mode: "heads-admin-unassign-applicant", email: state.admin.email, applicantEmail: email });
    state.teamMsg = { type: "ok", text: `${who?.fullName || "Applicant"} removed.` };
    await load(state.admin.email);
    rerender();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    rerender();
  }
}

/* ── hierarchy: build every committee's roles, then send once ─────────────
   The Team diagrams tab answers "what did this committee submit, and do I
   approve it". This one answers the other question — "is the whole board
   filled yet" — so it runs across all eight committees at once and ends in a
   single send rather than one approve per committee. */

function hierarchyRows() {
  return CYCLE_COMMITTEES.map((c) => {
    /* Current roles plus the ones the cycle stopped recruiting for. The board
       still has to be describable — someone can hold a position that is no
       longer advertised — and this tab is the only place that is offered. */
    const heads = getAllHeadsForHierarchy(c.id);
    const placed = teamApplicantsFor(c.raw);
    /* A role that was cancelled outright leaves its placements behind. They
       match no role box and are not unplaced, so without this they would render
       nowhere — invisible and impossible to move. */
    const stranded = placed.filter((a) => !heads.some((h) => norm(h.name) === norm(a.acceptedRole)));
    const roles = heads.map((h) => {
      const inRole = placed.filter((a) => norm(a.acceptedRole) === norm(h.name));
      return {
        head: h,
        headHolders: inRole.filter((a) => a.acceptedPosition === "Head"),
        coHeads: inRole.filter((a) => a.acceptedPosition === "Co-Head"),
        members: inRole.filter((a) => a.acceptedPosition === "Member")
      };
    });
    return {
      raw: c.raw,
      label: display(c.raw),
      roles,
      stranded,
      staged: placed.filter((a) => a.acceptedStatus === "Submitted"),
      sent: placed.filter((a) => a.acceptedStatus === "Yes"),
      /* Drafts are the committee's working state — only they can turn those
         into Submitted. Held ones are waiting on a different committee to
         release the applicant. Neither is sendable, and the send button used
         to just sit disabled without saying which of the two it was. */
      drafts: placed.filter((a) => a.acceptedStatus === "Draft" && !isHeldForFirstPreference(a, c.raw)),
      held: placed.filter((a) => a.acceptedStatus === "Draft" && isHeldForFirstPreference(a, c.raw))
    };
  });
}

/* Someone left behind by a role that was cancelled after they were placed
   into it. Offered a picker over the roles that still exist, so they can be
   moved somewhere real instead of sitting invisible. */
function strandedAdminCard(a, rawCommittee, heads) {
  const key = `${rawCommittee}|${a.email}`;
  return `
    <div class="role-box missing">
      <div class="role-box-title">${esc(a.fullName)}</div>
      <div class="note" style="margin-bottom:9px;">Was ${esc(roleTitle(a.acceptedPosition || "placed", a.acceptedRole))}, which no longer exists.</div>
      <div class="add-row">
        <select data-move-head="${esc(key)}">
          <option value="" selected disabled>Move to…</option>
          ${heads.map((h) => `<option value="${esc(h.id)}">${esc(h.name)}${h.retired ? " (closed)" : ""}</option>`).join("")}
        </select>
        <select data-move-position="${esc(key)}">
          <option value="Head">Head</option>
          <option value="Co-Head">Co-Head</option>
          <option value="Member" selected>Member</option>
        </select>
        <button type="button" class="btn btn-sm btn-ghost" data-move-go="${esc(key)}">Move</button>
        <button type="button" class="btn btn-sm btn-ghost" data-unassign="${esc(a.email)}">Remove</button>
      </div>
    </div>`;
}

/* Why the send button for a committee is or is not clickable. A disabled
   button with no reason was the whole problem: a committee could have five
   people sitting in Draft and the tab would only say "nothing staged". */
function sendStatus(r) {
  const bits = [];
  if (r.staged.length) bits.push(`${r.staged.length} ready to be emailed`);
  if (r.drafts.length) bits.push(`${r.drafts.length} still Draft — ${esc(r.label)} has not submitted ${r.drafts.length === 1 ? "them" : "these"} yet`);
  if (r.held.length) bits.push(`${r.held.length} waiting on another committee to release them`);
  if (r.sent.length) bits.push(`${r.sent.length} already sent`);
  if (!bits.length) return `Nobody placed in ${esc(r.label)} yet.`;
  const tail = !r.staged.length && r.drafts.length
    ? " You can place them here yourself to send without waiting."
    : "";
  return bits.join(" · ") + "." + tail;
}

/* Applicants more than one committee has claimed and nobody has settled.
   These are the decisions only the admin can make, so they sit at the top of
   the tab rather than being buried inside whichever committee happens to be
   listed first. */
function contestedApplicants() {
  const live = (state.data.claims ?? []).filter((c) => ["Draft", "Submitted"].includes(c.status));
  const byApplicant = new Map();
  for (const c of live) {
    const key = norm(c.applicantEmail);
    if (!byApplicant.has(key)) byApplicant.set(key, []);
    byApplicant.get(key).push(c);
  }
  return [...byApplicant.values()]
    .filter((claims) => claims.length > 1)
    .map((claims) => {
      const a = state.data.applicants.find((x) => norm(x.email) === norm(claims[0].applicantEmail));
      return { applicant: a, email: claims[0].applicantEmail, name: claims[0].applicantName, claims };
    });
}

function renderContestedBlock() {
  const rows = contestedApplicants();
  if (!rows.length) return "";
  return `
    <div class="missing-summary">
      <div class="missing-summary-title">${rows.length} applicant${rows.length === 1 ? "" : "s"} wanted by more than one committee — your call</div>
      ${rows.map((r) => {
        const first = r.applicant ? display(r.applicant.roleAppliedFor) : "";
        return `
        <div class="contested-row">
          <div class="contested-who">
            <span class="chip-name" data-open="${esc(r.email)}">${esc(r.name || r.email)}</span>
            ${first ? `<span class="note">first preference: ${esc(first)}</span>` : ""}
          </div>
          <div class="contested-opts">
            ${r.claims.map((c) => `
              <button type="button" class="btn btn-sm ${first && norm(c.committee) === norm(first) ? "btn-gold" : "btn-ghost"}"
                data-approve-claim="${esc(r.email)}" data-approve-committee="${esc(c.committee)}"
                title="Give them to ${esc(c.committee)} and decline the others">
                ${esc(c.committee)} · ${esc(roleTitle(c.position, c.headRole))}${first && norm(c.committee) === norm(first) ? " (1st)" : ""}
              </button>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

function renderHierarchy() {
  const el = document.getElementById("view-hierarchy");
  if (!state.data) return;

  const rows = hierarchyRows();
  const candidates = unplacedApplicants();

  /* Retired roles are placeable but not expected to be filled, so they stay
     out of the progress count and out of the missing list — otherwise "am I
     done" could never reach complete. */
  const allRoles = rows.flatMap((r) => r.roles).filter((x) => !x.head.retired);
  const filled = allRoles.filter((r) => r.headHolders.length).length;
  const missing = rows
    .map((r) => ({ label: r.label, roles: r.roles.filter((x) => !x.head.retired && !x.headHolders.length).map((x) => x.head.name) }))
    .filter((r) => r.roles.length);
  const staged = rows.reduce((n, r) => n + r.staged.length, 0);
  const sent = rows.reduce((n, r) => n + r.sent.length, 0);

  const sections = rows.map((r) => `
    <section class="committee">
      <h2>${esc(r.label)}
        <span class="c">${r.roles.filter((x) => !x.head.retired && x.headHolders.length).length}/${r.roles.filter((x) => !x.head.retired).length} roles have a Head${r.staged.length ? ` · ${r.staged.length} ready to send` : ""}${r.sent.length ? ` · ${r.sent.length} sent` : ""}</span>
      </h2>
      ${r.stranded.length ? `
        <div class="note" style="margin-bottom:8px;color:var(--warn);font-weight:700;">${r.stranded.length} placed in a role that no longer exists</div>
        <div class="team-grid">${r.stranded.map((a) => strandedAdminCard(a, r.raw, r.roles.map((x) => x.head))).join("")}</div>` : ""}
      <div class="row2" style="align-items:center;margin-bottom:10px;">
        <div class="note">${sendStatus(r)}</div>
        <div style="flex:0 0 auto;">
          <button class="btn btn-sm btn-gold" data-send-committee="${esc(r.raw)}"${r.staged.length ? "" : " disabled"}>Review ${esc(r.label)} drafts${r.staged.length ? ` (${r.staged.length})` : ""}</button>
        </div>
      </div>
      <div class="team-grid">
        ${r.roles.map((x) => `
          <div class="role-box ${x.headHolders.length || x.head.retired ? "" : "missing"}">
            <div class="role-box-title">${esc(x.head.name)}${x.head.retired ? `<span class="retired-tag" title="No longer recruited for — placeable here only">closed</span>` : ""}</div>
            <div class="slot-group"><div class="slot-label">Head</div>
              ${x.headHolders.length ? x.headHolders.map((a) => adminChip(a, r.raw)).join("") : `<div class="note">Not chosen yet.</div>`}</div>
            ${x.coHeads.length ? `<div class="slot-group"><div class="slot-label">Co-Head</div>${x.coHeads.map((a) => adminChip(a, r.raw)).join("")}</div>` : ""}
            ${x.members.length ? `<div class="slot-group"><div class="slot-label">Members</div>${x.members.map((a) => adminChip(a, r.raw)).join("")}</div>` : ""}
            ${(() => {
              const wl = (state.data.waitlist ?? []).filter((w) => norm(w.headRole) === norm(x.head.name)).sort((p, q) => p.rank - q.rank);
              return wl.length
                ? `<div class="slot-group"><div class="slot-label">Backups</div>${wl.map((w, i) => `<div class="slot-chip"><span class="wl-rank">${i + 1}</span><span class="chip-name" data-open="${esc(w.applicantEmail)}">${esc(w.applicantName || w.applicantEmail)}</span></div>`).join("")}</div>`
                : "";
            })()}
            <div class="slot-group">
              ${adminRolePicker(r.raw, x.head, x.headHolders.length === 0, x.coHeads.length === 0, candidates)}
            </div>
          </div>`).join("")}
      </div>
    </section>`).join("");

  el.innerHTML = `
    <div class="team-summary">
      <span class="count"><b>${filled}</b> of <b>${allRoles.length}</b> roles have a Head</span>
      <span class="count"><b>${staged}</b> ready to be emailed</span>
      <span class="count"><b>${sent}</b> already sent</span>
      <div class="go">
        <button class="btn btn-gold" id="send-all"${staged ? "" : " disabled"}>Send all acceptance emails${staged ? ` (${staged})` : ""}</button>
      </div>
      <div class="note" style="flex:1 1 100%;margin-top:2px;">Reviewing one committee's drafts first is safer — the all-at-once button sends without showing you the messages.</div>
    </div>
    ${renderContestedBlock()}
    ${missing.length ? `
      <div class="missing-summary">
        <div class="missing-summary-title">Still without a Head — you can still send, these just stay open</div>
        <div class="missing-grid">
          ${missing.map((m) => `
            <div class="missing-name">${esc(m.label)}</div>
            <div class="missing-roles">${m.roles.map((n) => `<span class="role-chip">${esc(n)}</span>`).join("")}</div>
          `).join("")}
        </div>
      </div>` : ""}
    ${state.teamMsg ? `<div class="msg ${state.teamMsg.type}" style="margin:-6px 0 20px;">${esc(state.teamMsg.text)}</div>` : ""}
    ${sections}`;
}

/* Awarding a contested applicant to one committee. The rival claims are
   declined in the same call, so the losing committee's diagram stops showing
   them as theirs rather than silently keeping a claim that cannot win. */
async function approveClaim(applicantEmail, committee, btn) {
  const who = state.data.applicants.find((a) => norm(a.email) === norm(applicantEmail));
  if (!(await confirmDialog(
    `Give ${who?.fullName || applicantEmail} to ${committee}?\n\nEvery other committee's claim on them is declined. Nothing is emailed yet — they still have to be sent from this tab.`
  ))) return;

  btn.disabled = true;
  try {
    const r = await api({ mode: "heads-admin-approve-claim", email: state.admin.email, applicantEmail, committee });
    state.teamMsg = {
      type: "ok",
      text: `${who?.fullName || applicantEmail} goes to ${r.committee} as ${roleTitle(r.position, r.headName)}.${r.declined.length ? ` Declined: ${r.declined.join(", ")}.` : ""}`
    };
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
  }
  await load(state.admin.email);
  renderHierarchy();
}

/* The send button opens the drafts rather than firing. Every message is
   rendered by the same builder the send uses, with the same cc, so what is on
   screen is what leaves — and the actual send is a second, deliberate click. */
async function openAcceptanceDrafts(rawCommittee, btn) {
  const label = display(rawCommittee);
  btn.disabled = true; btn.textContent = "Loading…";
  let res;
  try {
    res = await api({ mode: "heads-admin-preview-acceptance", email: state.admin.email, committee: rawCommittee });
  } catch (err) {
    state.teamMsg = { type: "bad", text: `${label}: ${err.message}` };
    renderHierarchy();
    return;
  }
  btn.disabled = false;

  if (!res.messages.length) {
    state.teamMsg = {
      type: "bad",
      text: res.skippedContested.length
        ? `${label}: everyone staged put another committee first. Settle that above, or tick them individually in Team diagrams.`
        : `${label}: nothing ready to send.`
    };
    renderHierarchy();
    return;
  }

  state.drafts = { committee: rawCommittee, label, ...res, index: 0 };
  renderDrafts();
}

function renderDrafts() {
  const d = state.drafts;
  const m = d.messages[d.index];
  document.getElementById("dlg-body").innerHTML = `
    <button class="close" id="dlg-close" aria-label="Close">×</button>
    <h2>Draft ${d.index + 1} of ${d.messages.length}</h2>
    <div class="sub">${esc(d.label)} · nothing has been sent yet</div>

    <div class="facts">
      <div><b>To</b>${esc(m.to)}</div>
      <div><b>Cc</b>${esc(m.cc || "— nobody on file")}</div>
      <div><b>Subject</b>${esc(m.subject)}</div>
    </div>
    ${d.skippedContested.length ? `<div class="note" style="margin-bottom:10px;color:var(--warn);">
      Held back — another committee is their first preference: ${esc(d.skippedContested.map((x) => `${x.fullName} (${x.firstPreferenceCommittee})`).join(", "))}</div>` : ""}

    <iframe id="draft-frame" title="Acceptance email preview"
      style="width:100%;height:min(58vh,620px);border:1px solid var(--line);border-radius:10px;background:#fff;"></iframe>

    <div class="row2" style="align-items:center;margin-top:14px;">
      <div style="flex:0 0 auto;display:flex;gap:6px;">
        <button class="btn btn-sm btn-ghost" id="draft-prev"${d.index === 0 ? " disabled" : ""}>‹ Previous</button>
        <button class="btn btn-sm btn-ghost" id="draft-next"${d.index >= d.messages.length - 1 ? " disabled" : ""}>Next ›</button>
      </div>
      <div class="note">Reading ${d.index + 1} of ${d.messages.length}. Sending goes to all ${d.messages.length}.</div>
      <div style="flex:0 0 auto;">
        <button class="btn btn-gold" id="draft-send">Send all ${d.messages.length} now</button>
      </div>
    </div>
    <div class="msg" id="draft-msg"></div>`;

  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();
  // srcdoc keeps the preview sandboxed from the portal's own styles.
  document.getElementById("draft-frame").srcdoc = m.html;
  document.getElementById("dlg-close").onclick = () => dlg.close();
  document.getElementById("draft-prev").onclick = () => { d.index -= 1; renderDrafts(); };
  document.getElementById("draft-next").onclick = () => { d.index += 1; renderDrafts(); };
  document.getElementById("draft-send").onclick = (e) => sendDrafts(e.currentTarget);
}

async function sendDrafts(btn) {
  const d = state.drafts;
  const msg = document.getElementById("draft-msg");
  if (!(await confirmDialog(
    `Send ${d.messages.length} acceptance ${d.messages.length === 1 ? "email" : "emails"} for ${d.label}?\n\n` +
    d.messages.map((m) => `${m.fullName} — ${m.to}`).join("\n") +
    `\n\nThis cannot be undone.`
  ))) return;

  btn.disabled = true; btn.textContent = "Sending…";
  msg.className = "msg"; msg.textContent = "Sending…";
  try {
    const r = await api({ mode: "heads-admin-confirm-team", email: state.admin.email, committee: d.committee });
    state.teamMsg = { type: "ok", text: `${d.label}: sent ${r.sent.length}.` };
    document.getElementById("dlg").close();
  } catch (err) {
    state.teamMsg = { type: "bad", text: `${d.label}: ${err.message}` };
    msg.className = "msg bad"; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = `Send all ${d.messages.length} now`;
    return;
  }
  await load(state.admin.email);
  renderHierarchy();
}


/* One send for the whole board. Runs committee by committee because that is
   what the endpoint is scoped to, and reports per committee so a failure
   part-way through says exactly who did and did not get an email. */
async function sendAllAcceptances(btn) {
  const rows = hierarchyRows().filter((r) => r.staged.length);
  if (!rows.length) return;

  const total = rows.reduce((n, r) => n + r.staged.length, 0);
  const roster = rows
    .map((r) => `${r.label}: ${r.staged.map((a) => a.fullName).join(", ")}`)
    .join("\n");
  if (!(await confirmDialog(
    `Send the acceptance email to ${total} ${total === 1 ? "person" : "people"} across ${rows.length} committee${rows.length === 1 ? "" : "s"}?\n\n${roster}\n\nThis emails them immediately, cc the committee and HR. It cannot be undone.`
  ))) return;

  btn.disabled = true;
  const done = [];
  const failed = [];
  for (const [i, r] of rows.entries()) {
    btn.textContent = `Sending ${i + 1} of ${rows.length}…`;
    try {
      const res = await api({ mode: "heads-admin-confirm-team", email: state.admin.email, committee: r.raw });
      done.push(`${r.label} (${res.sent.length})`);
    } catch (err) {
      failed.push(`${r.label}: ${err.message}`);
    }
  }

  state.teamMsg = failed.length
    ? { type: "bad", text: `Sent for ${done.join(", ") || "nobody"}. Failed — ${failed.join(" · ")}` }
    : { type: "ok", text: `Acceptance emails sent: ${done.join(", ")}.` };

  await load(state.admin.email);
  renderHierarchy();
}

async function rejectSubmission(email, rawCommittee, rerender = renderTeams) {
  const a = state.data.applicants.find((x) => norm(x.email) === norm(email));
  const label = display(rawCommittee);
  if (!(await confirmDialog(`Reject ${a?.fullName || "this applicant"}'s submission for ${label}?\n\nSends it back to Draft on the committee's own diagram — nobody is emailed, and they can revise and resubmit it.`))) return;

  try {
    await api({ mode: "heads-admin-reject-applicant", email: state.admin.email, applicantEmail: email, committee: rawCommittee });
    state.teamMsg = { type: "ok", text: `${a?.fullName || "Applicant"}: sent back to Draft for ${label} to revise.` };
    await load(state.admin.email);
    rerender();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    rerender();
  }
}

/* ── onboarding checklist status ───────────────────────────────────────── */

function onboardingStatusBadge(a) {
  if (a.roleConfirmed && a.videoNotes) return `<span class="pill done">Complete</span>`;
  if (a.roleConfirmed || a.videoNotes) return `<span class="pill part">Partial</span>`;
  return `<span class="pill bad">Not started</span>`;
}

function renderOnboarding() {
  const el = document.getElementById("view-onboarding");
  if (!state.data) return;

  const accepted = state.data.applicants
    .filter((a) => a.accepted)
    .sort((a, b) => String(a.acceptedCommittee).localeCompare(String(b.acceptedCommittee)) || String(a.fullName).localeCompare(String(b.fullName)));

  const complete = accepted.filter((a) => a.roleConfirmed && a.videoNotes).length;
  const notStarted = accepted.filter((a) => !a.roleConfirmed && !a.videoNotes).length;

  const summary = `
    <div class="team-summary">
      <span class="count"><b>${accepted.length}</b> accepted</span>
      <span class="count"><b>${complete}</b> completed the checklist</span>
      <span class="count"><b>${notStarted}</b> haven't started</span>
    </div>`;

  if (!accepted.length) {
    el.innerHTML = `${summary}<div class="empty">Nobody has been accepted yet — nothing to onboard.</div>`;
    return;
  }

  const rows = accepted.map((a) => `
    <tr>
      <td><b>${esc(a.fullName)}</b><div class="note">${esc(a.email)}</div></td>
      <td>${esc(a.acceptedCommittee)}<div class="note">${esc(roleTitle(a.acceptedPosition, a.acceptedRole))}</div></td>
      <td>${yesNoBadge(a.roleConfirmed ? "Yes" : "")}</td>
      <td>${a.videoNotes
        ? `<span title="${esc(a.videoNotes)}">${esc(a.videoNotes.length > 90 ? a.videoNotes.slice(0, 90) + "…" : a.videoNotes)}</span>`
        : `<span class="note">Not submitted</span>`}</td>
      <td>${onboardingStatusBadge(a)}</td>
    </tr>`).join("");

  el.innerHTML = `${summary}
    <div class="wrap-x"><table>
      <thead><tr><th>Applicant</th><th>Role</th><th>Confirmed</th><th>Video notes</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ── slot coverage ──────────────────────────────────────────────────────── */

const SLOTS_EXTENSION_START = "2026-08-18";
const SLOTS_EXTENSION_END = "2026-08-23";
const SLOTS_EXTENSION_MIN_PER_DAY = 4;

async function loadSlotsCoverage() {
  const el = document.getElementById("view-slots");
  el.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await api({ mode: "heads-admin-list-slots", email: state.admin.email });
    renderSlotsCoverage(r.slots);
  } catch (err) {
    el.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;
  }
}

/**
 * One row per committee, one column per date that has any active slot —
 * the coverage check for "does every committee have at least
 * SLOTS_EXTENSION_MIN_PER_DAY a day" during the self-service extension
 * window, at a glance instead of clicking into eight separate portals.
 */
function renderSlotsCoverage(slots) {
  const el = document.getElementById("view-slots");
  const active = slots.filter((s) => s.active);
  const dates = [...new Set(active.map((s) => s.date))].filter(Boolean).sort();

  if (!dates.length) {
    el.innerHTML = `<div class="empty">No interview slots exist yet.</div>`;
    return;
  }

  const counts = new Map();
  for (const s of active) {
    const key = `${s.committee}|${s.date}`;
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }

  const rows = CYCLE_COMMITTEES.map((c) => {
    const label = display(c.raw);
    const cells = dates.map((date) => {
      const count = counts.get(`${label}|${date}`) ?? 0;
      const inWindow = date >= SLOTS_EXTENSION_START && date <= SLOTS_EXTENSION_END;
      const cls = !inWindow ? "" : count < SLOTS_EXTENSION_MIN_PER_DAY ? "cov-short" : "cov-ok";
      return `<td class="num ${cls}">${count || "—"}</td>`;
    }).join("");
    return `<tr><td><b>${esc(label)}</b></td>${cells}</tr>`;
  }).join("");

  el.innerHTML = `
    <h2 class="sec2">Slot coverage</h2>
    <div class="note" style="margin-bottom:14px;">
      One row per committee, one column per date with any active slot. Green is
      ${esc(SLOTS_EXTENSION_START)}–${esc(SLOTS_EXTENSION_END)} with at least ${SLOTS_EXTENSION_MIN_PER_DAY};
      red is inside that window but still short. Dates outside it are shown as a plain count.
    </div>
    <div class="wrap-x"><table>
      <thead><tr><th>Committee</th>${dates.map((d) => `<th>${esc(d.slice(5))}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ── actions ────────────────────────────────────────────────────────────── */

async function load(email, keepDialog) {
  const data = await api({ mode: "heads-admin-load", email });
  state.admin = data.admin;
  state.data = data;
  sessionStorage.setItem("recruitmentAdminEmail", data.admin.email);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("bar-sub").textContent = `${data.admin.name} · ${data.admin.email}`;
  renderStats(); renderFilters(); renderGroups(); renderTeams(); renderOnboarding();
  if (keepDialog && state.selected) {
    const a = state.data.applicants.find((x) => norm(x.email) === norm(state.selected));
    if (a) renderDialog(a);
  }
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.classList.add("hidden");
  if (!email) { err.textContent = "Enter your AUC email."; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try { await load(email); }
  catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  finally { btn.disabled = false; btn.textContent = "Enter"; }
});
document.getElementById("email").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("groups").addEventListener("click", (e) => {
  const row = e.target.closest("[data-email]");
  if (!row) return;
  state.selected = row.dataset.email;
  renderGroups();
  const a = state.data.applicants.find((x) => norm(x.email) === norm(state.selected));
  if (a) renderDialog(a);
});

for (const id of ["f-committee", "f-state"]) {
  document.getElementById(id).addEventListener("change", renderGroups);
}

document.getElementById("views").addEventListener("click", (e) => {
  const view = e.target.closest("[data-view]");
  if (!view) return;
  state.teamMsg = null;
  document.getElementById("view-applicants").classList.toggle("hidden", view.dataset.view !== "applicants");
  document.getElementById("view-teams").classList.toggle("hidden", view.dataset.view !== "teams");
  document.getElementById("view-hierarchy").classList.toggle("hidden", view.dataset.view !== "hierarchy");
  document.getElementById("view-onboarding").classList.toggle("hidden", view.dataset.view !== "onboarding");
  document.getElementById("view-slots").classList.toggle("hidden", view.dataset.view !== "slots");
  for (const btn of document.querySelectorAll("#views [data-view]")) {
    btn.setAttribute("aria-selected", btn.dataset.view === view.dataset.view);
  }
  if (view.dataset.view === "teams") renderTeams();
  if (view.dataset.view === "hierarchy") renderHierarchy();
  if (view.dataset.view === "onboarding") renderOnboarding();
  if (view.dataset.view === "slots") loadSlotsCoverage();
});

/* The hierarchy tab reuses the same add/remove controls as the team diagrams,
   so it shares their handlers and only adds its own single send. */
document.getElementById("view-hierarchy").addEventListener("click", (e) => {
  const openBtn = e.target.closest("[data-open]");
  if (openBtn) {
    const a = state.data.applicants.find((x) => norm(x.email) === norm(openBtn.dataset.open));
    if (a) { state.selected = a.email; renderDialog(a); }
    return;
  }
  const sendAll = e.target.closest("#send-all");
  if (sendAll) { sendAllAcceptances(sendAll); return; }
  const claimBtn = e.target.closest("[data-approve-claim]");
  if (claimBtn) { approveClaim(claimBtn.dataset.approveClaim, claimBtn.dataset.approveCommittee, claimBtn); return; }
  const sendOne = e.target.closest("[data-send-committee]");
  if (sendOne) { openAcceptanceDrafts(sendOne.dataset.sendCommittee, sendOne); return; }
  const moveBtn = e.target.closest("[data-move-go]");
  if (moveBtn) { adminMoveStranded(moveBtn.dataset.moveGo, renderHierarchy, e.currentTarget); return; }
  const addBtn = e.target.closest("[data-add-go]");
  if (addBtn) { adminAddToRole(addBtn.dataset.addGo, renderHierarchy, e.currentTarget); return; }
  const unassignBtn = e.target.closest("[data-unassign]");
  if (unassignBtn) { adminRemoveFromRole(unassignBtn.dataset.unassign, renderHierarchy); return; }
  const rejectBtn = e.target.closest("[data-reject]");
  if (rejectBtn) { rejectSubmission(rejectBtn.dataset.reject, rejectBtn.dataset.rejectCommittee, renderHierarchy); return; }
});

document.getElementById("view-teams").addEventListener("click", (e) => {
  const openBtn = e.target.closest("[data-open]");
  if (openBtn) {
    const a = state.data.applicants.find((x) => norm(x.email) === norm(openBtn.dataset.open));
    if (a) { state.selected = a.email; renderDialog(a); }
    return;
  }
  const approveBtn = e.target.closest("[data-approve]");
  if (approveBtn) { approveTeam(approveBtn.dataset.approve, approveBtn); return; }
  const rejectBtn = e.target.closest("[data-reject]");
  if (rejectBtn) { rejectSubmission(rejectBtn.dataset.reject, rejectBtn.dataset.rejectCommittee); return; }
  const addBtn = e.target.closest("[data-add-go]");
  if (addBtn) { adminAddToRole(addBtn.dataset.addGo, renderTeams, e.currentTarget); return; }
  const unassignBtn = e.target.closest("[data-unassign]");
  if (unassignBtn) { adminRemoveFromRole(unassignBtn.dataset.unassign); return; }
});

document.getElementById("refresh").addEventListener("click", () => load(state.admin.email));
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("recruitmentAdminEmail");
  location.reload();
});

const saved = sessionStorage.getItem("recruitmentAdminEmail");
if (saved) load(saved).catch(() => sessionStorage.removeItem("recruitmentAdminEmail"));
</script>
