<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Admin — Resala AUC</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0c2c80; --sky: #a7d4f2; --gold: #eac262;
    --ivory: #fdf9f3; --ink: #1b1f23;
    --line: #e4dccd; --muted: #6b7280; --soft: #f7f4ee;
    --good: #1a7f4b; --warn: #9a6b00; --bad: #a3231b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink);
         font: 15px/1.6 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  a { color: var(--blue); }

  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line);
                border-radius: 18px; padding: 34px 30px; text-align: center; }
  .login-card img { width: 68px; height: 68px; margin: 0 auto 16px; display: block; }
  .login-card h1 { margin: 0 0 6px; font-size: 21px; color: var(--blue); }
  .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase;
          letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
  input[type=email], input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--soft); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--sky); outline-offset: 1px; background: #fff; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 11px 17px; font-weight: 700; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-ghost { background: #fff; color: var(--blue); border: 1px solid var(--line); font-weight: 600; }
  .btn-sm { padding: 7px 12px; font-size: 13.5px; }
  .btn-block { width: 100%; margin-top: 18px; }
  .error { margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: #fdecec; color: #8c1c1c;
           font-size: 13px; text-align: left; }

  header.bar { background: var(--blue); color: #fff; padding: 14px 20px; display: flex;
               align-items: center; gap: 14px; flex-wrap: wrap; }
  header.bar img { width: 38px; height: 38px; }
  .bar-title { font-weight: 700; font-size: 17px; }
  .bar-sub { color: var(--sky); font-size: 12.5px; }
  .bar-spacer { flex: 1; }
  header.bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
                      border-radius: 8px; padding: 7px 13px; font-size: 13px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 70px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 18px; min-width: 130px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; }
  .filters > div { min-width: 180px; }

  .committee { margin-bottom: 26px; }
  .committee > h2 { font-size: 15px; color: var(--blue); margin: 0 0 10px;
                    display: flex; align-items: baseline; gap: 9px; }
  .committee > h2 .c { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { background: var(--soft); font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fcfaf6; }
  tbody tr[aria-current="true"] { background: #f2f6fd; }
  .num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
  .pill.done { background: #e8f6ee; color: var(--good); }
  .pill.open { background: var(--soft); color: var(--muted); }
  .pill.part { background: #fdf4e0; color: var(--warn); }
  .pill.bad { background: #fdecec; color: var(--bad); }
  .wrap-x { overflow-x: auto; }

  dialog { border: 0; border-radius: 16px; padding: 0; max-width: 760px; width: calc(100% - 32px);
           box-shadow: 0 24px 60px rgba(0,0,0,.24); }
  dialog::backdrop { background: rgba(12,26,50,.5); }
  .dlg { padding: 24px 26px 26px; }
  .dlg h2 { margin: 0 0 2px; font-size: 21px; color: var(--blue); }
  .dlg .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; margin-bottom: 16px; }
  .facts b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
             color: var(--muted); font-weight: 700; }
  h3.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
           margin: 20px 0 9px; padding-top: 14px; border-top: 1px solid var(--line); }
  .qa .q { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .qa .a { white-space: pre-wrap; color: #3f4650; margin-bottom: 13px; font-size: 14px; }
  .srow { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 9px; font-size: 13.5px; }
  .srow .who { font-weight: 700; }
  .srow .brk { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .srow .nt { white-space: pre-wrap; margin-top: 6px; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row2 > div { flex: 1 1 150px; }
  .note { font-size: 13px; color: var(--muted); }
  .msg { margin-top: 12px; font-size: 13.5px; }
  .msg.ok { color: var(--good); }
  .msg.bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 30px 4px; }
  .close { float: right; background: transparent; border: 0; font-size: 22px; color: var(--muted); line-height: 1; }

  /* ── team diagrams (admin approval) ───────────────────────────────────── */
  .views { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .team-summary { display: flex; gap: 10px 20px; flex-wrap: wrap; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px 18px; margin-bottom: 16px; }
  .team-summary .count { font-size: 13.5px; color: var(--muted); }
  .team-summary .count b { color: var(--ink); }
  .missing-summary { background: #fdf4e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; }
  .missing-summary-title { font-weight: 700; color: var(--warn); font-size: 13px; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 12px; }
  .missing-grid { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; align-items: start; }
  .missing-name { font-weight: 700; font-size: 13.5px; color: var(--ink); white-space: nowrap; padding-top: 3px; }
  .missing-roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-chip { background: #fff; border: 1px solid #e3b96a; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--ink); }
  @media (max-width: 640px) { .missing-grid { grid-template-columns: 1fr; } .missing-name { padding-top: 0; } }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin: 14px 0 16px; }
  .role-box { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; }
  .role-box.missing { border-color: #e3b96a; background: #fffaf0; }
  .role-box-title { font-weight: 700; margin-bottom: 9px; font-size: 14px; }
  .slot-group { margin-bottom: 9px; }
  .slot-group:last-child { margin-bottom: 0; }
  .slot-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .slot-chip { display: flex; align-items: center; gap: 7px; background: var(--soft); border-radius: 9px; padding: 6px 9px; margin-bottom: 6px; font-size: 13px; }
  .chip-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
  .chip-status.draft { background: #fdf4e0; color: var(--warn); }
  .chip-status.submitted { background: #e8effd; color: var(--blue); }
  .chip-status.sent { background: #e8f6ee; color: var(--good); }
  .chip-status.pending { background: #fdecec; color: var(--bad); }
  .chip-x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 14px; line-height: 1; padding: 2px 4px; flex: 0 0 auto; }
  .chip-x:hover { color: var(--bad); }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://upnmxdgqdkvgzfwqaicb.supabase.co/storage/v1/object/public/resala-logo/Resala%20Logo%20-%20source.png" alt="Resala AUC">
    <h1>Recruitment Admin</h1>
    <p>Heads cycle. Restricted to the people running this recruitment.</p>
    <label for="email">AUC email</label>
    <input type="email" id="email" placeholder="you@aucegypt.edu" autocomplete="email">
    <button class="btn btn-block" id="login-btn">Enter</button>
    <div class="error hidden" id="login-error"></div>
  </div>
</div>

<div class="hidden" id="app">
  <header class="bar">
    <img src="https://upnmxdgqdkvgzfwqaicb.supabase.co/storage/v1/object/public/resala-logo/Resala%20Logo%20-%20source.png" alt="">
    <div>
      <div class="bar-title">Recruitment Admin</div>
      <div class="bar-sub" id="bar-sub">—</div>
    </div>
    <div class="bar-spacer"></div>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="views" role="tablist" id="views">
      <button class="tab" data-view="applicants" aria-selected="true">Applicants</button>
      <button class="tab" data-view="teams">Team diagrams</button>
    </div>

    <div id="view-applicants">
      <div class="filters">
        <div>
          <label for="f-committee">Committee</label>
          <select id="f-committee"><option value="">All committees</option></select>
        </div>
        <div>
          <label for="f-state">Scoring</label>
          <select id="f-state">
            <option value="">Any</option>
            <option value="none">Not scored</option>
            <option value="part">Partly scored</option>
            <option value="done">Scored by both</option>
          </select>
        </div>
      </div>
      <div id="groups"></div>
      <div class="empty hidden" id="empty">No applications yet.</div>
    </div>

    <div id="view-teams" class="hidden"></div>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<!-- Replaces window.confirm(): on mobile, a browser can quietly stop showing
     native confirm/alert dialogs after a couple fire in quick succession — no
     popup, no error, confirm() just returns false, and whatever it guarded
     does nothing with no sign of why. A dialog built from page elements
     always renders, because it is not that native chrome. -->
<dialog id="confirm-dialog" style="max-width:420px;">
  <div class="dlg" style="padding:22px 24px;">
    <p id="confirm-message" style="margin:0 0 20px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-gold" id="confirm-ok">Confirm</button>
    </div>
  </div>
</dialog>

<script type="module">
import { getRubric, totalScore } from "../scoring-rubrics.js";
import { getInterviewConfig } from "../interview-config.js";
import { getRoleGuideById } from "../role-guide-data.js";

const ENDPOINT = "https://upnmxdgqdkvgzfwqaicb.supabase.co/functions/v1/submit";

const IDS_BY_NAME = {
  "tech director": "tech-director", "operations": "operations",
  "branding / media": "branding-media", "hr": "hr",
  "pr / fundraising": "pr-fundraising", "visits": "visits",
  "children day director": "children-day-director", "initiatives director": "initiatives-director"
};
const DISPLAY_NAMES = {
  "tech director": "Tech Team", "initiatives director": "Initiatives",
  "children day director": "Children’s Day"
};
const norm = (v) => String(v ?? "").trim().toLowerCase();
/* Second preferences arrive as "Committee — Head": rename the committee half,
   pass the head through. A bare committee name works the same way. */
const display = (v) => {
  const [committee, ...rest] = String(v ?? "").trim().split("—");
  const head = rest.join("—").trim();
  const named = DISPLAY_NAMES[norm(committee)] ?? committee.trim();
  return head ? `${named} — ${head}` : named;
};
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function confirmDialog(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById("confirm-dialog");
    document.getElementById("confirm-message").textContent = message;
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    const finish = (result) => {
      dlg.close();
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      dlg.removeEventListener("cancel", onCancel);
      resolve(result);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    dlg.addEventListener("cancel", onCancel); // Esc key
    dlg.showModal();
  });
}

let state = { admin: null, data: null, selected: null, teamMsg: null };

async function api(payload) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const body = await res.json();
  if (!res.ok || body.ok === false) throw new Error(body.error || "Something went wrong.");
  return body;
}

const committeeIdOf = (a) => a.committeeId || IDS_BY_NAME[norm(a.roleAppliedFor)] || "";
function headIdOf(a) {
  if (a.headId) return a.headId;
  const name = norm(a.headName);
  return ["engagement", "inclusion", "tracking", "recognition"].find((k) => name.includes(k)) || "";
}

/* The two things an applicant can be scored on: the committee they put first,
   and — for whoever sits in on the second-preference half of the interview —
   the committee they put second. Each carries its own rubric and its own head,
   so they are scored separately and stored as separate rows. */
function preferencesOf(a) {
  const [secondCommittee, ...rest] = String(a.secondPreference || "").split("—");
  const list = [{
    key: "first",
    label: `${display(a.roleAppliedFor)} · ${a.headName || "—"} (first)`,
    committee: a.roleAppliedFor,
    committeeId: committeeIdOf(a),
    headId: headIdOf(a),
    headRole: a.headName || "",
    preference: "First"
  }];
  if (String(a.secondPreference || "").trim()) {
    list.push({
      key: "second",
      label: `${display(a.secondPreference)} (second)`,
      committee: a.secondPreference,
      committeeId: a.secondCommitteeId || IDS_BY_NAME[norm(secondCommittee)] || "",
      headId: a.secondHeadId || "",
      headRole: rest.join("—").trim(),
      preference: "Second"
    });
  }
  return list;
}

/** This admin's own saved score for one applicant on one committee, if any. */
const myScoreFor = (a, committee) => (a.scores || []).find(
  (s) => norm(s.interviewerEmail) === norm(state.admin?.email) && normRole(s.committee) === normRole(committee)
);

const normRole = (v) => String(v ?? "").trim().toLowerCase().replaceAll("/", " ").replace(/\s+/g, " ");

/* A committee collects work before the interview when its own config says so,
   which is the same config the booking flow and the emails read. */
function expectsTask(a) {
  const task = getInterviewConfig(committeeIdOf(a))?.task;
  return Boolean(task?.required && task.submissionUrl);
}
const submittedLink = (a) => {
  const link = String(a.taskLink || "").trim();
  return /^https?:\/\//.test(link) ? link : "";
};

/* There is no second interview slot: a second preference only ever rides
   along on the interview already booked with the first choice, so this is
   the second committee's own answer to "can you make that time" — not a
   score, not a booking. A "Not available" is the cue to assign someone else. */
const secondPrefAvailabilityPill = (a) => {
  if (!a.secondPreference) return "";
  const status = String(a.secondPreferenceAvailability || "").trim();
  if (status === "Available") return `<span class="pill done">Available</span>`;
  if (status === "Not Available") return `<span class="pill bad">Can't make it</span>`;
  return `<span class="pill part">Awaiting reply</span>`;
};

/** Scores for the committee the applicant actually applied to. */
const firstScores = (a) =>
  (a.scores || []).filter((s) => norm(s.committee) === norm(a.roleAppliedFor));

function panelAverage(a) {
  const totals = firstScores(a).map((s) => Number(s.total)).filter(Number.isFinite);
  return totals.length ? totals.reduce((x, y) => x + y, 0) / totals.length : null;
}

function scoringState(a) {
  const n = firstScores(a).length;
  return n === 0 ? "none" : n === 1 ? "part" : "done";
}

/* ── rendering ──────────────────────────────────────────────────────────── */

function renderStats() {
  const all = state.data.applicants;
  const scored = all.filter((a) => scoringState(a) !== "none").length;
  const booked = all.filter((a) => String(a.interviewSlot || "").trim()).length;
  const committees = new Set(all.map((a) => norm(a.roleAppliedFor))).size;
  document.getElementById("stats").innerHTML = [
    [all.length, "Applicants"], [booked, "Interviews booked"],
    [scored, "Scored"], [committees, "Committees active"],
    [state.data.assignments.length, "Third interviewers"]
  ].map(([v, k]) => `<div class="stat"><div class="v num">${v}</div><div class="k">${k}</div></div>`).join("");
}

function renderFilters() {
  const sel = document.getElementById("f-committee");
  const names = [...new Set(state.data.applicants.map((a) => a.roleAppliedFor))].filter(Boolean).sort();
  const current = sel.value;
  sel.innerHTML = `<option value="">All committees</option>` +
    names.map((n) => `<option value="${esc(n)}">${esc(display(n))}</option>`).join("");
  sel.value = current;
}

function visibleApplicants() {
  const committee = document.getElementById("f-committee").value;
  const wanted = document.getElementById("f-state").value;
  return state.data.applicants.filter((a) =>
    (!committee || a.roleAppliedFor === committee) && (!wanted || scoringState(a) === wanted));
}

function renderGroups() {
  const list = visibleApplicants();
  document.getElementById("empty").classList.toggle("hidden", list.length > 0);

  const byCommittee = new Map();
  for (const a of list) {
    const key = a.roleAppliedFor || "Unassigned";
    if (!byCommittee.has(key)) byCommittee.set(key, []);
    byCommittee.get(key).push(a);
  }

  const html = [...byCommittee.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([committee, rows]) => {
    // Ranked by panel average; unscored sink to the bottom rather than counting
    // as zero, which would rank them against people who were actually judged.
    rows.sort((a, b) => {
      const x = panelAverage(a), y = panelAverage(b);
      if (x === null && y === null) return String(a.fullName).localeCompare(String(b.fullName));
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });

    // Only the committees that collect work before the interview carry the
    // column, so the other tables stay as narrow as they were.
    const showTask = rows.some((a) => expectsTask(a));

    return `<section class="committee">
      <h2>${esc(display(committee))} <span class="c">${rows.length} applicant${rows.length === 1 ? "" : "s"}</span></h2>
      <div class="wrap-x"><table>
        <thead><tr>
          <th>#</th><th>Applicant</th><th>Head</th><th>Interview</th>
          ${showTask ? "<th>Task</th>" : ""}
          <th>Score</th><th>Scoring</th><th>Second preference</th><th>3rd interviewer</th>
        </tr></thead>
        <tbody>${rows.map((a, i) => {
          const avg = panelAverage(a);
          const st = scoringState(a);
          const assigned = (a.assignments || []).map((x) => x.assigneeName || x.assigneeEmail).join(", ");
          return `<tr data-email="${esc(a.email)}" aria-current="${norm(a.email) === norm(state.selected)}">
            <td class="num">${avg === null ? "—" : i + 1}</td>
            <td><b>${esc(a.fullName)}</b><div class="note">${esc(a.email)}</div></td>
            <td>${esc(a.headName || "—")}</td>
            <td>${esc(a.interviewSlot || "Not booked")}
                <div class="note">${esc(a.interviewStatus || "")}</div></td>
            ${showTask ? `<td>${
              submittedLink(a)
                ? `<a href="${esc(submittedLink(a))}" target="_blank" rel="noopener">Open</a>
                   <div class="note">${esc(String(a.taskSubmittedAt || "").slice(0, 16).replace("T", " "))}</div>`
                : expectsTask(a) ? `<span class="note">Not submitted</span>` : "—"
            }</td>` : ""}
            <td class="num">${avg === null ? "—" : Math.round(avg) + "/100"}</td>
            <td><span class="pill ${st}">${st === "none" ? "Not scored" : st === "part" ? "1 of 2" : "Both"}</span></td>
            <td>${esc(display(a.secondPreference) || "—")}
                ${secondPrefAvailabilityPill(a) ? `<div style="margin-top:4px;">${secondPrefAvailabilityPill(a)}</div>` : ""}</td>
            <td>${esc(assigned || "—")}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </section>`;
  }).join("");

  document.getElementById("groups").innerHTML = html;
}

/* What the applicant handed in themselves, which is a different thing from the
   link an interviewer pastes onto their own score row. */
function taskLine(a) {
  const link = submittedLink(a);
  if (link) {
    const when = String(a.taskSubmittedAt || "").slice(0, 16).replace("T", " ");
    return `<div class="note">Task submitted${when ? ` ${esc(when)}` : ""}:
      <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div>`;
  }
  return expectsTask(a)
    ? `<div class="note">Task not submitted yet. It is due an hour before the interview.</div>`
    : "";
}

/* Shown just above the assign-a-third-interviewer form: what to act on, and
   why, rather than making HR cross-reference the pill in the table. */
function secondPreferenceStatusBanner(a) {
  const status = String(a.secondPreferenceAvailability || "").trim();
  const committee = display(a.secondPreference);
  const when = String(a.secondPreferenceAvailabilitySetAt || "").slice(0, 16).replace("T", " ");
  if (status === "Not Available") {
    return `<div class="note" style="background:#fdecec;color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
      <b>${esc(committee)} can't cover this interview</b>${when ? ` · told us ${esc(when)}` : ""}.
      ${esc(a.secondPreferenceAvailabilityNote || "")} Assign someone else below.
    </div>`;
  }
  if (status === "Available") {
    return `<div class="note" style="margin-bottom:10px;">${esc(committee)} confirmed they can join this
      interview${when ? ` (${esc(when)})` : ""} — an assignment below is optional, only if you want a third
      opinion anyway.</div>`;
  }
  return `<div class="note" style="margin-bottom:10px;">${esc(committee)} has not said yet whether they can join
    this applicant's interview. If time is short, assign someone else directly.</div>`;
}

function renderDialog(a) {
  const rubric = getRubric(committeeIdOf(a), headIdOf(a));
  const scores = a.scores || [];

  const facts = [
    ["Email", a.email], ["Phone", a.phone], ["Major", a.major], ["Year", a.yearLevel],
    ["First preference", `${display(a.roleAppliedFor)} · ${a.headName || "—"}`],
    ["Second preference", display(a.secondPreference) || "—"],
    ["Second preference availability", a.secondPreference
      ? (String(a.secondPreferenceAvailability || "").trim() || "Awaiting reply")
      : ""],
    ["Interview", a.interviewSlot || "Not booked"],
    ["Interview status", a.interviewStatus || a.status],
    // Only for committees that collect work before the interview.
    ["Task", expectsTask(a) ? (submittedLink(a) ? "Submitted" : "Not submitted") : ""]
  ].filter(([, v]) => String(v ?? "").trim());

  const answers = (a.answers || []).map((qa) =>
    `<div class="q">${esc(qa.prompt)}</div><div class="a">${esc(qa.answer) || "—"}</div>`).join("");

  const scoreRows = scores.length ? scores.map((s) => {
    const breakdown = Object.entries(s.scores || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ");
    return `<div class="srow">
      <div class="who">${esc(s.interviewerName || s.interviewerEmail)}
        <span class="note">${esc(s.interviewerPosition || "")} · ${esc(display(s.committee))}</span></div>
      <div><b>${esc(s.total || "—")}/100</b></div>
      ${breakdown ? `<div class="brk">${breakdown}</div>` : ""}
      ${s.taskLink ? `<div class="brk">Task: <a href="${esc(s.taskLink)}" target="_blank" rel="noopener">${esc(s.taskLink)}</a></div>` : ""}
      ${s.notes ? `<div class="nt">${esc(s.notes)}</div>` : ""}
    </div>`;
  }).join("") : `<div class="note">Nobody has scored this applicant yet.</div>`;

  const panelOptions = (state.data.panel || [])
    .map((p) => `<option value="${esc(p.email)}">${esc(p.name)} — ${esc(display(p.department))} ${esc(p.positionType)}</option>`)
    .join("");

  /* Scoring from here, so whoever actually sat in on the interview can record
     it without being on that committee — including the second-preference half,
     which is exactly the case no committee portal covers. */
  const prefs = preferencesOf(a);
  const prefOptions = prefs
    .map((p, i) => `<option value="${esc(p.key)}"${i === 0 ? " selected" : ""}>${esc(p.label)}</option>`)
    .join("");

  // Prefill the reschedule form from the booked slot: "2026-08-12 at 4:00 PM".
  const slotMatch = String(a.interviewSlot || "").match(/^(\d{4}-\d{2}-\d{2})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  let dateVal = "", timeVal = "";
  if (slotMatch) {
    dateVal = slotMatch[1];
    let hour = Number(slotMatch[2]);
    const meridiem = (slotMatch[4] || "").toUpperCase();
    if (meridiem === "PM" && hour !== 12) hour += 12;
    if (meridiem === "AM" && hour === 12) hour = 0;
    timeVal = `${String(hour).padStart(2, "0")}:${slotMatch[3]}`;
  }

  document.getElementById("dlg-body").innerHTML = `
    <button class="close" id="dlg-close" aria-label="Close">&times;</button>
    <h2>${esc(a.fullName)}</h2>
    <div class="sub">${esc(display(a.roleAppliedFor))} · ${esc(a.headName || "—")}</div>

    <div class="facts">${facts.map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join("")}</div>
    ${a.secondPreference ? `
      <div class="note" style="margin-bottom:8px;">
        Applied in the wrong order? This exchanges their first and second choice — committee and head both.
        ${a.interviewSlot
          ? "Leave the time below blank to keep their interview exactly where it is, or set a new one to move it — either way, one email covers the whole change."
          : "They have no interview booked yet, so there is nothing to move."}
      </div>
      ${a.interviewSlot ? `
        <div class="note" style="margin-bottom:6px;">Currently booked: <b>${esc(a.interviewSlot)}</b></div>
        <div class="row2" style="margin-bottom:10px;">
          <div><label for="swap-date">Also move to date (optional)</label><input type="date" id="swap-date"></div>
          <div><label for="swap-time">Start</label><input type="time" id="swap-time"></div>
        </div>
      ` : ""}
      <div class="row2" style="margin-bottom:14px;">
        <div style="flex:0 0 auto;"><button class="btn btn-sm btn-ghost" id="swap-preferences">Swap first / second</button></div>
      </div>
      <div class="msg" id="swap-msg"></div>
    ` : ""}
    ${/^https?:\/\//.test(a.meetLink || "") ? `<div class="note">Meet: <a href="${esc(a.meetLink)}" target="_blank" rel="noopener">${esc(a.meetLink)}</a></div>` : ""}
    ${taskLine(a)}

    <h3 class="sec">Application</h3>
    <div class="qa">${answers || "<div class='note'>No answers recorded.</div>"}</div>

    <h3 class="sec">Scores and notes</h3>
    ${scoreRows}
    ${rubric ? "" : `<div class="note">${esc(display(a.roleAppliedFor))} has no rubric in its brief, so its interviews are notes only.</div>`}

    <h3 class="sec">Score this applicant yourself</h3>
    <div class="note" style="margin-bottom:10px;">
      If you sat in on this interview, record it here — you do not have to be on the committee.
      Pick which preference you are scoring; each is saved separately under your name.
    </div>
    <div class="row2" style="margin-bottom:12px;">
      <div style="flex:2 1 280px;">
        <label for="score-pref">Scoring for</label>
        <select id="score-pref">${prefOptions}</select>
      </div>
      <div style="flex:0 0 auto; align-self:end;"><span class="note" id="score-total">—</span></div>
    </div>
    <div id="score-form"></div>
    <div class="msg" id="score-msg"></div>

    <h3 class="sec">Assign a third interviewer</h3>
    ${a.secondPreference ? secondPreferenceStatusBanner(a) : ""}
    <div class="note" style="margin-bottom:8px;">
      They will see this applicant under “Assigned to me” and can score
      ${esc(display(a.secondPreference) || "the second preference")} with that committee's own rubric.
    </div>
    <div class="row2">
      <div style="flex:2 1 260px;">
        <label for="assignee">Interviewer</label>
        <select id="assignee">${panelOptions}</select>
      </div>
      <div>
        <label for="assign-committee">Scoring for</label>
        <select id="assign-committee">
          ${a.secondPreference ? `<option value="${esc(a.secondPreference)}">${esc(display(a.secondPreference))} (second)</option>` : ""}
          <option value="${esc(a.roleAppliedFor)}">${esc(display(a.roleAppliedFor))} (first)</option>
        </select>
      </div>
      <div style="flex:0 0 auto;"><button class="btn btn-sm" id="assign">Assign</button></div>
    </div>
    <div class="msg" id="assign-msg"></div>

    <h3 class="sec">Reschedule interview</h3>
    ${a.reservationRowIndex ? `
      <div class="note" style="margin-bottom:8px;">
        Moves the calendar event and emails the applicant. Coordinate with them first.
      </div>
      <div class="row2">
        <div><label for="re-date">Date</label><input type="date" id="re-date" value="${esc(dateVal)}"></div>
        <div><label for="re-time">Start</label><input type="time" id="re-time" value="${esc(timeVal)}"></div>
        <div style="flex:0 0 auto;"><button class="btn btn-sm btn-ghost" id="reschedule">Reschedule</button></div>
      </div>
      ${a.interviewSlot ? `
        <div class="row2" style="margin-top:14px;">
          <div class="note">Only if they are pulling out altogether. This withdraws the application,
            frees the slot, and emails them. To move them to another time, use the date and time above.</div>
          <div style="flex:0 0 auto;"><button class="btn btn-sm btn-ghost" id="cancel-interview">Withdraw application</button></div>
        </div>` : `<div class="note" style="margin-top:10px;">This application was withdrawn. Booking a date above puts them back in.</div>`}
      <div class="msg" id="re-msg"></div>`
      : `<div class="note">No booked interview to move.</div>`}
  `;

  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();

  document.getElementById("dlg-close").onclick = () => dlg.close();

  document.getElementById("assign").onclick = async (e) => {
    const btn = e.currentTarget;
    const msg = document.getElementById("assign-msg");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Assigning…";
    try {
      await api({
        mode: "heads-assign-interviewer",
        email: state.admin.email,
        applicantEmail: a.email,
        committee: document.getElementById("assign-committee").value,
        headRole: a.headName || "",
        assigneeEmail: document.getElementById("assignee").value
      });
      msg.className = "msg ok"; msg.textContent = "Assigned.";
      await load(state.admin.email, true);
    } catch (err) {
      msg.className = "msg bad"; msg.textContent = err.message;
    } finally { btn.disabled = false; }
  };

  const reBtn = document.getElementById("reschedule");
  if (reBtn) reBtn.onclick = async (e) => {
    const btn = e.currentTarget;
    const msg = document.getElementById("re-msg");
    const date = document.getElementById("re-date").value;
    const startTime = document.getElementById("re-time").value;
    if (!date || !startTime) { msg.className = "msg bad"; msg.textContent = "Pick a date and time."; return; }
    if (!(await confirmDialog(`Move ${a.fullName}'s interview to ${date} at ${startTime}? This emails them.`))) return;
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Rescheduling…";
    try {
      const r = await api({
        mode: "heads-reschedule", email: state.admin.email,
        reservationRowIndex: a.reservationRowIndex, date, startTime
      });
      msg.className = "msg ok";
      msg.textContent = `Moved.${r.emailSent ? " Applicant emailed." : " Email not sent."}`;
      await load(state.admin.email, true);
    } catch (err) {
      msg.className = "msg bad"; msg.textContent = err.message;
    } finally { btn.disabled = false; }
  };

  const cancelBtn = document.getElementById("cancel-interview");
  if (cancelBtn) cancelBtn.onclick = async (e) => {
    const btn = e.currentTarget;
    const msg = document.getElementById("re-msg");
    if (!(await confirmDialog(`Withdraw ${a.fullName}'s application?\n\n` +
      `Their interview on ${a.interviewSlot || "their booked slot"} is cancelled, the slot goes back on the board, ` +
      "and they are emailed to say the application is withdrawn."))) return;
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Withdrawing…";
    try {
      const r = await api({
        mode: "heads-cancel-interview",
        email: state.admin.email,
        applicantEmail: a.email,
        committee: a.roleAppliedFor
      });
      msg.className = "msg ok";
      msg.textContent = `Withdrawn.${r.emailSent ? " Applicant emailed." : " Email not sent."}`;
      await load(state.admin.email, true);
    } catch (err) {
      msg.className = "msg bad"; msg.textContent = err.message;
    } finally { btn.disabled = false; }
  };

  const swapBtn = document.getElementById("swap-preferences");
  if (swapBtn) swapBtn.onclick = async (e) => {
    const btn = e.currentTarget;
    const msg = document.getElementById("swap-msg");
    const swapDate = document.getElementById("swap-date")?.value || "";
    const swapTime = document.getElementById("swap-time")?.value || "";
    if ((swapDate && !swapTime) || (!swapDate && swapTime)) {
      msg.className = "msg bad"; msg.textContent = "Set both the date and the time, or leave both blank.";
      return;
    }
    const moving = Boolean(swapDate && swapTime);
    if (!(await confirmDialog(`Swap ${a.fullName}'s first and second preference?\n\n` +
      `${display(a.roleAppliedFor)} · ${a.headName || "—"} becomes their second choice, and ` +
      `${display(a.secondPreference)} becomes their first.` +
      (moving
        ? ` Their interview moves to ${swapDate} at ${swapTime}, with the new first-preference committee.`
        : " Nothing already booked moves.") +
      " One email covers the applicant, cc the new first-preference committee and HR; the committee they just left is notified separately."))) return;
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Swapping…";
    try {
      const r = await api({
        mode: "heads-swap-preferences",
        email: state.admin.email,
        applicantEmail: a.email,
        ...(moving ? { date: swapDate, startTime: swapTime } : {})
      });
      msg.className = "msg ok";
      msg.textContent = `Swapped.${r.applicantEmailSent ? " Applicant emailed." : " Applicant email not sent."}` +
        `${r.committeeNotified ? " Old committee notified." : " Old committee not notified."}`;
      await load(state.admin.email, true);
    } catch (err) {
      msg.className = "msg bad"; msg.textContent = err.message;
    } finally { btn.disabled = false; }
  };

  wireScoring(a, prefs);
}

/* ── scoring from the admin side ────────────────────────────────────────── */

/**
 * Renders the rubric for whichever preference is selected, prefilled with this
 * admin's own previous score for it. A committee with no rubric in its brief
 * still gets the notes box — notes are the record in that case.
 */
function renderScoreForm(a, pref) {
  const rubric = getRubric(pref.committeeId, pref.headId);
  const mine = myScoreFor(a, pref.committee);
  const box = document.getElementById("score-form");

  const criteria = rubric
    ? rubric.criteria.map((c) => {
        const id = `sc-${c.name.replace(/\W+/g, "-")}`;
        const value = mine?.scores?.[c.name];
        return `<div class="row2" style="margin-bottom:8px;">
          <div><label for="${id}">${esc(c.name)} <span class="note">out of ${c.weight}</span></label>
            <input type="number" id="${id}" data-criterion="${esc(c.name)}" min="0" max="${c.weight}" step="1"
                   value="${value === undefined || value === null ? "" : esc(value)}" placeholder="0–${c.weight}"></div>
        </div>`;
      }).join("")
    : `<div class="note" style="margin-bottom:8px;">${esc(display(pref.committee))} has no rubric in its brief,
        so record what you saw in the notes.</div>`;

  box.innerHTML = `${criteria}
    <div style="margin-top:10px;">
      <label for="score-notes">Notes</label>
      <textarea id="score-notes" rows="4"
        placeholder="What they actually said. Specifics beat impressions.">${esc(mine?.notes || "")}</textarea>
    </div>
    <div style="margin-top:10px;">
      <label for="score-task">Task link (optional)</label>
      <input type="url" id="score-task" placeholder="https://…" value="${esc(mine?.taskLink || submittedLink(a))}">
    </div>
    <div class="row2" style="margin-top:12px;">
      <div style="flex:0 0 auto;"><button class="btn btn-sm" id="score-save">Save my score</button></div>
      <div class="note" style="align-self:center;">${mine
        ? "Last saved " + esc(String(mine.updatedAt).slice(0, 16).replace("T", " "))
        : "Not scored by you yet"}</div>
    </div>`;

  updateScoreTotal(pref);
  box.querySelectorAll("input[data-criterion]").forEach((input) => {
    input.addEventListener("input", () => updateScoreTotal(pref));
  });
  document.getElementById("score-save").onclick = () => saveScore(a, pref);
}

const readScores = () => {
  const scores = {};
  document.querySelectorAll("#score-form input[data-criterion]").forEach((input) => {
    const raw = input.value.trim();
    if (raw !== "") scores[input.dataset.criterion] = Number(raw);
  });
  return scores;
};

function updateScoreTotal(pref) {
  const rubric = getRubric(pref.committeeId, pref.headId);
  const total = totalScore(rubric, readScores());
  document.getElementById("score-total").textContent =
    total === null ? (rubric ? "Fill every criterion for a total" : "Notes only") : `${total}/100`;
}

function wireScoring(a, prefs) {
  const select = document.getElementById("score-pref");
  if (!select) return;
  const current = () => prefs.find((p) => p.key === select.value) ?? prefs[0];
  renderScoreForm(a, current());
  select.onchange = () => renderScoreForm(a, current());
}

async function saveScore(a, pref) {
  const msg = document.getElementById("score-msg");
  const btn = document.getElementById("score-save");
  const rubric = getRubric(pref.committeeId, pref.headId);
  const scores = readScores();
  const total = totalScore(rubric, scores);
  const notes = document.getElementById("score-notes").value.trim();

  if (rubric && total === null && !notes) {
    msg.className = "msg bad";
    msg.textContent = "Score every criterion, or leave a note saying why you could not.";
    return;
  }

  btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  try {
    await api({
      mode: "heads-save-score",
      email: state.admin.email,
      applicantEmail: a.email,
      committee: pref.committee,
      headRole: pref.headRole,
      preference: pref.preference,
      scores,
      total: total === null ? "" : total,
      notes,
      taskLink: document.getElementById("score-task").value.trim()
    });
    msg.className = "msg ok"; msg.textContent = "Saved.";
    await load(state.admin.email, true);
  } catch (err) {
    msg.className = "msg bad"; msg.textContent = err.message;
  } finally { btn.disabled = false; }
}

/* ── team diagrams (admin approval) ────────────────────────────────────── */

/* Every committee recruiting this cycle: its raw sheet name (what the API
   expects as `committee`) paired with its role-guide id (what the head list
   is keyed by). */
const CYCLE_COMMITTEES = [
  { raw: "Tech Director", id: "tech-director" },
  { raw: "Operations", id: "operations" },
  { raw: "Branding / Media", id: "branding-media" },
  { raw: "HR", id: "hr" },
  { raw: "PR / Fundraising", id: "pr-fundraising" },
  { raw: "Visits", id: "visits" },
  { raw: "Children Day Director", id: "children-day-director" },
  { raw: "Initiatives Director", id: "initiatives-director" }
];

function teamApplicantsFor(rawCommittee) {
  const label = display(rawCommittee);
  return state.data.applicants.filter((a) => a.acceptedStatus && norm(a.acceptedCommittee) === norm(label));
}

/* Drafted but stuck behind the applicant's own first-preference committee,
   who has not released them yet — mirrors the same rule the committee portal
   and the backend both enforce. */
function isHeldForFirstPreference(a, rawCommittee) {
  return a.acceptedStatus === "Draft" && normRole(a.roleAppliedFor) !== normRole(rawCommittee) && !a.firstPreferenceReleased;
}

function adminChip(a, rawCommittee) {
  const pending = isHeldForFirstPreference(a, rawCommittee);
  const label = a.acceptedStatus === "Yes" ? "Sent" : a.acceptedStatus === "Submitted" ? "Submitted" : pending ? "Pending" : "Draft";
  const cls = a.acceptedStatus === "Yes" ? "sent" : a.acceptedStatus === "Submitted" ? "submitted" : pending ? "pending" : "draft";
  return `<div class="slot-chip">
    <span>${esc(a.fullName)}</span>
    <span class="chip-status ${cls}">${label}</span>
    ${a.acceptedStatus === "Submitted" ? `<button type="button" class="chip-x" data-reject="${esc(a.email)}" data-reject-committee="${esc(rawCommittee)}" title="Reject — sends it back to Draft on their diagram">↺</button>` : ""}
  </div>`;
}

function renderTeamCommittee(rawCommittee, guideId) {
  const heads = getRoleGuideById(guideId)?.heads ?? [];
  const applicants = teamApplicantsFor(rawCommittee);

  const submitted = applicants.filter((a) => a.acceptedStatus === "Submitted");
  const sent = applicants.filter((a) => a.acceptedStatus === "Yes");
  const pending = applicants.filter((a) => isHeldForFirstPreference(a, rawCommittee));

  const boxes = heads.map((h) => {
    const inRole = applicants.filter((a) => norm(a.acceptedRole) === norm(h.name));
    const headHolders = inRole.filter((a) => a.acceptedPosition === "Head");
    const members = inRole.filter((a) => a.acceptedPosition === "Member");
    return `<div class="role-box ${headHolders.length ? "" : "missing"}">
      <div class="role-box-title">${esc(h.name)}</div>
      <div class="slot-group"><div class="slot-label">Head</div>
        ${headHolders.length ? headHolders.map((a) => adminChip(a, rawCommittee)).join("") : `<div class="note">No head assigned yet.</div>`}</div>
      <div class="slot-group"><div class="slot-label">Members</div>
        ${members.length ? members.map((a) => adminChip(a, rawCommittee)).join("") : `<div class="note">None yet.</div>`}</div>
    </div>`;
  }).join("");

  const missing = heads
    .filter((h) => !applicants.some((a) => norm(a.acceptedRole) === norm(h.name) && a.acceptedPosition === "Head"))
    .map((h) => h.name);

  return { raw: rawCommittee, label: display(rawCommittee), boxes, missing, submittedCount: submitted.length, sentCount: sent.length, pendingCount: pending.length };
}

function renderTeams() {
  const el = document.getElementById("view-teams");
  if (!state.data) return;

  const results = CYCLE_COMMITTEES.map((c) => renderTeamCommittee(c.raw, c.id));
  const totalSubmitted = results.reduce((n, r) => n + r.submittedCount, 0);
  const totalMissing = results.reduce((n, r) => n + r.missing.length, 0);
  const stillMissing = results.filter((r) => r.missing.length);

  const summary = `
    <div class="team-summary">
      <span class="count"><b>${totalSubmitted}</b> submitted, awaiting your approval</span>
      <span class="count"><b>${totalMissing}</b> head roles still unfilled, across ${stillMissing.length} committee${stillMissing.length === 1 ? "" : "s"}</span>
    </div>
    ${stillMissing.length ? `
      <div class="missing-summary">
        <div class="missing-summary-title">Still missing a Head — extend the deadline for these roles only, approving is not blocked by them</div>
        <div class="missing-grid">
          ${stillMissing.map((r) => `
            <div class="missing-name">${esc(r.label)}</div>
            <div class="missing-roles">${r.missing.map((m) => `<span class="role-chip">${esc(m)}</span>`).join("")}</div>
          `).join("")}
        </div>
      </div>` : ""}
    ${state.teamMsg ? `<div class="msg ${state.teamMsg.type}" style="margin:-6px 0 20px;">${esc(state.teamMsg.text)}</div>` : ""}`;

  const sections = results.map((r) => `
    <section class="committee">
      <h2>${esc(r.label)}
        <span class="c">${r.sentCount} sent · ${r.submittedCount} awaiting approval${r.pendingCount ? ` · ${r.pendingCount} pending first preference` : ""}</span>
      </h2>
      ${r.missing.length ? `<div class="note" style="margin-bottom:8px;">Still missing a Head for: ${r.missing.map(esc).join(", ")}.</div>` : ""}
      <div class="team-grid">${r.boxes}</div>
      <div class="row2" style="align-items:center;">
        <div class="note">${r.submittedCount ? `${r.submittedCount} submitted by the committee, ready for your approval.` : "Nothing submitted yet."}</div>
        <div style="flex:0 0 auto;">
          <button class="btn btn-sm btn-gold" data-approve="${esc(r.raw)}"${r.submittedCount ? "" : " disabled"}>Approve & send${r.submittedCount ? ` (${r.submittedCount})` : ""}</button>
        </div>
      </div>
    </section>`).join("");

  el.innerHTML = `${summary}${sections}`;
}

async function approveTeam(rawCommittee, btn) {
  const label = display(rawCommittee);
  const count = btn.textContent.match(/\((\d+)\)/)?.[1] ?? "these";
  if (!(await confirmDialog(`Approve and send acceptance emails for ${count} applicant(s) in ${label}?\n\nThis emails them immediately, cc the committee and HR.`))) return;

  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await api({ mode: "heads-admin-confirm-team", email: state.admin.email, committee: rawCommittee });
    state.teamMsg = {
      type: "ok",
      text: `${label}: sent ${r.sent.length}.${r.missingHeadRoles.length ? ` Still no Head for: ${r.missingHeadRoles.join(", ")}.` : ""}`
    };
    await load(state.admin.email);
    renderTeams();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    renderTeams();
  }
}

async function rejectSubmission(email, rawCommittee) {
  const a = state.data.applicants.find((x) => norm(x.email) === norm(email));
  const label = display(rawCommittee);
  if (!(await confirmDialog(`Reject ${a?.fullName || "this applicant"}'s submission for ${label}?\n\nSends it back to Draft on the committee's own diagram — nobody is emailed, and they can revise and resubmit it.`))) return;

  try {
    await api({ mode: "heads-admin-reject-applicant", email: state.admin.email, applicantEmail: email, committee: rawCommittee });
    state.teamMsg = { type: "ok", text: `${a?.fullName || "Applicant"}: sent back to Draft for ${label} to revise.` };
    await load(state.admin.email);
    renderTeams();
  } catch (err) {
    state.teamMsg = { type: "bad", text: err.message };
    renderTeams();
  }
}

/* ── actions ────────────────────────────────────────────────────────────── */

async function load(email, keepDialog) {
  const data = await api({ mode: "heads-admin-load", email });
  state.admin = data.admin;
  state.data = data;
  sessionStorage.setItem("recruitmentAdminEmail", data.admin.email);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("bar-sub").textContent = `${data.admin.name} · ${data.admin.email}`;
  renderStats(); renderFilters(); renderGroups(); renderTeams();
  if (keepDialog && state.selected) {
    const a = state.data.applicants.find((x) => norm(x.email) === norm(state.selected));
    if (a) renderDialog(a);
  }
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.classList.add("hidden");
  if (!email) { err.textContent = "Enter your AUC email."; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try { await load(email); }
  catch (e) { err.textContent = e.message; err.classList.remove("hidden"); }
  finally { btn.disabled = false; btn.textContent = "Enter"; }
});
document.getElementById("email").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("groups").addEventListener("click", (e) => {
  const row = e.target.closest("[data-email]");
  if (!row) return;
  state.selected = row.dataset.email;
  renderGroups();
  const a = state.data.applicants.find((x) => norm(x.email) === norm(state.selected));
  if (a) renderDialog(a);
});

for (const id of ["f-committee", "f-state"]) {
  document.getElementById(id).addEventListener("change", renderGroups);
}

document.getElementById("views").addEventListener("click", (e) => {
  const view = e.target.closest("[data-view]");
  if (!view) return;
  state.teamMsg = null;
  document.getElementById("view-applicants").classList.toggle("hidden", view.dataset.view !== "applicants");
  document.getElementById("view-teams").classList.toggle("hidden", view.dataset.view !== "teams");
  for (const btn of document.querySelectorAll("#views [data-view]")) {
    btn.setAttribute("aria-selected", btn.dataset.view === view.dataset.view);
  }
  if (view.dataset.view === "teams") renderTeams();
});

document.getElementById("view-teams").addEventListener("click", (e) => {
  const approveBtn = e.target.closest("[data-approve]");
  if (approveBtn) { approveTeam(approveBtn.dataset.approve, approveBtn); return; }
  const rejectBtn = e.target.closest("[data-reject]");
  if (rejectBtn) { rejectSubmission(rejectBtn.dataset.reject, rejectBtn.dataset.rejectCommittee); return; }
});

document.getElementById("refresh").addEventListener("click", () => load(state.admin.email));
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("recruitmentAdminEmail");
  location.reload();
});

const saved = sessionStorage.getItem("recruitmentAdminEmail");
if (saved) load(saved).catch(() => sessionStorage.removeItem("recruitmentAdminEmail"));
</script>
</body>
</html>
