<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Committee Portal — Resala AUC</title>
  <!--
    The portal that used to live here belonged to the director cycle: it listed
    applicants for board positions that have since been filled, and it showed
    their task submissions, which this cycle does not use. The heads-cycle
    equivalent is the committee portal, so anyone holding an old link lands
    there instead of on a page describing a finished cycle. The previous page is
    in git history if it is ever needed again.
  -->
  <meta http-equiv="refresh" content="0; url=../committee/">
  <link rel="canonical" href="../committee/">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fdf9f3;
      color: #1b1f23;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }
    a { color: #0c2c80; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d111c; color: #f4efe6; }
      a { color: #a7d4f2; }
    }
  </style>
</head>
<body>
  <main>
    <p>The heads recruitment portal has moved.</p>
    <p><a href="../committee/">Open the committee portal</a></p>
  </main>
  <script>location.replace("../committee/");</script>
</body>
</html>
